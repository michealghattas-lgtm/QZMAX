  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function aiFormatInstruction(questionType, optsPerQ){
    if(questionType==='true_false'){
      return [
        'QUESTION FORMAT REQUIREMENT: TRUE/FALSE ONLY.',
        'Every item must be answerable as True or False without ambiguity.',
        'Return exactly two options in this exact order: ["True","False"].',
        'Return correctIndex as 0 for True or 1 for False.'
      ].join(' ');
    }
    if(questionType==='multiple_correct'){
      return [
        'QUESTION FORMAT REQUIREMENT: SELECT MULTIPLE.',
        'Every item must have '+optsPerQ+' answer options and AT LEAST TWO correct options.',
        'Return ALL correct zero-based indexes in a JSON array named correctIndexes.',
        'Also set correctIndex to the first value in correctIndexes for backward compatibility.',
        'The complete set of correct options must be unambiguous.'
      ].join(' ');
    }
    return [
      'QUESTION FORMAT REQUIREMENT: MULTIPLE CHOICE.',
      'Every item must have exactly one defensible correct option.',
      'Return its zero-based index in correctIndex.'
    ].join(' ');
  }

  function normalizeQuestionFingerprint(text){
    return String(text||'')
      .toLowerCase()
      .replace(/&[a-z]+;/g,' ')
      .replace(/[^a-z0-9\s]/g,' ')
      .replace(/\b(the|a|an|is|are|was|were|of|to|in|on|for|and|or|which|what|who|when|where|how)\b/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function questionTokenSet(text){
    return new Set(normalizeQuestionFingerprint(text).split(' ').filter(w=>w.length>2));
  }

  function questionSimilarity(a,b){
    const na = normalizeQuestionFingerprint(a);
    const nb = normalizeQuestionFingerprint(b);
    if(!na || !nb) return 0;
    if(na===nb) return 1;
    if(na.length>20 && nb.length>20 && (na.includes(nb) || nb.includes(na))) return .93;
    const A = questionTokenSet(na), B = questionTokenSet(nb);
    if(!A.size || !B.size) return 0;
    let intersection = 0;
    A.forEach(x=>{ if(B.has(x)) intersection++; });
    const union = new Set([...A,...B]).size;
    return union ? intersection/union : 0;
  }

  function isNearDuplicateQuestion(candidate, existing){
    return existing.some(q=>{
      const stem = typeof q==='string' ? q : q && q.q;
      return stem && questionSimilarity(candidate,stem) >= .68;
    });
  }

  function cleanSourceText(text){
    return String(text||'')
      .replace(/\u0000/g,' ')
      .replace(/[ \t]+/g,' ')
      .replace(/\n{3,}/g,'\n\n')
      .trim();
  }

  async function extractQuizSourceDocument(file){
    const name = String(file && file.name || '');
    const ext = name.split('.').pop().toLowerCase();

    if(ext==='txt'){
      const text = cleanSourceText(await file.text());
      if(text.length < 80) throw new Error('This text file does not contain enough readable content.');
      return {type:'txt', text:text.slice(0,220000), pages:0};
    }

    if(ext==='docx'){
      if(!window.mammoth) throw new Error('The Word document reader could not load. Check your internet connection and try again.');
      const buffer = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({arrayBuffer:buffer});
      const text = cleanSourceText(result.value);
      if(text.length < 80) throw new Error('No usable text could be extracted from this Word document.');
      return {type:'docx', text:text.slice(0,220000), pages:0};
    }

    if(ext==='pdf'){
      if(!window.pdfjsLib) throw new Error('The PDF reader could not load. Check your internet connection and try again.');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;
      const pages = [];
      const pageLimit = Math.min(pdf.numPages,250);
      for(let p=1;p<=pageLimit;p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const pageText = content.items.map(it=>it.str).join(' ');
        if(pageText.trim()) pages.push('[Page '+p+']\n'+pageText.trim());
        if(pages.join('\n\n').length > 220000) break;
      }
      const text = cleanSourceText(pages.join('\n\n')).slice(0,220000);
      if(text.length < 80) throw new Error('No selectable text could be extracted. This PDF may be scanned/image-only.');
      return {type:'pdf', text, pages:pdf.numPages};
    }

    throw new Error('Unsupported file type. Please use PDF, DOCX or TXT.');
  }

  async function fetchTrustedKnowledge(topic){
    const endpoint = 'https://en.wikipedia.org/w/api.php';
    const searchUrl = endpoint+'?action=query&list=search&format=json&origin=*&srlimit=5&srsearch='+encodeURIComponent(topic);
    let searchData;
    try{
      const r = await fetch(searchUrl);
      if(!r.ok) throw new Error();
      searchData = await r.json();
    }catch(e){
      throw new Error('Trusted knowledge lookup could not reach Wikipedia. Check your connection and try again.');
    }

    const hits = searchData && searchData.query && Array.isArray(searchData.query.search) ? searchData.query.search : [];
    if(!hits.length) return {text:'',sources:[],label:'Wikipedia reference material'};

    const titles = hits.slice(0,5).map(x=>x.title);
    const extractUrl = endpoint+'?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles='+encodeURIComponent(titles.join('|'));
    const r2 = await fetch(extractUrl);
    if(!r2.ok) throw new Error('Wikipedia reference retrieval failed.');
    const data = await r2.json();
    const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];

    const parts = [];
    const sources = [];
    pages.forEach(page=>{
      if(!page || !page.extract) return;
      parts.push('SOURCE ARTICLE: '+page.title+'\n'+cleanSourceText(page.extract));
      sources.push('https://en.wikipedia.org/wiki/'+encodeURIComponent(String(page.title).replace(/ /g,'_')));
    });

    return {
      text:parts.join('\n\n---\n\n').slice(0,70000),
      sources,
      label:'Wikipedia · '+titles.slice(0,3).join(', ')
    };
  }

  function selectSourceExcerpt(sourceText, topic, batchNumber, maxChars=15000){
    const text = cleanSourceText(sourceText);
    if(text.length <= maxChars) return text;

    const paragraphs = text.split(/\n{2,}|(?<=\.)\s+(?=[A-Z\[])/).map(p=>p.trim()).filter(p=>p.length>50);
    const terms = normalizeQuestionFingerprint(topic).split(' ').filter(w=>w.length>3);
    const scored = paragraphs.map((p,i)=>{
      const lower = p.toLowerCase();
      let score = 0;
      terms.forEach(t=>{ if(lower.includes(t)) score += 3; });
      if(/^\[Page \d+\]/.test(p)) score += .2;
      return {p,i,score};
    });

    scored.sort((a,b)=>b.score-a.score || a.i-b.i);
    const chosen = [];
    let chars = 0;
    for(const item of scored){
      if(chars + item.p.length > maxChars && chosen.length) continue;
      chosen.push(item);
      chars += item.p.length + 2;
      if(chars >= maxChars) break;
    }

    // If relevance scoring is weak, rotate through the source for later batches.
    if(!chosen.length || chosen[0].score===0){
      const start = ((batchNumber||0) * maxChars) % Math.max(1,text.length);
      return (text.slice(start,start+maxChars) + '\n' + text.slice(0,Math.max(0,maxChars-(text.length-start)))).slice(0,maxChars);
    }

    chosen.sort((a,b)=>a.i-b.i);
    return chosen.map(x=>x.p).join('\n\n').slice(0,maxChars);
  }

  function parseAICorrectIndexes(item, options){
    const max = options.length;
    let raw = null;
    if(Array.isArray(item.correctIndexes)) raw = item.correctIndexes;
    else if(Array.isArray(item.correctIndices)) raw = item.correctIndices;
    else if(Array.isArray(item.correctAnswers)) raw = item.correctAnswers;
    else if(Array.isArray(item.correctIndex)) raw = item.correctIndex;
    if(!raw) return [];
    const indexes = [];
    raw.forEach(v=>{
      if(typeof v==='number' || /^\d+$/.test(String(v).trim())){
        const n = parseInt(v,10);
        if(Number.isInteger(n) && n>=0 && n<max) indexes.push(n);
      }else{
        const text = String(v).trim().toLowerCase();
        const idx = options.findIndex(o=>String(o).trim().toLowerCase()===text);
        if(idx>=0) indexes.push(idx);
      }
    });
    return [...new Set(indexes)].sort((a,b)=>a-b);
  }

  function aiQuestionStructuralCheck(q){
    if(!q || !q.q || !Array.isArray(q.options) || q.options.length<2) return false;
    const uniqueOptions = new Set(q.options.map(o=>String(o).trim().toLowerCase()));
    if(uniqueOptions.size !== q.options.length) return false;
    if(q.type==='multiple_correct'){
      return Array.isArray(q.correctIndexes) && q.correctIndexes.length>=2 &&
        q.correctIndexes.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length);
    }
    return Number.isInteger(q.correct) && q.correct>=0 && q.correct<q.options.length;
  }

  function getAIQuestionVerificationMeta(sourceType,sourceName,sourceUrls,item){
    if(sourceType==='document'){
      return {
        kind:'document',
        label:'Document Grounded',
        sourceName:sourceName||'Uploaded document',
        evidence:typeof item.sourceEvidence==='string' ? item.sourceEvidence.slice(0,500) : '',
        sourcePage:item.sourcePage||''
      };
    }
    if(sourceType==='trusted'){
      return {
        kind:'source',
        label:'Source Grounded',
        sourceName:sourceName||'Trusted reference material',
        sourceUrls:Array.isArray(sourceUrls)?sourceUrls.slice(0,5):[],
        evidence:typeof item.sourceEvidence==='string' ? item.sourceEvidence.slice(0,500) : ''
      };
    }
    return {kind:'review',label:'AI • Review',sourceName:''};
  }

  async function generateQuestionsWithAI(topic, count, optsPerQ, questionType, context={}){
    const requestedType = ['multiple_choice','true_false','multiple_correct'].includes(questionType)
      ? questionType : 'multiple_choice';
    const formatInstruction = aiFormatInstruction(requestedType, optsPerQ);
    const existing = Array.isArray(context.existingQuestions) ? context.existingQuestions : [];
    const existingStems = existing.slice(-70).map((q,i)=>(i+1)+'. '+(typeof q==='string'?q:(q.q||''))).filter(Boolean);
    const sourceExcerpt = context.sourceExcerpt || '';
    const questionLanguage = context.questionLanguage || 'English';
    const languageInstruction = questionLanguage === 'Egyptian Simple Arabic'
      ? [
          'LANGUAGE REQUIREMENT: Generate the complete visible quiz content in simple Egyptian Arabic.',
          'Write every question, every answer option, and every explanation in easy-to-understand Egyptian Arabic as naturally used in Egypt.',
          'Keep the wording simple, friendly, direct, and suitable for a broad audience.',
          'Avoid overly formal Modern Standard Arabic unless needed for a proper academic term, quotation, technical name, or exact source wording.',
          'Use common Egyptian wording such as "إيه", "مين", "فين", "إمتى", and simple sentence structure when appropriate, but do not overuse slang or write in a way that feels comic or exaggerated.',
          'Keep proper nouns, scientific names, dates, numbers, and technical terms accurate. When a commonly used Arabic form exists, use it.',
          'Do not change the factual meaning of source-grounded content when simplifying the language.',
          'Return JSON keys/field names in English exactly as required by the API schema, but all visible quiz text must be in simple Egyptian Arabic.'
        ].join(' ')
      : questionLanguage === 'Arabic'
      ? [
          'LANGUAGE REQUIREMENT: Generate the complete quiz content in Modern Standard Arabic.',
          'Write every question, every answer option, and every explanation in Arabic.',
          'Use clear educational Arabic suitable for a broad audience.',
          'Do not translate proper nouns when a commonly used Arabic form exists; otherwise transliterate naturally.',
          'Return JSON keys/field names in English exactly as required by the API schema, but all visible quiz text must be Arabic.'
        ].join(' ')
      : [
          'LANGUAGE REQUIREMENT: Generate the complete quiz content in English.',
          'Write every question, every answer option, and every explanation in English.'
        ].join(' ');

    const sourceRule = sourceExcerpt
      ? [
          'CRITICAL SOURCE RULE: Use ONLY facts explicitly supported by the SOURCE MATERIAL below.',
          'Do not use outside memory to fill gaps.',
          'If a fact is uncertain, controversial, time-sensitive, or not directly supported by the source, do not make a question about it.',
          'Every correct answer must be defensible from the source.',
          'Avoid ambiguous distractors that could also be correct.',
          'When possible include sourceEvidence as a short supporting phrase and sourcePage if a page marker is visible.',
          'SOURCE MATERIAL:',
          sourceExcerpt
        ].join('\n')
      : 'Accuracy requirement: use established facts, avoid disputed/time-sensitive claims, and make exactly one defensible answer unless Select Multiple is requested.';

    const duplicateRule = existingStems.length
      ? 'DO NOT repeat, paraphrase, or test the same underlying fact as any of these existing questions:\n'+existingStems.join('\n')
      : 'Create distinct questions that test different facts.';

    const enhancedTopic = [
      topic,
      languageInstruction,
      formatInstruction,
      sourceRule,
      duplicateRule,
      'Return clean JSON only in the schema expected by the quiz application.'
    ].join('\n\n');

    let res;
    try{
      res = await fetch('/.netlify/functions/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          topic:enhancedTopic,
          originalTopic:topic,
          count,
          optsPerQ,
          questionType:requestedType,
          formatInstruction,
          existingQuestions:existingStems,
          sourceType:context.sourceType||'',
          sourceName:context.sourceName||'',
          questionLanguage
        })
      });
    }catch(e){
      throw new Error('Could not reach the AI server — check your connection.');
    }

    let items;
    try{ items = await res.json(); }catch(e){ throw new Error('Could not read the AI server response.'); }
    if(!res.ok) throw new Error(items.error || 'Server error generating questions.');
    if(!Array.isArray(items) || !items.length) throw new Error('No usable questions returned.');

    const questions = [];
    for(const item of items){
      if(!item || typeof item.question!=='string' || !Array.isArray(item.options)) continue;
      const opts = item.options.map(o=>String(o).trim()).filter(Boolean);
      if(opts.length<2) continue;

      const base = {
        q:item.question.trim(),
        type:requestedType,
        options:opts,
        timeLimit:20,
        points:1000,
        explanation:typeof item.explanation==='string' ? item.explanation.trim() : '',
        excluded:false,
        aiMeta:{
          ...getAIQuestionVerificationMeta(context.sourceType,context.sourceName,context.sourceUrls,item),
          language:questionLanguage
        }
      };

      if(requestedType==='true_false'){
        const trueIndex = opts.findIndex(o=>o.toLowerCase()==='true');
        const falseIndex = opts.findIndex(o=>o.toLowerCase()==='false');
        const returnedCorrect = parseInt(item.correctIndex,10);
        if(opts.length!==2 || trueIndex<0 || falseIndex<0 || (returnedCorrect!==trueIndex && returnedCorrect!==falseIndex)) continue;
        base.options=['True','False'];
        base.correct=returnedCorrect===trueIndex?0:1;
      }else if(requestedType==='multiple_correct'){
        const indexes = parseAICorrectIndexes(item,opts);
        if(indexes.length<2) continue;
        base.correctIndexes=indexes;
        base.correct=indexes[0];
      }else{
        const idx = parseInt(item.correctIndex,10);
        if(!Number.isInteger(idx) || idx<0 || idx>=opts.length) continue;
        base.type='multiple_choice';
        base.correct=idx;
      }

      if(aiQuestionStructuralCheck(base)) questions.push(base);
    }
    if(!questions.length) throw new Error('The AI response did not contain structurally valid questions.');
    return questions;
  }

  async function generateVerifiedQuestionBatches({
    topic,requestedCount,optsPerQ,questionType,sourceText,sourceType,sourceName,sourceUrls,
    questionLanguage='English',existingQuestions,onProgress
  }){
    const target = Math.max(1,Math.min(100,requestedCount||10));
    const accepted = [];
    const known = Array.isArray(existingQuestions) ? existingQuestions.slice() : [];
    const maxAttempts = Math.ceil(target/10) + 5;
    let attempts = 0;

    while(accepted.length < target && attempts < maxAttempts){
      const remaining = target-accepted.length;
      const batchCount = Math.min(10,remaining);
      const excerpt = selectSourceExcerpt(sourceText,topic,attempts,15000);
      if(onProgress) onProgress(accepted.length,target,'Generating '+(accepted.length+1)+'–'+Math.min(target,accepted.length+batchCount)+' of '+target+'…');

      let batch;
      try{
        batch = await generateQuestionsWithAI(topic,batchCount,optsPerQ,questionType,{
          sourceExcerpt:excerpt,
          sourceType,
          sourceName,
          sourceUrls,
          questionLanguage,
          existingQuestions:known.concat(accepted)
        });
      }catch(err){
        attempts++;
        if(attempts>=maxAttempts && !accepted.length) throw err;
        continue;
      }

      for(const q of batch){
        if(accepted.length>=target) break;
        if(!aiQuestionStructuralCheck(q)) continue;
        if(isNearDuplicateQuestion(q.q,known) || isNearDuplicateQuestion(q.q,accepted)) continue;
        accepted.push(q);
      }

      attempts++;
      if(onProgress) onProgress(accepted.length,target,
        accepted.length<target
          ? 'Checked duplicates — '+accepted.length+' of '+target+' unique questions ready…'
          : 'All '+target+' questions ready.'
      );
    }

    if(!accepted.length) throw new Error('QZMAX could not produce a reliable unique question set. Try a broader source or different topic.');
    if(accepted.length < target){
      throw new Error('Only '+accepted.length+' unique, structurally valid questions could be produced from this source. Try a broader document/topic or request fewer questions.');
    }
    return accepted.slice(0,target);
  }

  function questionVerificationBadge(q){
    const meta = q && q.aiMeta;
    if(!meta) return '';
    const kind = meta.kind==='document'?'document':meta.kind==='source'?'source':'review';
    return '<span class="q-verify-badge '+kind+'" title="'+escapeHtml(meta.sourceName||meta.label||'')+'">'+
      (kind==='review'?'!':'✓')+' '+escapeHtml(meta.label||'AI • Review')+
    '</span>';
  }

  function updateQuestionTypeUI(){
    const sel = $('qf-type');
    if(!sel) return;
    S.questionType = sel.value || 'multiple_choice';
    const type = S.questionType;
    const optionGroup = $('qf-options-group');
    const typedGroup = $('qf-typed-group');
    const addBtn = $('qf-add-option');
    const label = $('qf-options-label');
    const hint = $('qf-type-hint');

    if(type==='typed'){
      optionGroup.style.display = 'none';
      typedGroup.style.display = 'flex';
      hint.textContent = 'Players type a free-text answer.';
      return;
    }

    optionGroup.style.display = 'flex';
    typedGroup.style.display = 'none';
    addBtn.style.display = type==='true_false' ? 'none' : '';

    if(type==='true_false'){
      const currentCorrect = S.formOpts.findIndex(o=>o.correct);
      S.formOpts = [
        {text:'True', correct:currentCorrect!==1},
        {text:'False', correct:currentCorrect===1}
      ];
      label.textContent = 'True / False — tap the correct answer';
      hint.textContent = 'Fast two-option question.';
    }else if(type==='multiple_correct'){
      label.textContent = 'Answer options — select every correct option';
      hint.textContent = 'Players must select all correct choices.';
    }else{
      const firstCorrect = S.formOpts.findIndex(o=>o.correct);
      S.formOpts.forEach((o,i)=>o.correct = i===(firstCorrect>=0?firstCorrect:0));
      label.textContent = 'Answer options — tap the letter to mark the correct one';
      hint.textContent = 'One correct option.';
    }
    renderOptionInputs();
  }

  function renderOptionInputs(){
    const container = $('qf-options');
    if(!container) return;
    container.innerHTML = '';
    const type = S.questionType || 'multiple_choice';

    S.formOpts.forEach((opt,i)=>{
      const row = document.createElement('div');
      row.className = 'opt-input-row';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'correct-toggle' + (opt.correct ? ' on' : '');
      toggle.textContent = String.fromCharCode(65+i);
      toggle.title = type==='multiple_correct' ? 'Toggle correct answer' : 'Mark as correct';
      toggle.onclick = ()=>{
        if(type==='multiple_correct'){
          opt.correct = !opt.correct;
        }else{
          S.formOpts.forEach(o=>o.correct=false);
          opt.correct = true;
        }
        renderOptionInputs();
      };

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'Option ' + String.fromCharCode(65+i);
      inp.value = opt.text || '';
      if(type==='true_false'){
        inp.readOnly = true;
      }else{
        inp.oninput = ()=>{ opt.text = inp.value; };
      }

      row.appendChild(toggle);
      row.appendChild(inp);

      if(type!=='true_false' && S.formOpts.length > 2){
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'small-x';
        rm.textContent = '✕';
        rm.onclick = ()=>{
          S.formOpts.splice(i,1);
          if(type!=='multiple_correct' && !S.formOpts.some(o=>o.correct)) S.formOpts[0].correct = true;
          renderOptionInputs();
        };
        row.appendChild(rm);
      }
      container.appendChild(row);
    });
  }

        (S.hostWorkspaceMode==='studio'
          ? '<button class="small-edit" data-i="'+i+'" style="background:none; border:none; color:var(--signal); cursor:pointer; font-size:15px; margin-right:6px;">✎</button><button class="small-x" data-i="'+i+'">✕</button>'
          : '')+

  async function beginQuiz(){
    clearInterval(S.hostPollHandle);
    try{
      const [st, playersObjRaw] = await Promise.all([
        fbGetStrict(statePath(S.code)),
        fbGetStrict(playersPath(S.code))
      ]);
      if(!st) return;
      const playersObj = playersObjRaw || {};

      st.gameMode = S.gameMode === 'teams' ? 'teams' : 'individual';
      st.appVersion = APP_VERSION;
      st.teams = normalizeTeams(S.teams, S.teams && S.teams.length ? S.teams.length : 2);
      st.teamCount = st.teams.length;

      if(st.gameMode==='teams'){
        const counts={};
        st.teams.forEach(t=>counts[t.id]=0);
        Object.values(playersObj).forEach(p=>{
          if(p.teamId && counts[p.teamId]!==undefined) counts[p.teamId]++;
          else p.teamId = null;
        });
        Object.keys(playersObj).forEach(pid=>{
          const p = playersObj[pid];
          if(p.teamId) return;
          const chosen = st.teams.slice().sort((a,b)=>counts[a.id]-counts[b.id])[0];
          p.teamId = chosen.id;
          counts[chosen.id]++;
        });
      }

      st.status = 'question';
      st.currentIndex = 0;
      st.questionStartedAt = getSyncedTime();
      st.optionCounts = null;
      st.totalAnswered = 0;

      const updates={};
      updates[statePath(S.code)] = st;
      updates[playersPath(S.code)] = playersObj;
      await fbAtomicUpdate(updates);
      enterHostQuestion(st);
    }catch(e){
      showConnectionBanner('Could not start yet — reconnecting to the room.', false);
      startHostSetupPoll();
    }
  }
  
  async function hostEndQuizEarly(st) {
    if (confirm("End the game early?")) {
      clearInterval(S.hostTimerHandle);
      clearInterval(S.hostPollHandle);
      hostGoToFinal(st);
    }
  }

  function enterHostQuestion(st){
    S.hostRevealing = false;
    const q = st.questions[st.currentIndex];
    const total = st.questions.length;
    const progress = Math.max(3, Math.round(((st.currentIndex + 1) / total) * 100));
    const type = normalizedQuestionType(q);
    const help = type==='multiple_correct' ? 'Players are selecting all correct answers'
      : type==='typed' ? 'Players are typing their answers'
      : 'Players are answering on their devices';

    $('screen-host-question').innerHTML =
      '<div class="live-game-shell">'+
        '<div class="live-game-top">'+
          '<div class="live-progress-wrap"><span class="live-q-meta">Question '+(st.currentIndex+1)+' of '+total+'</span><div class="live-progress"><span style="width:'+progress+'%;"></span></div></div>'+
          '<div class="live-timer-shell">'+ringSvg('host-ring')+'</div>'+
          '<div class="live-room-pill"><span>Room</span><strong>'+S.code+'</strong></div>'+
        '</div>'+
        '<div class="live-question-panel">'+
          '<div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;"><div class="live-category">'+(st.gameMode==='teams'?'👥 Team Battle':'✦ Live host view')+'</div><span class="qtype-pill">'+questionTypeLabel(q)+'</span></div>'+
          questionMediaHtml(q)+
          '<h2 class="live-question-text">'+escapeHtml(q.q)+'</h2>'+
          '<p class="live-question-help">'+help+'</p>'+
          hostQuestionAnswerHtml(q)+
          '<div class="live-host-status"><span class="live-dot"></span><div class="chip" id="host-q-answered">0 answered</div></div>'+
          '<button class="btn btn-danger live-end-btn" id="btn-end-early">End quiz early</button>'+
        '</div>'+
      '</div>';
    showScreen('screen-host-question');

    $('btn-end-early').onclick = () => hostEndQuizEarly(st);

    clearInterval(S.hostTimerHandle);
    S.hostTimerHandle = setInterval(()=>{
      const remaining = q.timeLimit - (getSyncedTime()-st.questionStartedAt)/1000;
      updateRing('host-ring', remaining, q.timeLimit);
      if(remaining<=0 && !S.hostRevealing) scheduleReveal(st, 'Time\'s up!', 1200);
    }, 150);

    clearInterval(S.hostPollHandle);
    S.hostPollHandle = setInterval(async ()=>{
      if(S.hostRevealing) return;
      const [answersObj, playersObj] = await Promise.all([
        fbGet(answersPath(S.code, st.currentIndex)),
        fbGet(playersPath(S.code))
      ]);
      const answeredCount = answersObj ? Object.values(answersObj).filter(answerSubmitted).length : 0;
      const playerCount = playersObj ? Object.keys(playersObj).length : 0;
      const el = $('host-q-answered');
      if(el) el.textContent = answeredCount + ' of ' + playerCount + ' answered';
      if(playerCount>0 && answeredCount>=playerCount && !S.hostRevealing) scheduleReveal(st, 'Everyone answered!', 800);
    }, 900);
  }

  function scheduleReveal(st, message, delayMs){
    if(S.hostRevealing) return;
    S.hostRevealing = true;
    clearInterval(S.hostTimerHandle);
    clearInterval(S.hostPollHandle);
    const el = $('host-q-answered');
    if(el) el.textContent = message;
    clearTimeout(S.hostRecoveryHandle);
    S.hostRecoveryHandle = setTimeout(()=>{ hostGoToReveal(st); }, delayMs);
  }

  async function hostGoToReveal(st){
    const qi = st.currentIndex;

    try{
      const freshState = await fbGetStrict(statePath(S.code));
      if(!freshState) throw new Error('Room no longer exists');

      if(freshState.status !== 'question' || freshState.currentIndex !== qi){
        if(freshState.status === 'reveal'){
          const qDone = freshState.questions[freshState.currentIndex];
          buildHostReveal(freshState, freshState.optionCounts || new Array((qDone.options||[]).length).fill(0));
          return;
        }
        if(freshState.status === 'leaderboard'){
          buildHostLeaderboard(freshState, await fetchAllPlayers(S.code));
          return;
        }
        if(freshState.status === 'final'){
          buildHostFinal(freshState, await fetchAllPlayers(S.code));
          return;
        }
        return;
      }

      const q = freshState.questions[qi];
      if(!q) throw new Error('Current question missing');

      const [answersObj, playersObj] = await Promise.all([
        fbGetStrict(answersPath(S.code, qi)),
        fbGetStrict(playersPath(S.code))
      ]);
      const answers = answersObj || {};
      const players = playersObj || {};
      const options = q.options || [];
      const optionCounts = new Array(options.length).fill(0);
      const typedCounts = new Map();
      let correctCount = 0;
      let totalAnswered = 0;

      for(const pid in answers){
        const a = answers[pid];
        if(!answerSubmitted(a)) continue;
        totalAnswered++;
        if(typeof a.answerIndex === 'number' && a.answerIndex>=0 && a.answerIndex<optionCounts.length){
          optionCounts[a.answerIndex]++;
        }
        if(Array.isArray(a.answerIndexes)){
          [...new Set(a.answerIndexes.map(Number).filter(Number.isInteger))].forEach(i=>{
            if(i>=0 && i<optionCounts.length) optionCounts[i]++;
          });
        }
        if(typeof a.answerText === 'string'){
          const shown = a.answerText.trim().slice(0,80) || '(blank)';
          typedCounts.set(shown, (typedCounts.get(shown)||0)+1);
        }
      }

      for(const pid in players){
        const player = players[pid];
        const a = answers[pid];
        const oldPoints = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
        let points = 0;
        const correct = answerIsCorrect(q,a);

        if(a && answerSubmitted(a)){
          if(correct){
            correctCount++;
            const frac = Math.max(0, Math.min(1, 1 - ((a.timeMs||0)/1000)/q.timeLimit));
            const base = q.points || 1000;
            points = Math.round(base/2 + (base/2)*frac);
          }
          a.pointsAwarded = points;
          a.wasCorrect = correct;
        }

        if(!q.excluded) player.score = Math.max(0, (player.score||0) - oldPoints + points);
        player.lastPoints = points;
        player.lastCorrect = correct;
      }

      const nextState = JSON.parse(JSON.stringify(freshState));
      nextState.status = 'reveal';
      nextState.optionCounts = optionCounts;
      nextState.totalAnswered = totalAnswered;
      nextState.correctCount = correctCount;
      nextState.responseSummary = Array.from(typedCounts.entries())
        .sort((a,b)=>b[1]-a[1])
        .slice(0,6)
        .map(([text,count])=>({text,count}));
      nextState.revealedAt = getSyncedTime();

      const updates = {};
      updates[playersPath(S.code)] = players;
      updates[answersPath(S.code, qi)] = answers;
      updates[statePath(S.code)] = nextState;
      await fbAtomicUpdate(updates);

      firebaseConnected = true;
      showConnectionBanner('Live game synced.', true);
      buildHostReveal(nextState, optionCounts);
    }catch(e){
      console.error('host reveal transition failed', e);
      firebaseConnected = false;
      showConnectionBanner('Connection interrupted — reveal will continue automatically when reconnected.', false);
      clearTimeout(S.hostRecoveryHandle);
      S.hostRecoveryHandle = setTimeout(()=>hostGoToReveal(st), 1800);
    }
  }

  async function recalcQuestionScore(qi, newCorrectIndex){
    const st = await fbGet(statePath(S.code));
    if(!st) return null;
    const q = st.questions[qi];
    if(!q) return null;
    const [answersObj, playersObj] = await Promise.all([
      fbGet(answersPath(S.code, qi)),
      fbGet(playersPath(S.code))
    ]);
    const answers = answersObj || {};
    const players = playersObj || {};
    for(const pid in players){
      const player = players[pid];
      const a = answers[pid];
      const oldPoints = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
      let newPoints = 0, correct = false;
      if(a && typeof a.answerIndex === 'number'){
        correct = a.answerIndex === newCorrectIndex;
        if(correct){
          const frac = Math.max(0, Math.min(1, 1 - (a.timeMs/1000)/q.timeLimit));
          const base = q.points || 1000;
          newPoints = Math.round(base/2 + (base/2)*frac);
        }
        a.pointsAwarded = newPoints;
        a.wasCorrect = correct;
      }
      if(!q.excluded){
        player.score = Math.max(0, (player.score||0) - oldPoints + newPoints);
      }
      if(qi === st.currentIndex){ player.lastPoints = newPoints; player.lastCorrect = correct; }
    }
    q.correct = newCorrectIndex;
    await Promise.all([
      fbSet(playersPath(S.code), players),
      fbSet(answersPath(S.code, qi), answers)
    ]);
    await fbSet(statePath(S.code), st);
    return st;
  }

  async function toggleExcludeQuestion(qi, exclude){
    const st = await fbGet(statePath(S.code));
    if(!st) return null;
    const q = st.questions[qi];
    if(!q) return null;
    const [answersObj, playersObj] = await Promise.all([
      fbGet(answersPath(S.code, qi)),
      fbGet(playersPath(S.code))
    ]);
    const answers = answersObj || {};
    const players = playersObj || {};
    for(const pid in players){
      const player = players[pid];
      const a = answers[pid];
      const pts = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
      if(pts===0) continue;
      player.score = Math.max(0, (player.score||0) + (exclude ? -pts : pts));
    }
    q.excluded = exclude;
    await fbSet(playersPath(S.code), players);
    await fbSet(statePath(S.code), st);
    return st;
  }

  function wireQuestionReviewPanel(container, refreshFn){
    container.querySelectorAll('.qr-fix-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(btn.classList.contains('on')) return;
        container.querySelectorAll('.qr-fix-btn, .qr-exclude-btn').forEach(b=>b.disabled=true);
        const qi = parseInt(btn.dataset.qi,10);
        const i = parseInt(btn.dataset.i,10);
        await recalcQuestionScore(qi, i);
        await refreshFn();
      };
    });
    container.querySelectorAll('.qr-exclude-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        container.querySelectorAll('.qr-fix-btn, .qr-exclude-btn').forEach(b=>b.disabled=true);
        const qi = parseInt(btn.dataset.qi,10);
        const st = await fbGet(statePath(S.code));
        const wasExcluded = !!(st && st.questions[qi] && st.questions[qi].excluded);
        await toggleExcludeQuestion(qi, !wasExcluded);
        await refreshFn();
      };
    });
  }

  function buildHostReveal(st, optionCounts){
    const q = st.questions[st.currentIndex];
    const type = normalizedQuestionType(q);
    const totalAnswered = typeof st.totalAnswered==='number'
      ? st.totalAnswered
      : (type==='multiple_correct' ? 0 : optionCounts.reduce((a,b)=>a+b,0));
    const correctCount = typeof st.correctCount==='number'
      ? st.correctCount
      : ((type==='multiple_choice'||type==='true_false') ? (optionCounts[q.correct]||0) : 0);
    const accuracy = totalAnswered ? Math.round((correctCount/totalAnswered)*100) : 0;
    const maxCount = Math.max(1, ...(optionCounts||[]));
    const correctIndexes = new Set(getCorrectIndexes(q));

    const distribution = type==='typed'
      ? '<div class="accepted-answer-box"><span>Accepted answer'+((q.acceptedAnswers||[]).length===1?'':'s')+'</span><strong>'+escapeHtml(getCorrectAnswerDisplay(q))+'</strong></div>'+

      : '<div class="reveal-bars">'+
          (q.options||[]).map((o,i)=>{
            const isCorrect = correctIndexes.has(i);
            const width = (optionCounts[i]||0)/maxCount*100;

              '<span class="opt-letter" style="'+(isCorrect?'background:var(--correct);color:var(--void);':'')+'">'+String.fromCharCode(65+i)+'</span>'+
              '<span class="answer-label">'+escapeHtml(o)+'</span>'+
              '<div class="bar-track"><div class="bar-fill'+(isCorrect?' correct':'')+'" style="width:'+width+'%"></div></div>'+
              '<span class="count">'+(optionCounts[i]||0)+'</span>'+

          }).join('')+
        '</div>';

    $('screen-host-reveal').innerHTML =
      '<div class="reveal-shell">'+
        '<div class="topbar"><div class="chip">Room <span class="code-text">'+S.code+'</span></div><div class="chip">Question '+(st.currentIndex+1)+' / '+st.questions.length+'</div></div>'+
        '<div class="reveal-hero">'+
          '<div class="reveal-kicker">'+questionTypeLabel(q)+' · Answer reveal</div>'+
          '<div class="reveal-answer-big good">✓ '+escapeHtml(getCorrectAnswerDisplay(q))+'</div>'+
          '<div class="reveal-answer-text">'+escapeHtml(q.q)+'</div>'+
          questionMediaHtml(q)+
          '<div class="reveal-stats">'+
            '<div class="reveal-stat"><span>Answered</span><strong>'+totalAnswered+'</strong></div>'+
            '<div class="reveal-stat"><span>Correct</span><strong>'+correctCount+'</strong></div>'+
            '<div class="reveal-stat"><span>Accuracy</span><strong>'+accuracy+'%</strong></div>'+
          '</div>'+
        '</div>'+
        distribution+
        (q.explanation ? '<div class="reveal-explainer"><div class="eyebrow">Why this is correct</div><p style="color:var(--ink);">'+escapeHtml(q.explanation)+'</p></div>' : '')+
        '<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px;">'+
          '<button class="btn btn-primary" id="btn-to-leaderboard">Show leaderboard →</button>'+
          '<button class="btn btn-danger" id="btn-end-early-reveal">End quiz early</button>'+

      const freshSt = await fbGet(statePath(S.code));
      buildHostReveal(freshSt, freshSt.optionCounts || optionCounts);

  async function fetchAllPlayers(code){
    const obj = await fbGet(playersPath(code));
    const players = obj ? Object.values(obj) : [];
    players.sort((a,b)=>(b.score||0)-(a.score||0));
    return players;
  }


  function previousRankMap(players){
    const prior = players.slice().sort((a,b)=>{
      const aPrev = (a.score||0) - (a.lastPoints||0);
      const bPrev = (b.score||0) - (b.lastPoints||0);
      if(bPrev !== aPrev) return bPrev - aPrev;
      return String(a.name||'').localeCompare(String(b.name||''));
    });
    const map = {};
    prior.forEach((p,i)=>{ map[p.id] = i+1; });
    return map;
  }

  function rankMoveHtml(currentRank, previousRank){
    if(!previousRank || previousRank === currentRank) return '<span class="rank-move rank-same">—</span>';
    const diff = previousRank - currentRank;
    if(diff > 0) return '<span class="rank-move rank-up">↑ '+diff+'</span>';
    return '<span class="rank-move rank-down">↓ '+Math.abs(diff)+'</span>';
  }

      $('screen-host-leaderboard').innerHTML =
        '<div class="leader-shell">'+

          '<div class="leader-head">'+
            '<div class="eyebrow">Leaderboard</div>'+
            '<div class="leader-title">'+(players.length ? escapeHtml(players[0].name)+' leads the room' : 'Current standings')+'</div>'+
            (roundStar && roundStar.lastPoints>0 ? '<div class="leader-round-star">⚡ Round high score: '+escapeHtml(roundStar.name)+' +'+roundStar.lastPoints+'</div>' : '')+
          '</div>'+
          '<div class="momentum-list">'+
            (players.length===0 ? '<p>No players yet.</p>' : players.slice(0,8).map((p,i)=>
              '<div class="momentum-row'+(i===0?' first':'')+'">'+
                '<span class="momentum-rank">'+(i+1)+'</span>'+
                '<span class="momentum-name">'+escapeHtml(p.name)+'</span>'+

  function animateNumber(el, target, duration=1050){
    if(!el) return;
    const end = Math.max(0, Number(target)||0);
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){
      el.textContent = end.toLocaleString();
      return;
    }
    el.classList.add('counting');
    const started = performance.now();
    const ease = t => 1 - Math.pow(1-t,3);
    const frame = now=>{
      const p = Math.min(1,(now-started)/duration);
      el.textContent = Math.round(end*ease(p)).toLocaleString();
      if(p<1) requestAnimationFrame(frame);
      else{
        el.textContent = end.toLocaleString();
        el.classList.remove('counting');
      }
    };
    requestAnimationFrame(frame);
  }

  function ensureFinalConfettiLayer(){
    let layer = document.querySelector('.hf-celebration-layer');
    if(!layer){
      layer = document.createElement('div');
      layer.className = 'hf-celebration-layer';
      document.body.appendChild(layer);
    }
    S.finalConfettiLayer = layer;
    return layer;
  }

  function spawnFinalConfettiBurst(){
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced) return;
    const layer = ensureFinalConfettiLayer();
    const colors = ['#7b61ff','#5e7dff','#35d8ff','#46e6a5','#ffd36e','#ff7f9b'];
    const burstCount = window.innerWidth < 700
      ? 10 + Math.floor(Math.random()*6)
      : 14 + Math.floor(Math.random()*8);
    const originX = 8 + Math.random()*84;
    const originY = 10 + Math.random()*68;

    for(let i=0;i<burstCount;i++){
      const piece = document.createElement('i');
      piece.className = 'hf-confetti ' + (i%5===0?'circle':i%4===0?'slim':'');
      const offsetX = -28 + Math.random()*56;
      const offsetY = -20 + Math.random()*40;
      piece.style.left = `calc(${originX}vw + ${offsetX}px)`;
      piece.style.top = `calc(${originY}vh + ${offsetY}px)`;
      piece.style.background = colors[(i + Math.floor(Math.random()*colors.length)) % colors.length];
      piece.style.setProperty('--delay',(Math.random()*.12)+'s');
      piece.style.setProperty('--dur',(1.6 + Math.random()*1.2)+'s');
      piece.style.setProperty('--drift-x',((-120 + Math.random()*240))+'px');
      piece.style.setProperty('--drift-y',((80 + Math.random()*180))+'px');
      piece.style.setProperty('--spin',((300 + Math.random()*820)*(Math.random()>.5?1:-1))+'deg');
      piece.style.setProperty('--start-scale',(0.72 + Math.random()*0.55).toFixed(2));
      piece.style.setProperty('--end-scale',(0.9 + Math.random()*0.6).toFixed(2));
      layer.appendChild(piece);
      setTimeout(()=>piece.remove(), 3600);
    }
  }

  function stopFinalConfetti(removeLayer=true){
    S.finalConfettiActive = false;
    if(S.finalConfettiTimer){
      clearInterval(S.finalConfettiTimer);
      S.finalConfettiTimer = null;
    }
    if(removeLayer){
      if(S.finalConfettiLayer) S.finalConfettiLayer.remove();
      else{
        const old = document.querySelector('.hf-celebration-layer');
        if(old) old.remove();
      }
      S.finalConfettiLayer = null;
    }
  }

  function startFinalConfettiLoop(){
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced) return;
    stopFinalConfetti(true);
    S.finalConfettiActive = true;
    ensureFinalConfettiLayer();
    spawnFinalConfettiBurst();
    S.finalConfettiTimer = setInterval(()=>{
      if(!S.finalConfettiActive) return;
      spawnFinalConfettiBurst();
    }, window.innerWidth < 700 ? 560 : 440);
  }

  function startHostFinalCelebration(st, winningScore){
    const key = String(st.code||S.code||'')+':'+String(st.createdAt||'')+':final';
    const shouldBurst = S.lastCelebratedFinalKey !== key;
    S.lastCelebratedFinalKey = key;

    const winnerCard = document.querySelector('#screen-host-final .hf-winner-card');
    const crown = document.querySelector('#screen-host-final .hf-crown');
    if(winnerCard) winnerCard.classList.add('celebrate');
    if(crown) crown.classList.add('celebrate');

    animateNumber($('hf-final-winning-score'), winningScore, 1150);

    document.querySelectorAll('#screen-host-final .hf-podium-card').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('hf-enter'), 180 + i*115);
    });
    document.querySelectorAll('#screen-host-final .hf-row').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('hf-enter'), 420 + i*65);
    });

    if(shouldBurst || !S.finalConfettiActive) startFinalConfettiLoop();

  async function playerAttemptJoin(){
    const name = $('pj-name').value.trim();
    const code = $('pj-code').value.trim().toUpperCase();
    if(!name || !code){ $('pj-err').textContent = 'Enter your name and the room code.'; return; }
    $('pj-submit').disabled = true;
    const st = await fbGet(statePath(code));
    if(!st){ $('pj-err').textContent = 'No room found with that code.'; $('pj-submit').disabled = false; return; }
    S.code = code; S.name = name; S.pid = genId(); S.teamId = null;

    // In a live Team Battle, late joiners are placed into the smallest team automatically.
    if(st.gameMode==='teams' && st.status!=='setup'){
      const existingPlayersObj = await fbGet(playersPath(code)) || {};
      const teams = normalizeTeams(st.teams, st.teamCount);
      const counts={};
      teams.forEach(t=>counts[t.id]=0);
      Object.values(existingPlayersObj).forEach(p=>{ if(p.teamId && counts[p.teamId]!==undefined) counts[p.teamId]++; });
      const chosen = teams.slice().sort((a,b)=>counts[a.id]-counts[b.id])[0];
      if(chosen) S.teamId = chosen.id;
    }

    const joined = await fbSet(playerPath(code, S.pid), { id:S.pid, name, teamId:S.teamId, score:0, lastPoints:0, lastCorrect:null, joinedAt:Date.now() });
    if(!joined){
      $('pj-err').textContent = 'Could not join the room. Please try again.';
      $('pj-submit').disabled = false;
      return;
    }
    savePlayerSession();
    S.lastPhaseKey = null;
    S.hadRoom = false;
    startPlayerPoll();
  }

  async function playerPollTick(){
    const st = await fbGet(statePath(S.code));
    if(!st){
      if(S.hadRoom){
        clearInterval(S.playerPollHandle);
        clearInterval(S.playerTimerHandle);
        showPlayerEndedScreen();
      }
      return;
    }
    S.hadRoom = true;
    if(st.appVersion && st.appVersion !== APP_VERSION){
      showConnectionBanner('This room is using QZMAX v'+st.appVersion+'. Refresh this page if the question display looks out of date.', false);
    }
    const teamKey = st.gameMode==='teams' ? ':'+JSON.stringify(st.teams||[]) : '';
    const currentQ = st.questions && st.currentIndex>=0 ? st.questions[st.currentIndex] : null;
    const mediaKey = currentQ ? ':'+(currentQ.imageUrl||'')+':'+normalizedQuestionType(currentQ) : '';
    const phaseKey = st.status + ':' + st.currentIndex + ':' + (st.gameMode||'individual') + teamKey + mediaKey + ':'+(st.appVersion||'');
    if(st.status==='setup'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; buildPlayerLobby(st); }
    } else if(st.status==='question'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerQuestion(st); }
    } else if(st.status==='reveal'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerReveal(st); }
    } else if(st.status==='leaderboard'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerLeaderboard(st); }
    } else if(st.status==='final'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerFinal(); }
    }
  }

  async function enterPlayerQuestion(st){
    const q = st.questions[st.currentIndex];
    const type = normalizedQuestionType(q);
    const [existingAnswer, currentPlayer] = await Promise.all([
      fbGet(answerPath(S.code, st.currentIndex, S.pid)),
      fbGet(playerPath(S.code, S.pid))
    ]);
    if(currentPlayer && currentPlayer.teamId){
      S.teamId = currentPlayer.teamId;
      savePlayerSession();
    }

    let answered = answerSubmitted(existingAnswer);
    const questionsAfter = st.questions.length - (st.currentIndex + 1);
    const total = st.questions.length;
    const progress = Math.max(3, Math.round(((st.currentIndex + 1) / total) * 100));
    const selectedExisting = new Set(
      type==='multiple_correct' && existingAnswer && Array.isArray(existingAnswer.answerIndexes)
        ? existingAnswer.answerIndexes.map(Number)
        : []
    );

    let answerArea = '';
    let help = 'Choose the best answer';

    if(type==='typed'){
      help = 'Type your answer, then lock it in';
      answerArea =
        '<div class="typed-player-box">'+
          '<input type="text" id="pq-typed-input" maxlength="120" autocomplete="off" placeholder="Type your answer..." '+(answered?'disabled':'')+' value="'+escapeHtml(existingAnswer&&existingAnswer.answerText?existingAnswer.answerText:'')+'">'+
          '<button class="btn btn-primary" id="pq-typed-submit" '+(answered?'disabled':'')+'>Lock answer</button>'+
        '</div>';
    }else{
      if(type==='multiple_correct') help = 'Select all correct answers, then submit';
      answerArea =
        '<div class="live-answer-grid">'+
          (q.options||[]).map((o,i)=>{
            const selected = type==='multiple_correct'
              ? selectedExisting.has(i)
              : !!(existingAnswer && existingAnswer.answerIndex===i);
            return '<div class="live-answer opt-card'+(answered?' disabled':'')+(selected?' selected':'')+'" data-i="'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="live-answer-text">'+escapeHtml(o)+'</span></div>';
          }).join('')+
        '</div>'+
        (type==='multiple_correct'
          ? '<div class="multi-cue">✓ More than one answer can be correct</div><div class="multi-submit-wrap"><button class="btn btn-primary" id="pq-multi-submit" '+(answered?'disabled':'')+'>Submit selected answers</button></div>'
          : '');
    }

    $('screen-player-question').innerHTML =
      '<div class="live-game-shell">'+
        '<div class="live-game-top">'+
          '<div class="live-progress-wrap"><span class="live-q-meta">Question '+(st.currentIndex+1)+' of '+total+'</span><div class="live-progress"><span style="width:'+progress+'%;"></span></div></div>'+
          '<div class="live-timer-shell">'+ringSvg('player-ring')+'</div>'+
          '<div class="live-room-pill"><span>Room</span><strong>'+S.code+'</strong></div>'+
        '</div>'+
        '<div class="live-question-panel">'+
          '<div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;"><div class="live-category qz-live-brand">✦ QZMAX</div><span class="qtype-pill">'+questionTypeLabel(q)+'</span><span class="qtype-pill">v'+APP_VERSION+'</span></div>'+
          '<h2 class="live-question-text">'+escapeHtml(q.q)+'</h2>'+
          questionMediaHtml(q)+
          '<p class="live-question-help">'+help+'</p>'+
          answerArea+
          '<div id="pq-status" class="live-answer-status">'+(answered?'<strong>Your answer is already locked in.</strong> Waiting for the reveal…':'Choose your answer to lock it in.')+'</div>'+
        '</div>'+
        '<div class="live-question-footer"><span class="live-micro-pill">'+(questionsAfter>0 ? questionsAfter+' questions after this' : 'Final question')+'</span><span class="live-micro-pill">Faster correct answers earn more points</span>'+(st.gameMode==='teams'?'<span class="team-badge">👥 '+escapeHtml(teamName(st,S.teamId))+'</span>':'')+'</div>'+
      '</div>';
    showScreen('screen-player-question');

    const lockStatus = ()=>{
      $('pq-status').innerHTML = '<strong>Answer locked in!</strong> Your response has been recorded.';
    };

    if(type==='typed'){
      const submitTyped = async ()=>{
        if(answered) return;
        const inp = $('pq-typed-input');
        const answerText = inp.value.trim();
        if(!answerText){
          $('pq-status').textContent = 'Type an answer before locking it in.';
          return;
        }
        answered = true;
        inp.disabled = true;
        $('pq-typed-submit').disabled = true;
        const timeMs = getSyncedTime()-st.questionStartedAt;
        lockStatus();
        await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerText, timeMs, submittedAt:getSyncedTime() });
      };
      if($('pq-typed-submit')) $('pq-typed-submit').onclick = submitTyped;
      if($('pq-typed-input')) $('pq-typed-input').addEventListener('keydown',e=>{ if(e.key==='Enter') submitTyped(); });
    }else if(type==='multiple_correct'){
      const selected = new Set(selectedExisting);
      document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
        card.onclick = ()=>{
          if(answered) return;
          const i = parseInt(card.dataset.i,10);
          if(selected.has(i)){ selected.delete(i); card.classList.remove('selected'); }
          else { selected.add(i); card.classList.add('selected'); }
          $('pq-status').textContent = selected.size ? selected.size+' selected — submit when ready.' : 'Select all answers you think are correct.';
        };
      });
      if($('pq-multi-submit')) $('pq-multi-submit').onclick = async ()=>{
        if(answered) return;
        if(!selected.size){
          $('pq-status').textContent = 'Select at least one answer first.';
          return;
        }
        answered = true;
        document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
        $('pq-multi-submit').disabled = true;
        const timeMs = getSyncedTime()-st.questionStartedAt;
        lockStatus();
        await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerIndexes:[...selected].sort((a,b)=>a-b), timeMs, submittedAt:getSyncedTime() });
      };
    }else{
      document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
        card.onclick = async ()=>{
          if(answered) return;
          answered = true;
          const i = parseInt(card.dataset.i,10);
          const timeMs = getSyncedTime()-st.questionStartedAt;
          document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
          card.classList.add('selected');
          lockStatus();
          await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerIndex:i, timeMs, submittedAt:getSyncedTime() });
        };
      });
    }

    clearInterval(S.playerTimerHandle);
    S.playerTimerHandle = setInterval(()=>{
      const remaining = q.timeLimit - (getSyncedTime()-st.questionStartedAt)/1000;
      updateRing('player-ring', remaining, q.timeLimit);
      if(remaining<=0){
        clearInterval(S.playerTimerHandle);
        if(!answered){
          $('pq-status').innerHTML = '<strong>Time’s up.</strong> Waiting for the reveal…';
          document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
          if($('pq-multi-submit')) $('pq-multi-submit').disabled = true;
          if($('pq-typed-input')) $('pq-typed-input').disabled = true;
          if($('pq-typed-submit')) $('pq-typed-submit').disabled = true;
        }
      }
    }, 150);
  }

  async function enterPlayerReveal(st){
    clearInterval(S.playerTimerHandle);
    const me = await fbGet(playerPath(S.code, S.pid));
    if(me && me.teamId){ S.teamId = me.teamId; savePlayerSession(); }
    const q = st.questions[st.currentIndex];
    const correct = me ? me.lastCorrect : false;
    const points = me ? me.lastPoints : 0;
    const score = me ? me.score : 0;

    $('screen-player-reveal').innerHTML =
      '<div class="center-stage">'+
        '<div class="player-reveal-card '+(correct?'correct':'wrong')+'">'+
          '<div class="player-result-icon">'+(correct?'✓':'×')+'</div>'+
          '<div class="reveal-kicker">'+(correct?'Correct answer':'Not this time')+'</div>'+
          '<div class="player-points '+(correct?'good':'zero')+'">'+(correct?'+'+points:'+0')+'</div>'+
          '<p style="font-size:12px;">'+(st.gameMode==='teams'?'points added to '+escapeHtml(teamName(st,S.teamId)):'points this round')+'</p>'+
          '<div style="height:1px;background:rgba(130,160,220,.12);margin:18px 0;"></div>'+
          '<p style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7f8da5;">Correct answer</p>'+
          '<h3 style="font-size:21px;margin-top:6px;">'+escapeHtml(getCorrectAnswerDisplay(q))+'</h3>'+
          questionMediaHtml(q)+
          (q.explanation ? '<p style="margin-top:10px;">'+escapeHtml(q.explanation)+'</p>' : '')+
          '<div class="player-score-strip">'+
            '<div class="player-score-cell"><span>Total score</span><strong>'+score.toLocaleString()+'</strong></div>'+
            '<div class="player-score-cell"><span>Question</span><strong>'+(st.currentIndex+1)+' / '+st.questions.length+'</strong></div>'+
          '</div>'+
          '<p style="margin-top:15px;font-size:11px;">Waiting for the host to show the leaderboard…</p>'+
        '</div>'+
      '</div>';
    showScreen('screen-player-reveal');
  }

  async function enterPlayerLeaderboard(st){
    const players = await fetchAllPlayers(S.code);
    const me = players.find(p=>p.id===S.pid);

    if(st.gameMode==='teams'){
      if(me && me.teamId) S.teamId = me.teamId;
      const standings = getTeamStandings(players, st);
      const myTeamRank = standings.findIndex(t=>t.id===S.teamId)+1;
      const myTeam = standings.find(t=>t.id===S.teamId);

      $('screen-player-leaderboard').innerHTML =
        '<div class="leader-shell">'+
          '<div class="leader-head">'+
            '<div class="eyebrow">Team leaderboard</div>'+
            '<div class="leader-title">'+(myTeamRank===1?'Your team is leading!':escapeHtml(myTeam?myTeam.name:'Your team')+' is #'+(myTeamRank||'-'))+'</div>'+
            '<div class="leader-round-star">'+(me&&me.lastCorrect?('You added +'+me.lastPoints+' points'):'No points this round')+' · Team total '+(myTeam?(myTeam.score||0).toLocaleString():0)+'</div>'+
          '</div>'+
          '<div class="team-leader-list">'+renderTeamRows(standings,S.teamId)+'</div>'+
          '<div style="text-align:center;margin-top:15px;"><span class="live-micro-pill">Your score: '+(me?(me.score||0).toLocaleString():0)+'</span><p style="margin-top:12px;">Waiting for the next question…</p></div>'+
        '</div>';
    }else{
      const myRank = players.findIndex(p=>p.id===S.pid)+1;
      const prevRanks = previousRankMap(players);
      const previousRank = me ? prevRanks[me.id] : null;
      const moved = previousRank && myRank ? previousRank - myRank : 0;
      let movementText = 'Holding position';
      if(moved > 0) movementText = '↑ Up '+moved+' place'+(moved===1?'':'s');
      if(moved < 0) movementText = '↓ Down '+Math.abs(moved)+' place'+(Math.abs(moved)===1?'':'s');

      $('screen-player-leaderboard').innerHTML =
        '<div class="leader-shell">'+
          '<div class="leader-head">'+
            '<div class="eyebrow">Leaderboard</div>'+
            '<div class="leader-title">'+(myRank===1?'You’re leading!':'You’re #'+(myRank||'-'))+'</div>'+
            '<div class="leader-round-star">'+movementText+' · '+(me&&me.lastCorrect?('+'+me.lastPoints+' this round'):'+0 this round')+'</div>'+
          '</div>'+
          '<div class="momentum-list">'+
            players.slice(0,8).map((p,i)=>
              '<div class="momentum-row'+(i===0?' first':'')+(p.id===S.pid?' me':'')+'">'+
                '<span class="momentum-rank">'+(i+1)+'</span>'+
                '<span class="momentum-name">'+escapeHtml(p.name)+(p.id===S.pid?' · You':'')+'</span>'+
                '<span class="momentum-score">'+(p.score||0).toLocaleString()+'</span>'+
                rankMoveHtml(i+1, prevRanks[p.id])+
              '</div>'
            ).join('')+
          '</div>'+
          '<div style="text-align:center;margin-top:15px;">'+
            '<span class="live-micro-pill">Total score: '+(me?(me.score||0).toLocaleString():0)+'</span>'+
            '<p style="margin-top:12px;">Waiting for the next question…</p>'+
          '</div>'+
        '</div>';
    }
    showScreen('screen-player-leaderboard');
  }

  async function enterPlayerFinal(){
    const [players, st] = await Promise.all([
      fetchAllPlayers(S.code),
      fbGet(statePath(S.code))
    ]);
    const me = players.find(p=>p.id===S.pid);
    if(me && me.teamId) S.teamId = me.teamId;

    if(st && st.gameMode==='teams'){
      const standings = getTeamStandings(players,st);
      const myTeamRank = standings.findIndex(t=>t.id===S.teamId)+1;
      const myTeam = standings.find(t=>t.id===S.teamId);

      $('screen-player-final').innerHTML =
        '<div class="center-stage">'+
          '<div class="team-final-hero">'+
            '<div class="trophy">'+(myTeamRank===1?'🏆':'👥')+'</div>'+
            '<div class="eyebrow">Team Battle final</div>'+
            '<h1>'+(myTeamRank===1?'Your team won!':escapeHtml(myTeam?myTeam.name:'Your team')+' finished #'+(myTeamRank||'-'))+'</h1>'+
            '<div class="score">'+(myTeam?(myTeam.score||0).toLocaleString():0)+' team points</div>'+
            '<p style="margin-top:7px;">Your contribution: '+(me?(me.score||0).toLocaleString():0)+' points</p>'+
          '</div>'+
          '<div class="team-leader-list">'+renderTeamRows(standings,S.teamId)+'</div>'+
          '<p style="margin-top:14px;">Stay here — if the host starts another quiz, you’ll rejoin automatically.</p>'+
          '<div class="chip" style="margin-top:4px;">Room <span class="code-text">'+S.code+'</span></div>'+
          '<button class="btn btn-ghost" id="player-leave-final" style="margin-top:8px;font-size:12px;">Leave this room</button>'+
        '</div>';
    }else{
      const myRank = players.findIndex(p=>p.id===S.pid)+1;
      $('screen-player-final').innerHTML =
        '<div class="center-stage">'+
          '<div class="eyebrow">Final results</div>'+
          '<h1 style="font-size:33px;">'+(myRank===1?'You won! 🏆':'You finished #'+myRank)+'</h1>'+
          '<div class="chip">Your score: '+(me?me.score:0)+'</div>'+
          '<div style="display:flex; flex-direction:column; gap:8px; width:100%; max-width:420px;">'+
            players.slice(0,5).map((p,i)=>'<div class="lb-row'+(p.id===S.pid?' me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+escapeHtml(p.name)+'</span><span class="lb-score">'+p.score+'</span></div>').join('')+
          '</div>'+
          '<p style="margin-top:14px;">Stay here — if the host starts another quiz, you’ll rejoin automatically.</p>'+
          '<div class="chip" style="margin-top:4px;">Room <span class="code-text">'+S.code+'</span></div>'+
          '<button class="btn btn-ghost" id="player-leave-final" style="margin-top:8px;font-size:12px;">Leave this room</button>'+
        '</div>';
    }

    showScreen('screen-player-final');
    const leaveBtn = $('player-leave-final');
    if(leaveBtn) leaveBtn.onclick = leavePlayerSession;
  }

  async function bootstrap(){
    const urlJoinCode = getJoinCodeFromUrl();
    if(urlJoinCode){
      if(await tryResumePlayerSession(urlJoinCode)) return;
      buildPlayerJoin();
      showScreen('screen-player-join');
      const codeInput = $('pj-code');
      if(codeInput) codeInput.value = urlJoinCode;
      return;
    }
    if(await tryResumeHostSession()) return;
    if(await tryResumePlayerSession()) return;
    buildRoleScreen();
  }
  bootstrap();
});
</script>
</body>
</html>
