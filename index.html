  function shuffleArrayInPlace(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function randomizeMultipleCorrectOptions(q){
    if(!q || q.type!=='multiple_correct' || !Array.isArray(q.options) || q.options.length<2) return q;
    const correctSet = new Set((q.correctIndexes||[]).map(Number));
    const mapped = q.options.map((text,index)=>({text,index,isCorrect:correctSet.has(index)}));
    shuffleArrayInPlace(mapped);
    q.options = mapped.map(x=>x.text);
    q.correctIndexes = mapped.map((x,i)=>x.isCorrect?i:null).filter(i=>i!==null);
    q.correct = q.correctIndexes[0];
    return q;
  }

  function balanceMultipleChoiceAnswerPositions(questions){
    const mc = (questions||[]).filter(q=>
      q && q.type==='multiple_choice' &&
      Array.isArray(q.options) &&
      q.options.length>=2 &&
      Number.isInteger(q.correct) &&
      q.correct>=0 &&
      q.correct<q.options.length
    );
    if(!mc.length) return questions;

    // Start each batch at a random letter, then cycle through the available
    // positions. This prevents the AI/provider from making every answer "A".
    const startOffset = Math.floor(Math.random()*4);
    let positionCounter = 0;

    mc.forEach(q=>{
      const target = (startOffset + positionCounter) % q.options.length;
      const current = q.correct;
      if(current !== target){
        [q.options[current],q.options[target]] = [q.options[target],q.options[current]];
        q.correct = target;
      }
      positionCounter++;
    });

    return questions;
  }

  function randomizeGeneratedAnswerPositions(questions){
    (questions||[]).forEach(q=>{
      if(q && q.type==='multiple_correct') randomizeMultipleCorrectOptions(q);
    });
    balanceMultipleChoiceAnswerPositions(questions);
    return questions;
  }

  async function generateQuestionsWithAI(topic, count, optsPerQ, questionType, context={}){
    const requestedType = ['multiple_choice','true_false','multiple_correct'].includes(questionType)
      ? questionType : 'multiple_choice';
    const questionLanguage = context.questionLanguage || 'English';
    const rawTimePerQuestion = Number(context.timePerQuestion);
    const timePerQuestion = Number.isFinite(rawTimePerQuestion)
      ? Math.max(3, Math.min(600, Math.round(rawTimePerQuestion)))
      : DEFAULT_QUESTION_TIME;
    const rawPointsPerQuestion = Number(context.pointsPerQuestion);
    const pointsPerQuestion = Number.isFinite(rawPointsPerQuestion)
      ? Math.max(0, Math.min(100000, Math.round(rawPointsPerQuestion)))
      : DEFAULT_QUESTION_POINTS;
    const formatInstruction = aiFormatInstruction(requestedType, optsPerQ, questionLanguage);
    const existing = Array.isArray(context.existingQuestions) ? context.existingQuestions : [];
    const generationAttempt = Math.max(0,Number(context.generationAttempt)||0);
    const structuredScope = context.structuredScope && typeof context.structuredScope==='object'
      ? context.structuredScope
      : {};
    const difficulty = context.difficulty || structuredScope.difficulty || 'Medium';
    const generationScope = buildGenerationScope(topic,count,generationAttempt,structuredScope);
    const avoidFactKeys = sameTopicFactKeys(existing,topic);
    const sourceExcerpt = context.sourceExcerpt || '';
    const languageInstruction = questionLanguage === 'Egyptian Simple Arabic'
      ? [
          'LANGUAGE REQUIREMENT: Generate the complete visible quiz content in simple Egyptian Arabic.',
          'Write every question, every answer option, and every explanation in easy-to-understand Egyptian Arabic as naturally used in Egypt.',
          'Keep the wording simple, friendly, direct, and suitable for a broad audience.',
          'Avoid overly formal Modern Standard Arabic unless needed for a proper academic term, quotation, technical name, or exact source wording.',
          'Use common Egyptian wording such as "إيه", "مين", "فين", "إمتى", and simple sentence structure when appropriate, but do not overuse slang or write in a way that feels comic or exaggerated.',
          'Keep proper nouns, scientific names, dates, numbers, and technical terms accurate. When a commonly used Arabic form exists, use it.',
          'Do not change the factual meaning of source-grounded content when simplifying the language.',
          'Return JSON keys/field names in English exactly as required by the API schema, but all visible quiz text must be in simple Egyptian Arabic.'
        ].join(' ')
      : questionLanguage === 'Arabic'
      ? [
          'LANGUAGE REQUIREMENT: Generate the complete quiz content in Modern Standard Arabic.',
          'Write every question, every answer option, and every explanation in Arabic.',
          'Use clear educational Arabic suitable for a broad audience.',
          'Do not translate proper nouns when a commonly used Arabic form exists; otherwise transliterate naturally.',
          'Return JSON keys/field names in English exactly as required by the API schema, but all visible quiz text must be Arabic.'
        ].join(' ')
      : [
          'LANGUAGE REQUIREMENT: Generate the complete quiz content in English.',
          'Write every question, every answer option, and every explanation in English.'
        ].join(' ');

    const flexibleReference = context.sourceType==='reference';
    const sourceLinkMode = context.sourceType==='link';
    const sourceRule = sourceExcerpt
      ? sourceLinkMode
        ? [
            'SOURCE LINK GROUNDING — STRICT MODE.',
            'Use ONLY facts explicitly supported by the extracted content from the host-selected URL below.',
            'Do not use model memory, general web knowledge, or assumptions to fill gaps.',
            'Write each visible question as a natural stand-alone question. Do not say "According to the source", "According to the webpage", "According to the link", "According to the text", or equivalent wording.',
            'For EVERY question include sourceEvidence as ONE CONTIGUOUS EXACT copied supporting phrase of roughly 8–45 words from the extracted content.',
            'sourceEvidence must be verbatim from the extracted content: do not paraphrase it, translate it, add ellipses, combine separate sentences, or change names/numbers.',
            'For EVERY question also include factKey: a concise canonical identity of the tested fact in the form relationship|subject|answer.',
            'If the extracted content does not explicitly support a safe answer, do not create that question.',
            'The host-selected source itself is treated as the authority for this mode; do not independently rewrite or correct its claims with outside knowledge.',
            context.sourceUrls && context.sourceUrls[0] ? 'SOURCE URL: '+context.sourceUrls[0] : '',
            'EXTRACTED SOURCE CONTENT:',
            sourceExcerpt
          ].filter(Boolean).join('\n')
        : flexibleReference
        ? [
            'REFERENCE GUIDANCE: The material below is useful supporting reference, but this host request intentionally spans a broad scope.',
            'Use the reference material whenever it supports the requested category, and you MAY use well-established factual knowledge for requested categories not covered by the excerpt.',
            'Do not invent uncertain facts. Avoid ambiguous answers and very time-sensitive claims unless clearly framed.',
            'For songs, film quotes, catchphrases or other copyrighted text, do not reproduce long verbatim passages; prefer identification, attribution, context, album/work, performer, character, or very short excerpts.',
            'REFERENCE MATERIAL:',
            sourceExcerpt
          ].join('\n')
        : [
            'CRITICAL SOURCE RULE: Use ONLY facts explicitly supported by the SOURCE MATERIAL below.',
            'Do not use outside memory to fill gaps.',
            'If a fact is uncertain, controversial, time-sensitive, or not directly supported by the source, do not make a question about it.',
            'Every correct answer must be defensible from the source.',
            'Write every visible question as a natural stand-alone question.',
            'NEVER begin a visible question with phrases such as "According to the source", "According to the text", "According to the document", "Based on the source", "From the text", or equivalent wording in another language.',
            'Do not mention the source, text, document, passage, or uploaded file in the visible question unless that wording is itself essential to the subject being tested.',
            'Avoid ambiguous distractors that could also be correct.',
            'When possible include sourceEvidence as a short supporting phrase and sourcePage if a page marker is visible.',
            'SOURCE MATERIAL:',
            sourceExcerpt
          ].join('\n')
      : context.sourceType==='school'
      ? 'YEAR-LEVEL ACCURACY RULE: Follow the school-year and subject instructions exactly. Test the student\'s subject knowledge directly. Do not drift into meta-questions about education, assessment systems, curriculum administration or teaching.'
      : context.sourceType==='ai'
      ? [
          'CRITICAL TOPIC-FIDELITY RULE: The current host Topic / Instructions field is the only subject scope for this generation.',
          'Do not carry over any subject, person, place, work, example, theme, or category from earlier generations.',
          'Every question must directly satisfy the current scope contract.',
          'Use widely established facts. Current Topic questions will be independently web checked after generation.',
          'For copyrighted lyrics, dialogue and other protected text, use only very short excerpts or ask about identification, attribution or context.'
        ].join(' ')
      : 'Accuracy requirement: use established facts, avoid disputed/time-sensitive claims, and make exactly one defensible answer unless Select Multiple is requested.';

    const duplicateRule = avoidFactKeys.length
      ? [
          'SAME-TOPIC FACTS ALREADY USED:',
          avoidFactKeys.join('\n'),
          'Do not generate a question whose underlying fact matches any fact key above.',
          'These keys come ONLY from prior batches of this same requested topic.'
        ].join('\n')
      : 'Create distinct questions that test different facts. No previous-topic content is supplied to this request.';

    const enhancedTopic = [
      'CURRENT HOST TOPIC / INSTRUCTIONS: '+topic,
      generationScope.instruction,
      aiDifficultyInstruction(difficulty,context.sourceType||'ai'),
      languageInstruction,
      formatInstruction,
      sourceRule,
      duplicateRule,
      'GENERATION VARIATION TOKEN: '+String(generationAttempt+1)+'. On retries, choose different valid subtopics/facts within the SAME current scope.',
      requestedType==='multiple_choice'
        ? 'Vary the position of the correct answer across the returned questions. Do not make the first option correct every time.'
        : '',
      'Return clean JSON only in the schema expected by the quiz application.'
    ].filter(Boolean).join('\n\n');

    let res;
    const aiController = new AbortController();
    const aiRequestTimeoutMs = context.sourceType==='ai' ? 26000 : 32000;
    const aiRequestTimer = setTimeout(()=>aiController.abort(),aiRequestTimeoutMs);
    try{
      res = await fetch('/.netlify/functions/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:aiController.signal,
        body:JSON.stringify({
          topic:enhancedTopic,
          originalTopic:topic,
          count,
          optsPerQ,
          questionType:requestedType,
          formatInstruction,
          sourceType:context.sourceType||'',
          sourceName:context.sourceName||'',
          sourceUrls:Array.isArray(context.sourceUrls)?context.sourceUrls.slice(0,2):[],
          sourceEvidenceText:context.sourceType==='link' ? sourceExcerpt : '',
          preferSearch:context.sourceType==='ai',
          questionLanguage,
          generationId:context.generationId||'',
          generationAttempt,
          scopeInstruction:generationScope.instruction,
          structuredScope,
          difficulty,
          generalKnowledge:generationScope.generalKnowledge,
          coverageCategories:generationScope.coverageCategories,
          avoidFactKeys
        })
      });
    }catch(e){
      if(e && e.name==='AbortError'){
        throw new Error('This verified pass exceeded the QZMAX time limit and was stopped. QZMAX will try the next pass.');
      }
      throw new Error('Could not reach the AI server — check your connection.');
    }finally{
      clearTimeout(aiRequestTimer);
    }

    const routedProvider = res.headers.get('X-QZMAX-AI-Provider') || '';
    const routedModel = res.headers.get('X-QZMAX-AI-Model') || '';
    const routedVerification = res.headers.get('X-QZMAX-AI-Verification') || '';
    let items;
    let responseText = '';
    try{
      responseText = await res.text();
      items = responseText ? JSON.parse(responseText) : null;
    }catch(e){
      const gatewayLike = [502,503,504].includes(res.status) ||
        /timeout|timed out|gateway|function invocation|internal server/i.test(responseText);
      if(gatewayLike){
        throw new Error('QZMAX verification request timed out before the server could return a complete result. QZMAX will retry in a smaller verified pass.');
      }
      throw new Error('The QZMAX AI server returned an unreadable response. Please try again.');
    }
    if(!res.ok) throw new Error((items && items.error) || 'Server error generating questions.');
    if(!Array.isArray(items) || !items.length) throw new Error('No usable questions returned.');

    const questions = [];
    for(const item of items){
      if(!item || typeof item.question!=='string' || !Array.isArray(item.options)) continue;
      const opts = item.options.map(o=>String(o).trim()).filter(Boolean);
      if(opts.length<2) continue;

      const base = {
        q:item.question.trim(),
        type:requestedType,
        options:opts,
        timeLimit:timePerQuestion,
        points:pointsPerQuestion,
        explanation:typeof item.explanation==='string' ? item.explanation.trim() : '',
        excluded:false,
        aiMeta:{
          ...getAIQuestionVerificationMeta(context.sourceType,context.sourceName,context.sourceUrls,item),
          language:questionLanguage,
          provider:routedProvider,
          model:routedModel,
          verification:routedVerification,
          generationId:context.generationId||'',
          requestedTopic:topic,
          factKey:typeof item.factKey==='string' ? item.factKey.trim().slice(0,240) : '',
          category:typeof item.category==='string' ? item.category.trim().slice(0,120) : ''
        }
      };

      if(requestedType==='true_false'){
        const returnedCorrect = parseInt(item.correctIndex,10);
        if(opts.length!==2 || ![0,1].includes(returnedCorrect)) continue;
        base.options=aiTrueFalseLabels(questionLanguage);
        base.correct=returnedCorrect;
      }else if(requestedType==='multiple_correct'){
        const indexes = parseAICorrectIndexes(item,opts);
        if(indexes.length<2) continue;
        base.correctIndexes=indexes;
        base.correct=indexes[0];
      }else{
        const idx = parseInt(item.correctIndex,10);
        if(!Number.isInteger(idx) || idx<0 || idx>=opts.length) continue;
        base.type='multiple_choice';
        base.correct=idx;
      }

      if(aiQuestionStructuralCheck(base)) questions.push(base);
    }
    if(!questions.length) throw new Error('The AI response did not contain structurally valid questions.');
    randomizeGeneratedAnswerPositions(questions);
    return questions;
  }

  async function generateVerifiedQuestionBatches({
    topic,requestedCount,optsPerQ,questionType,sourceText,sourceType,sourceName,sourceUrls,
    questionLanguage='English',timePerQuestion=DEFAULT_QUESTION_TIME,pointsPerQuestion=DEFAULT_QUESTION_POINTS,
    difficulty='Medium',structuredScope={},generationId='',existingQuestions,onProgress
  }){
    const target = Math.max(1,Math.min(100,requestedCount||10));

    // Mixed mode is orchestrated here rather than asking one model response to
    // invent inconsistent schemas. Each subtype is independently validated.
    if(questionType==='mixed'){
      const mixedTypes = ['multiple_choice','true_false','multiple_correct'];
      const quotas = {multiple_choice:0,true_false:0,multiple_correct:0};
      for(let i=0;i<target;i++) quotas[mixedTypes[i % mixedTypes.length]]++;

      const mixed = [];
      let completed = 0;
      for(const type of mixedTypes){
        const needed = quotas[type];
        if(!needed) continue;
        const typeLabel = type==='multiple_choice' ? 'Multiple Choice' : type==='true_false' ? 'True / False' : 'Select Multiple';
        if(onProgress) onProgress(completed,target,'Generating '+typeLabel+' questions for the mixed set…');

        const generated = await generateVerifiedQuestionBatches({
          topic,
          requestedCount:needed,
          optsPerQ:type==='true_false' ? 2 : Math.max(3,optsPerQ),
          questionType:type,
          sourceText,
          sourceType,
          sourceName,
          sourceUrls,
          questionLanguage,
          timePerQuestion,
          pointsPerQuestion,
          difficulty,
          structuredScope,
          generationId,
          existingQuestions:(Array.isArray(existingQuestions)?existingQuestions:[]).concat(mixed),
          onProgress:(subDone,subTarget)=>{
            if(onProgress) onProgress(
              Math.min(target,completed+subDone),
              target,
              'Building mixed quiz — '+Math.min(target,completed+subDone)+' of '+target+' ready…'
            );
          }
        });
        mixed.push(...generated);
        completed += generated.length;
      }

      // Shuffle the validated subtypes so Mixed really appears mixed in the queue/game.
      for(let i=mixed.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [mixed[i],mixed[j]] = [mixed[j],mixed[i]];
      }
      if(onProgress) onProgress(target,target,'All '+target+' mixed-format questions ready.');
      return mixed.slice(0,target);
    }
    const accepted = [];
    const known = Array.isArray(existingQuestions) ? existingQuestions.slice() : [];
    // Preserve the host's requested total, but split expensive web-verified
    // work into small serverless passes so one invocation cannot become overloaded.
    const internalBatchSize =
      sourceType==='link' ? 5 :
      sourceType==='ai' ? 5 :
      10;

    // Guided AI already performs expensive web search + blind verification.
    // Keep retries tightly bounded. A request for 5 questions normally uses
    // one verified pass, with at most two recovery passes.
    const maxAttempts =
      sourceType==='link'
        ? Math.ceil(target/internalBatchSize) + 10
        : sourceType==='ai'
        ? Math.ceil(target/internalBatchSize) + 2
        : Math.ceil(target/10) + 8;
    let attempts = 0;

    while(accepted.length < target && attempts < maxAttempts){
      const remaining = target-accepted.length;
      const batchCount = Math.min(internalBatchSize,remaining);
      const excerpt = sourceType==='link'
        ? selectSourceLinkExcerpt(sourceText,topic,attempts,19000)
        : selectSourceExcerpt(sourceText,topic,attempts,15000);
      if(onProgress) onProgress(
        accepted.length,
        target,
        sourceType==='link'
          ? 'Reading another relevant section of the source — building '+(accepted.length+1)+'–'+Math.min(target,accepted.length+batchCount)+' of '+target+'…'
          : sourceType==='ai'
          ? 'Verified pass '+(attempts+1)+' — generating and checking '+batchCount+' question'+(batchCount===1?'':'s')+'…'
          : 'Generating '+(accepted.length+1)+'–'+Math.min(target,accepted.length+batchCount)+' of '+target+'…'
      );

      let batch;
      try{
        batch = await generateQuestionsWithAI(topic,batchCount,optsPerQ,questionType,{
          sourceExcerpt:excerpt,
          sourceType,
          sourceName,
          sourceUrls,
          questionLanguage,
          timePerQuestion,
          pointsPerQuestion,
          difficulty,
          structuredScope,
          generationId,
          generationAttempt:attempts,
          existingQuestions:known.concat(accepted)
        });
      }catch(err){
        attempts++;
        if(attempts>=maxAttempts && !accepted.length) throw err;
        continue;
      }

      for(const q of batch){
        if(accepted.length>=target) break;
        if(!aiQuestionStructuralCheck(q)) continue;
        if(isDuplicateGeneratedQuestion(q,known) || isDuplicateGeneratedQuestion(q,accepted)) continue;
        accepted.push(q);
      }

      attempts++;
      if(onProgress) onProgress(
        accepted.length,
        target,
        accepted.length<target
          ? (
              sourceType==='link'
                ? 'Checked source evidence and duplicates — '+accepted.length+' of '+target+' Link Grounded questions ready…'
                : sourceType==='ai'
                ? 'Blind verification complete — '+accepted.length+' of '+target+' verified questions ready…'
                : 'Checked topic scope, facts and duplicates — '+accepted.length+' of '+target+' unique questions ready…'
            )
          : 'All '+target+' questions ready.'
      );
    }

    if(!accepted.length){
      if(sourceType==='link'){
        throw new Error('QZMAX could not produce any Link Grounded questions from the selected source and focus. The source was not used to invent unchecked questions. Try leaving Focus blank or use a broader focus.');
      }
      throw new Error('QZMAX could not produce a reliable unique question set. Try a broader source or different topic.');
    }
    if(accepted.length < target){
      if(sourceType==='link'){
        throw new Error(
          'QZMAX found '+accepted.length+' of '+target+
          ' unique Link Grounded questions after cycling through the relevant source sections. No unchecked questions were added. Try leaving Focus blank, broadening the focus, or request a smaller additional batch.'
        );
      }
      throw new Error('Only '+accepted.length+' unique, in-scope questions could be produced after verification and duplicate checks. Try a broader document/topic or request fewer questions.');
    }
    return accepted.slice(0,target);
  }

  function questionVerificationBadge(q){
    const meta = q && q.aiMeta;
    if(!meta) return '';
    const kind = meta.kind==='document'?'document':meta.kind==='source'?'source':meta.kind==='link'?'link':meta.kind==='qzmax'?'qzmax':meta.kind==='knowledge'?'knowledge':meta.kind==='studybible'?'studybible':meta.kind==='puzzle'?'puzzle':'review';
    const sourceCount = Array.isArray(meta.sourceUrls) ? meta.sourceUrls.length : 0;
    const sourceCountLabel = meta.kind==='link'
      ? (sourceCount ? sourceCount+' selected source link' : '')
      : (sourceCount ? sourceCount+' independent source'+(sourceCount===1?'':'s') : '');
    const verifyTitle = [
      meta.sourceName||meta.label||'',
      meta.verificationProvider ? 'Blind verifier: '+meta.verificationProvider : '',
      sourceCountLabel
    ].filter(Boolean).join(' · ');
    return '<span class="q-verify-badge '+kind+'" title="'+escapeHtml(verifyTitle)+'">'+
      (kind==='review'?'!':kind==='puzzle'?'🧩':kind==='knowledge'?'📚':kind==='studybible'?'📖':'✓')+' '+escapeHtml(meta.label||'AI • Review')+
    '</span>';
  }

  async function refreshSavedQuizList(){
    const sel = $('qf-saved-select');
    if(!sel) return;
    const obj = await fbGet('savedQuizzes/' + currentUserUid);
    const showArchived = S.viewingArchive;
    const items = obj ? Object.keys(obj)
      .filter(id => !!obj[id].archived === showArchived)
      .map(id=>({ key:id, name:obj[id].name, count:(obj[id].questions||[]).length, savedAt:obj[id].savedAt||0 }))
      : [];
    if(items.length===0){
      sel.innerHTML = '<option value="">'+(showArchived ? 'No archived quizzes' : 'No saved quizzes yet')+'</option>';
    } else {
      items.sort((a,b)=>b.savedAt-a.savedAt);
      sel.innerHTML = items.map(it=>
        '<option value="'+escapeHtml(it.key)+'">'+escapeHtml(it.name)+' ('+it.count+' q)</option>'
      ).join('');
    }
  }

  function updateQuestionTypeUI(){
    const sel = $('qf-type');
    if(!sel) return;
    S.questionType = sel.value || 'multiple_choice';
    const type = S.questionType;
    const optionGroup = $('qf-options-group');
    const typedGroup = $('qf-typed-group');
    const addBtn = $('qf-add-option');
    const label = $('qf-options-label');
    const hint = $('qf-type-hint');

    if(type==='typed'){
      optionGroup.style.display = 'none';
      typedGroup.style.display = 'flex';
      hint.textContent = 'Players type a free-text answer.';
      return;
    }

    optionGroup.style.display = 'flex';
    typedGroup.style.display = 'none';
    addBtn.style.display = type==='true_false' ? 'none' : '';

    if(type==='true_false'){
      const currentCorrect = S.formOpts.findIndex(o=>o.correct);
      S.formOpts = [
        {text:'True', correct:currentCorrect!==1},
        {text:'False', correct:currentCorrect===1}
      ];
      label.textContent = 'True / False — tap the correct answer';
      hint.textContent = 'Fast two-option question.';
    }else if(type==='multiple_correct'){
      label.textContent = 'Answer options — select every correct option';
      hint.textContent = 'Players must select all correct choices.';
    }else{
      const firstCorrect = S.formOpts.findIndex(o=>o.correct);
      S.formOpts.forEach((o,i)=>o.correct = i===(firstCorrect>=0?firstCorrect:0));
      label.textContent = 'Answer options — tap the letter to mark the correct one';
      hint.textContent = 'One correct option.';
    }
    renderOptionInputs();
  }

  function renderOptionInputs(){
    const container = $('qf-options');
    if(!container) return;
    container.innerHTML = '';
    const type = S.questionType || 'multiple_choice';

    S.formOpts.forEach((opt,i)=>{
      const row = document.createElement('div');
      row.className = 'opt-input-row';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'correct-toggle' + (opt.correct ? ' on' : '');
      toggle.textContent = String.fromCharCode(65+i);
      toggle.title = type==='multiple_correct' ? 'Toggle correct answer' : 'Mark as correct';
      toggle.onclick = ()=>{
        if(type==='multiple_correct'){
          opt.correct = !opt.correct;
        }else{
          S.formOpts.forEach(o=>o.correct=false);
          opt.correct = true;
        }
        renderOptionInputs();
      };

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'Option ' + String.fromCharCode(65+i);
      inp.value = opt.text || '';
      if(type==='true_false'){
        inp.readOnly = true;
      }else{
        inp.oninput = ()=>{ opt.text = inp.value; };
      }

      row.appendChild(toggle);
      row.appendChild(inp);

      if(type!=='true_false' && S.formOpts.length > 2){
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'small-x';
        rm.textContent = '✕';
        rm.onclick = ()=>{
          S.formOpts.splice(i,1);
          if(type!=='multiple_correct' && !S.formOpts.some(o=>o.correct)) S.formOpts[0].correct = true;
          renderOptionInputs();
        };
        row.appendChild(rm);
      }
      container.appendChild(row);
    });
  }

  function renderHostQList(){
    const list = $('host-qlist');
    if(!list) return;
    if(S.questionsDraft.length===0){
      if(S.hostWorkspaceMode==='launch'){
        list.innerHTML =
          '<div class="launch-preview-empty">'+
            '<div class="launch-preview-empty-icon">▣</div>'+
            '<div><strong>No quiz loaded</strong><span>Load a saved quiz above to preview its questions.</span></div>'+
          '</div>';
      }else{
        list.innerHTML = '<p class="studio-empty-queue">No questions yet. Add at least one to start.</p>';
      }
    } else {
      list.innerHTML = S.questionsDraft.map((qq,i)=>
        '<div id="qz-question-card-'+i+'" class="qlist-item'+(i===S.editingQuestionIndex?' editing':'')+'">'+
          '<div class="qtxt">'+(i+1)+'. '+escapeHtml(qq.q)+'</div>'+
          '<div class="qlist-meta">'+
            '<span class="qtype-pill">'+questionTypeLabel(qq)+(safeImageUrl(qq.imageUrl)?' · 🖼':'')+'</span>'+
            questionVerificationBadge(qq)+
            '<span class="chip qlist-points">'+qq.points+' pts</span>'+
            (S.hostWorkspaceMode==='studio'
              ? '<div class="qlist-actions"><button class="small-edit" data-i="'+i+'" aria-label="Edit question" title="Edit question">✎</button><button class="small-x" data-i="'+i+'" aria-label="Delete question" title="Delete question">✕</button></div>'
              : '')+
          '</div>'+
        '</div>'
      ).join('');
      list.querySelectorAll('.small-edit').forEach(btn=>{
        btn.onclick = ()=>{ startEditQuestion(parseInt(btn.dataset.i,10)); };
      });
      list.querySelectorAll('.small-x').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = parseInt(btn.dataset.i,10);
          S.questionsDraft.splice(idx,1);
          if(S.editingQuestionIndex === idx){ cancelEditQuestion(); }
          else if(S.editingQuestionIndex !== null && idx < S.editingQuestionIndex){ S.editingQuestionIndex--; }
          renderHostQList();
          pushQuestionsToState();
        };
      });
    }
    const startBtn = $('btn-start-quiz');
    if(startBtn) startBtn.disabled = S.questionsDraft.length===0;
  }

  async function pushQuestionsToState(){
    const st = await fbGet(statePath(S.code));
    if(!st) return;
    st.questions = S.questionsDraft;
    await fbSet(statePath(S.code), st);
  }

  function startHostSetupPoll(){
    clearInterval(S.hostPollHandle);
    S.hostPollHandle = setInterval(async ()=>{
      const [playersObj, st] = await Promise.all([
        fbGet(playersPath(S.code)),
        fbGet(statePath(S.code))
      ]);
      const players = playersObj ? Object.values(playersObj) : [];
      const el = $('host-setup-playercount');
      if(el){
        if(st && st.gameMode==='teams'){
          const assigned = players.filter(p=>p.teamId).length;
          el.textContent = players.length+' joined · '+assigned+' teamed';
          const roster = $('host-team-roster');
          if(roster){
            const teams = normalizeTeams(st.teams,st.teamCount);
            roster.innerHTML = '<div style="display:grid;grid-template-columns:repeat('+Math.min(teams.length,2)+',1fr);gap:7px;">'+teams.map((t,i)=>{
              const members=players.filter(p=>p.teamId===t.id);

  async function beginQuiz(){
    clearInterval(S.hostPollHandle);
    try{
      const [st, playersObjRaw] = await Promise.all([
        fbGetStrict(statePath(S.code)),
        fbGetStrict(playersPath(S.code))
      ]);
      if(!st) return;
      const playersObj = playersObjRaw || {};

      st.sessionMode = S.sessionMode === 'exam' ? 'exam' : 'live';
      st.examDurationMinutes = Math.max(1,Math.min(480,Number(S.examDurationMinutes)||30));
      st.gameMode = st.sessionMode==='exam' ? 'individual' : (S.gameMode === 'teams' ? 'teams' : 'individual');
      st.appVersion = APP_VERSION;
      st.teams = normalizeTeams(S.teams, S.teams && S.teams.length ? S.teams.length : 2);
      st.teamCount = st.teams.length;

      if(st.sessionMode==='live' && st.gameMode==='teams'){
        const counts={};
        st.teams.forEach(t=>counts[t.id]=0);
        Object.values(playersObj).forEach(p=>{
          if(p.teamId && counts[p.teamId]!==undefined) counts[p.teamId]++;
          else p.teamId = null;
        });
        Object.keys(playersObj).forEach(pid=>{
          const p = playersObj[pid];
          if(p.teamId) return;
          const chosen = st.teams.slice().sort((a,b)=>counts[a.id]-counts[b.id])[0];
          p.teamId = chosen.id;
          counts[chosen.id]++;
        });
      }

      const now = getSyncedTime();

      if(st.sessionMode==='exam'){
        st.status = 'exam';
        st.currentIndex = -1;
        st.questionStartedAt = null;
        st.examStartedAt = now;
        st.examEndsAt = now + st.examDurationMinutes*60*1000;
        st.optionCounts = null;
        st.totalAnswered = 0;

        Object.keys(playersObj).forEach(pid=>{
          playersObj[pid].score = 0;
          playersObj[pid].lastPoints = 0;
          playersObj[pid].lastCorrect = null;
          delete playersObj[pid].examSubmittedAt;
          delete playersObj[pid].examAutoSubmitted;
        });

        const updates={};
        updates[statePath(S.code)] = st;
        updates[playersPath(S.code)] = playersObj;
        updates['rooms/' + S.code + '/answers'] = null;
        await fbAtomicUpdate(updates);
        enterHostExam(st);
      }else{
        st.status = 'question';
        st.currentIndex = 0;
        st.questionStartedAt = now;
        st.examStartedAt = null;
        st.examEndsAt = null;
        st.optionCounts = null;
        st.totalAnswered = 0;

        const updates={};
        updates[statePath(S.code)] = st;
        updates[playersPath(S.code)] = playersObj;
        await fbAtomicUpdate(updates);
        enterHostQuestion(st);
      }
    }catch(e){
      showConnectionBanner('Could not start yet — reconnecting to the session.', false);
      startHostSetupPoll();
    }
  }

  function formatExamClock(ms){
    const total = Math.max(0,Math.ceil(ms/1000));
    const h = Math.floor(total/3600);
    const m = Math.floor((total%3600)/60);
    const s = total%60;
    if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  async function finalizeExam(st, reason='completed'){
    clearInterval(S.hostTimerHandle);
    clearInterval(S.hostPollHandle);

    try{
      const fresh = await fbGetStrict(statePath(S.code));
      if(!fresh) return;
      if(fresh.status==='final'){
        buildHostFinal(fresh, await fetchAllPlayers(S.code));
        return;
      }
      if(fresh.status!=='exam') return;

      const [playersObjRaw, allAnswersRaw] = await Promise.all([
        fbGetStrict(playersPath(S.code)),
        fbGetStrict('rooms/'+S.code+'/answers')
      ]);
      const playersObj = playersObjRaw || {};
      const allAnswers = allAnswersRaw || {};
      const endedAt = getSyncedTime();

      Object.keys(playersObj).forEach(pid=>{
        const player = playersObj[pid];
        let totalScore = 0;
        let answered = 0;
        let correctCount = 0;

        (fresh.questions||[]).forEach((q,qi)=>{
          const qAnswers = allAnswers[qi] || {};
          const a = qAnswers[pid];
          const submitted = answerSubmitted(a);
          if(submitted) answered++;
          const correct = submitted && answerIsCorrect(q,a);
          if(correct) correctCount++;
          const base = Number.isFinite(Number(q.points)) ? Number(q.points) : DEFAULT_QUESTION_POINTS;
          const points = (!q.excluded && correct) ? base : 0;
          if(a && submitted){
            a.wasCorrect = correct;
            a.pointsAwarded = points;
            qAnswers[pid] = a;
            allAnswers[qi] = qAnswers;
          }
          totalScore += points;
        });

        player.score = totalScore;
        player.lastPoints = 0;
        player.lastCorrect = null;
        player.examAnsweredCount = answered;
        player.examCorrectCount = correctCount;
        if(!player.examSubmittedAt){
          player.examSubmittedAt = endedAt;
          player.examAutoSubmitted = reason==='time';
        }
      });

      fresh.status = 'final';
      fresh.examEndedAt = endedAt;
      fresh.examEndReason = reason;
      fresh.currentIndex = -1;

      const updates = {};
      updates[playersPath(S.code)] = playersObj;
      updates['rooms/'+S.code+'/answers'] = allAnswers;
      updates[statePath(S.code)] = fresh;
      await fbAtomicUpdate(updates);

      buildHostFinal(fresh, await fetchAllPlayers(S.code));
    }catch(e){
      console.error('exam finalization failed',e);
      showConnectionBanner('Could not finalize the exam yet — retrying…',false);
      setTimeout(()=>finalizeExam(st,reason),1800);
    }
  }

  function scheduleReveal(st, message, delayMs){
    if(S.hostRevealing) return;
    S.hostRevealing = true;

    const el = $('host-q-answered');

  async function hostGoToReveal(st){
    const qi = st.currentIndex;

    try{
      const freshState = await fbGetStrict(statePath(S.code));
      if(!freshState) throw new Error('Session no longer exists');

      if(freshState.status !== 'question' || freshState.currentIndex !== qi){
        if(freshState.status === 'reveal'){
          const qDone = freshState.questions[freshState.currentIndex];
          buildHostReveal(freshState, freshState.optionCounts || new Array((qDone.options||[]).length).fill(0));
          return;
        }
        if(freshState.status === 'leaderboard'){
          buildHostLeaderboard(freshState, await fetchAllPlayers(S.code));
          return;
        }
        if(freshState.status === 'final'){
          buildHostFinal(freshState, await fetchAllPlayers(S.code));
          return;
        }
        return;
      }

      const q = freshState.questions[qi];
      if(!q) throw new Error('Current question missing');

      const [answersObj, playersObj] = await Promise.all([
        fbGetStrict(answersPath(S.code, qi)),
        fbGetStrict(playersPath(S.code))
      ]);
      const answers = answersObj || {};
      const players = playersObj || {};
      const options = q.options || [];
      const optionCounts = new Array(options.length).fill(0);
      const typedCounts = new Map();
      let correctCount = 0;
      let totalAnswered = 0;

      for(const pid in answers){
        const a = answers[pid];
        if(!answerSubmitted(a)) continue;
        totalAnswered++;
        if(typeof a.answerIndex === 'number' && a.answerIndex>=0 && a.answerIndex<optionCounts.length){
          optionCounts[a.answerIndex]++;
        }
        if(Array.isArray(a.answerIndexes)){
          [...new Set(a.answerIndexes.map(Number).filter(Number.isInteger))].forEach(i=>{
            if(i>=0 && i<optionCounts.length) optionCounts[i]++;
          });
        }
        if(typeof a.answerText === 'string'){
          const shown = a.answerText.trim().slice(0,80) || '(blank)';
          typedCounts.set(shown, (typedCounts.get(shown)||0)+1);
        }
      }

      for(const pid in players){
        const player = players[pid];
        const a = answers[pid];
        const oldPoints = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
        let points = 0;
        const correct = answerIsCorrect(q,a);

        if(a && answerSubmitted(a)){
          if(correct){
            correctCount++;
            const frac = Math.max(0, Math.min(1, 1 - ((a.timeMs||0)/1000)/q.timeLimit));
            const base = Number.isFinite(Number(q.points)) ? Number(q.points) : DEFAULT_QUESTION_POINTS;
            points = Math.round(base/2 + (base/2)*frac);
          }
          a.pointsAwarded = points;
          a.wasCorrect = correct;
        }

        if(!q.excluded) player.score = Math.max(0, (player.score||0) - oldPoints + points);
        player.lastPoints = points;
        player.lastCorrect = correct;
      }

      const nextState = JSON.parse(JSON.stringify(freshState));
      nextState.status = 'reveal';
      nextState.optionCounts = optionCounts;
      nextState.totalAnswered = totalAnswered;
      nextState.correctCount = correctCount;
      nextState.responseSummary = Array.from(typedCounts.entries())
        .sort((a,b)=>b[1]-a[1])
        .slice(0,6)
        .map(([text,count])=>({text,count}));
      nextState.revealedAt = getSyncedTime();

      const updates = {};
      updates[playersPath(S.code)] = players;
      updates[answersPath(S.code, qi)] = answers;
      updates[statePath(S.code)] = nextState;
      await fbAtomicUpdate(updates);

      firebaseConnected = true;
      showConnectionBanner('Live game synced.', true);
      buildHostReveal(nextState, optionCounts);
    }catch(e){
      console.error('host reveal transition failed', e);
      firebaseConnected = false;
      showConnectionBanner('Connection interrupted — reveal will continue automatically when reconnected.', false);
      clearTimeout(S.hostRecoveryHandle);
      S.hostRecoveryHandle = setTimeout(()=>hostGoToReveal(st), 1800);
    }
  }

  async function recalcQuestionScore(qi, newCorrectIndex){
    const st = await fbGet(statePath(S.code));
    if(!st) return null;
    const q = st.questions[qi];
    if(!q) return null;
    const [answersObj, playersObj] = await Promise.all([
      fbGet(answersPath(S.code, qi)),
      fbGet(playersPath(S.code))
    ]);
    const answers = answersObj || {};
    const players = playersObj || {};
    for(const pid in players){
      const player = players[pid];
      const a = answers[pid];
      const oldPoints = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
      let newPoints = 0, correct = false;
      if(a && typeof a.answerIndex === 'number'){
        correct = a.answerIndex === newCorrectIndex;
        if(correct){
          const frac = Math.max(0, Math.min(1, 1 - (a.timeMs/1000)/q.timeLimit));
          const base = Number.isFinite(Number(q.points)) ? Number(q.points) : DEFAULT_QUESTION_POINTS;
          newPoints = Math.round(base/2 + (base/2)*frac);
        }
        a.pointsAwarded = newPoints;
        a.wasCorrect = correct;
      }
      if(!q.excluded){
        player.score = Math.max(0, (player.score||0) - oldPoints + newPoints);
      }
      if(qi === st.currentIndex){ player.lastPoints = newPoints; player.lastCorrect = correct; }
    }
    q.correct = newCorrectIndex;
    await Promise.all([
      fbSet(playersPath(S.code), players),
      fbSet(answersPath(S.code, qi), answers)
    ]);
    await fbSet(statePath(S.code), st);
    return st;
  }

  async function toggleExcludeQuestion(qi, exclude){
    const st = await fbGet(statePath(S.code));
    if(!st) return null;
    const q = st.questions[qi];
    if(!q) return null;
    const [answersObj, playersObj] = await Promise.all([
      fbGet(answersPath(S.code, qi)),
      fbGet(playersPath(S.code))
    ]);
    const answers = answersObj || {};
    const players = playersObj || {};
    for(const pid in players){
      const player = players[pid];
      const a = answers[pid];
      const pts = (a && typeof a.pointsAwarded === 'number') ? a.pointsAwarded : 0;
      if(pts===0) continue;
      player.score = Math.max(0, (player.score||0) + (exclude ? -pts : pts));
    }
    q.excluded = exclude;
    await fbSet(playersPath(S.code), players);
    await fbSet(statePath(S.code), st);
    return st;
  }

  function wireQuestionReviewPanel(container, refreshFn){
    container.querySelectorAll('.qr-fix-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(btn.classList.contains('on')) return;
        container.querySelectorAll('.qr-fix-btn, .qr-exclude-btn').forEach(b=>b.disabled=true);
        const qi = parseInt(btn.dataset.qi,10);
        const i = parseInt(btn.dataset.i,10);
        await recalcQuestionScore(qi, i);
        await refreshFn();
      };
    });
    container.querySelectorAll('.qr-exclude-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        container.querySelectorAll('.qr-fix-btn, .qr-exclude-btn').forEach(b=>b.disabled=true);

        const st = await fbGet(statePath(S.code));
        const wasExcluded = !!(st && st.questions[qi] && st.questions[qi].excluded);
        await toggleExcludeQuestion(qi, !wasExcluded);
        await refreshFn();
      };
    });
  }

  function buildHostReveal(st, optionCounts){
    const q = st.questions[st.currentIndex];
    const type = normalizedQuestionType(q);
    const totalAnswered = typeof st.totalAnswered==='number'
      ? st.totalAnswered
      : (type==='multiple_correct' ? 0 : optionCounts.reduce((a,b)=>a+b,0));
    const correctCount = typeof st.correctCount==='number'
      ? st.correctCount
      : ((type==='multiple_choice'||type==='true_false') ? (optionCounts[q.correct]||0) : 0);
    const accuracy = totalAnswered ? Math.round((correctCount/totalAnswered)*100) : 0;
    const maxCount = Math.max(1, ...(optionCounts||[]));
    const correctIndexes = new Set(getCorrectIndexes(q));

    const distribution = type==='typed'
      ? '<div class="accepted-answer-box"><span>Accepted answer'+((q.acceptedAnswers||[]).length===1?'':'s')+'</span><strong>'+escapeHtml(getCorrectAnswerDisplay(q))+'</strong></div>'+
        ((st.responseSummary||[]).length ? '<div class="typed-response-list">'+st.responseSummary.map(r=>'<span class="typed-response-chip">'+escapeHtml(r.text)+' · '+r.count+'</span>').join('')+'</div>' : '')
      : '<div class="reveal-bars">'+
          (q.options||[]).map((o,i)=>{
            const isCorrect = correctIndexes.has(i);
            const width = (optionCounts[i]||0)/maxCount*100;
            return '<div class="reveal-option'+(isCorrect?' correct':'')+'">'+
              '<span class="opt-letter" style="'+(isCorrect?'background:var(--correct);color:var(--void);':'')+'">'+String.fromCharCode(65+i)+'</span>'+

  async function fetchAllPlayers(code){
    const obj = await fbGet(playersPath(code));
    const players = obj ? Object.values(obj) : [];
    players.sort((a,b)=>(b.score||0)-(a.score||0));
    return players;
  }


  function previousRankMap(players){
    const prior = players.slice().sort((a,b)=>{
      const aPrev = (a.score||0) - (a.lastPoints||0);
      const bPrev = (b.score||0) - (b.lastPoints||0);
      if(bPrev !== aPrev) return bPrev - aPrev;
      return String(a.name||'').localeCompare(String(b.name||''));
    });
    const map = {};
    prior.forEach((p,i)=>{ map[p.id] = i+1; });
    return map;
  }

  function rankMoveHtml(currentRank, previousRank){
    if(!previousRank || previousRank === currentRank) return '<span class="rank-move rank-same">—</span>';
    const diff = previousRank - currentRank;
    if(diff > 0) return '<span class="rank-move rank-up">↑ '+diff+'</span>';
    return '<span class="rank-move rank-down">↓ '+Math.abs(diff)+'</span>';
  }

  function animateNumber(el, target, duration=1050){
    if(!el) return;
    const end = Math.max(0, Number(target)||0);
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){
      el.textContent = end.toLocaleString();
      return;
    }
    el.classList.add('counting');
    const started = performance.now();
    const ease = t => 1 - Math.pow(1-t,3);
    const frame = now=>{
      const p = Math.min(1,(now-started)/duration);
      el.textContent = Math.round(end*ease(p)).toLocaleString();
      if(p<1) requestAnimationFrame(frame);
      else{
        el.textContent = end.toLocaleString();
        el.classList.remove('counting');
      }
    };
    requestAnimationFrame(frame);
  }

  function ensureFinalConfettiLayer(){
    let layer = document.querySelector('.hf-celebration-layer');
    if(!layer){
      layer = document.createElement('div');
      layer.className = 'hf-celebration-layer';
      document.body.appendChild(layer);
    }
    S.finalConfettiLayer = layer;
    return layer;
  }

  function spawnFinalConfettiBurst(){
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced) return;
    const layer = ensureFinalConfettiLayer();
    const colors = ['#7b61ff','#5e7dff','#35d8ff','#46e6a5','#ffd36e','#ff7f9b'];
    const burstCount = window.innerWidth < 700
      ? 10 + Math.floor(Math.random()*6)
      : 14 + Math.floor(Math.random()*8);
    const originX = 8 + Math.random()*84;
    const originY = 10 + Math.random()*68;

    for(let i=0;i<burstCount;i++){
      const piece = document.createElement('i');
      piece.className = 'hf-confetti ' + (i%5===0?'circle':i%4===0?'slim':'');
      const offsetX = -28 + Math.random()*56;
      const offsetY = -20 + Math.random()*40;
      piece.style.left = `calc(${originX}vw + ${offsetX}px)`;
      piece.style.top = `calc(${originY}vh + ${offsetY}px)`;
      piece.style.background = colors[(i + Math.floor(Math.random()*colors.length)) % colors.length];
      piece.style.setProperty('--delay',(Math.random()*.12)+'s');
      piece.style.setProperty('--dur',(1.6 + Math.random()*1.2)+'s');
      piece.style.setProperty('--drift-x',((-120 + Math.random()*240))+'px');
      piece.style.setProperty('--drift-y',((80 + Math.random()*180))+'px');
      piece.style.setProperty('--spin',((300 + Math.random()*820)*(Math.random()>.5?1:-1))+'deg');
      piece.style.setProperty('--start-scale',(0.72 + Math.random()*0.55).toFixed(2));
      piece.style.setProperty('--end-scale',(0.9 + Math.random()*0.6).toFixed(2));
      layer.appendChild(piece);
      setTimeout(()=>piece.remove(), 3600);
    }
  }

  function stopFinalConfetti(removeLayer=true){
    S.finalConfettiActive = false;
    if(S.finalConfettiTimer){
      clearInterval(S.finalConfettiTimer);
      S.finalConfettiTimer = null;
    }
    if(removeLayer){
      if(S.finalConfettiLayer) S.finalConfettiLayer.remove();
      else{
        const old = document.querySelector('.hf-celebration-layer');
        if(old) old.remove();
      }
      S.finalConfettiLayer = null;
    }
  }

  function startFinalConfettiLoop(){
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced) return;
    stopFinalConfetti(true);
    S.finalConfettiActive = true;
    ensureFinalConfettiLayer();
    spawnFinalConfettiBurst();
    S.finalConfettiTimer = setInterval(()=>{
      if(!S.finalConfettiActive) return;
      spawnFinalConfettiBurst();
    }, window.innerWidth < 700 ? 560 : 440);
  }

  function startHostFinalCelebration(st, winningScore){
    const key = String(st.code||S.code||'')+':'+String(st.createdAt||'')+':final';
    const shouldBurst = S.lastCelebratedFinalKey !== key;
    S.lastCelebratedFinalKey = key;

    const winnerCard = document.querySelector('#screen-host-final .hf-winner-card');
    const crown = document.querySelector('#screen-host-final .hf-crown');
    if(winnerCard) winnerCard.classList.add('celebrate');
    if(crown) crown.classList.add('celebrate');

    animateNumber($('hf-final-winning-score'), winningScore, 1150);

    document.querySelectorAll('#screen-host-final .hf-podium-card').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('hf-enter'), 180 + i*115);
    });
    document.querySelectorAll('#screen-host-final .hf-row').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('hf-enter'), 420 + i*65);
    });

    if(shouldBurst || !S.finalConfettiActive) startFinalConfettiLoop();
  }

        Object.keys(playersObj).forEach(pid=>{
          playersObj[pid].score = 0;
          playersObj[pid].lastPoints = 0;
          playersObj[pid].lastCorrect = null;
        });

        const nextTeams = normalizeTeams(st.teams,st.teamCount);
        const nextState = {
          code,
          status:'setup',
          hostUid: currentUserUid,
          hostControllerId:getHostControllerId(),
          hostControllerUpdatedAt:getSyncedTime(),
          sessionMode:'live',
          examDurationMinutes:Number(st.examDurationMinutes)||30,
          gameMode:'individual',
          appVersion:APP_VERSION,
          teamCount:nextTeams.length,
          teams:nextTeams,
          questions:[],
          currentIndex:-1,
          questionStartedAt:null,
          examStartedAt:null,
          examEndsAt:null,
          optionCounts:null,
          totalAnswered:0,
          createdAt:Date.now()
        };

        const updates = {};
        updates[playersPath(code)] = playersObj;
        updates['rooms/' + code + '/answers'] = null;
        updates[statePath(code)] = nextState;
        await fbAtomicUpdate(updates);

        S.sessionMode = nextState.sessionMode;
        S.examDurationMinutes = nextState.examDurationMinutes;
        S.gameMode = nextState.gameMode;
        S.teams = nextState.teams;
      }catch(e){
        btn.disabled = false;
        btn.textContent = 'Play another quiz — same session';
        showConnectionBanner('Connection interrupted — current session was not reset.', false);
        return;
      }

      S.questionsDraft = [];
      S.loadedQuizId = null;
      S.editingQuestionIndex = null;
      S.viewingArchive = false;
      S.hostRevealing = false;
      S.lastPhaseKey = null;

      buildHostSetup('launch');
      showScreen('screen-host-setup');
      startHostSetupPoll();
    };
  }

  async function playerAttemptJoin(){
    const name = $('pj-name').value.trim();
    const code = $('pj-code').value.trim().toUpperCase();
    if(!name || !code){ $('pj-err').textContent = 'Enter your name and the session code.'; return; }
    $('pj-submit').disabled = true;
    const st = await fbGet(statePath(code));
    if(!st){ $('pj-err').textContent = 'No session found with that code.'; $('pj-submit').disabled = false; return; }
    S.code = code; S.name = name; S.pid = genId(); S.teamId = null;

    // In a live Team Battle, late joiners are placed into the smallest team automatically.
    if((st.sessionMode||'live')==='live' && st.gameMode==='teams' && st.status!=='setup'){
      const existingPlayersObj = await fbGet(playersPath(code)) || {};
      const teams = normalizeTeams(st.teams, st.teamCount);
      const counts={};
      teams.forEach(t=>counts[t.id]=0);
      Object.values(existingPlayersObj).forEach(p=>{ if(p.teamId && counts[p.teamId]!==undefined) counts[p.teamId]++; });
      const chosen = teams.slice().sort((a,b)=>counts[a.id]-counts[b.id])[0];
      if(chosen) S.teamId = chosen.id;
    }

    const joined = await fbSet(playerPath(code, S.pid), { id:S.pid, name, teamId:S.teamId, score:0, lastPoints:0, lastCorrect:null, joinedAt:Date.now() });
    if(!joined){
      $('pj-err').textContent = 'Could not join the session. Please try again.';
      $('pj-submit').disabled = false;
      return;
    }
    savePlayerSession();
    S.lastPhaseKey = null;
    S.hadRoom = false;
    startPlayerPoll();
  }

            '<p>'+(examMode?'Waiting for the host to start the exam…':'Waiting for the host to start the quiz…')+'</p>'+
            (examMode?'<div class="exam-lobby-note">📝 One timer will apply to the whole exam. You can move between questions and submit when ready.</div>':'')+

          '</div>'

            savePlayerSession();

          }catch(e){
            showConnectionBanner('Could not switch teams yet — try again.', false);
          }

    const leaveBtn = $('player-leave-lobby');
    if(leaveBtn) leaveBtn.onclick = leavePlayerSession;
  }

  async function playerPollTick(){
    const st = await fbGet(statePath(S.code));
    if(!st){
      if(S.hadRoom){
        clearInterval(S.playerPollHandle);
        clearInterval(S.playerTimerHandle);
        showPlayerEndedScreen();
      }
      return;
    }
    S.hadRoom = true;
    if(st.appVersion && st.appVersion !== APP_VERSION){
      showConnectionBanner('This session is using QZMAX v'+st.appVersion+'. Refresh this page if the question display looks out of date.', false);
    }
    const teamKey = st.gameMode==='teams' ? ':'+JSON.stringify(st.teams||[]) : '';
    const currentQ = st.questions && st.currentIndex>=0 ? st.questions[st.currentIndex] : null;
    const mediaKey = currentQ ? ':'+(currentQ.imageUrl||'')+':'+normalizedQuestionType(currentQ) : '';
    const phaseKey = st.status + ':' + st.currentIndex + ':' + (st.gameMode||'individual') + ':'+(st.sessionMode||'live') + ':'+(st.examEndsAt||'') + teamKey + mediaKey + ':'+(st.appVersion||'');
    if(st.status==='setup'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; buildPlayerLobby(st); }
    } else if(st.status==='exam'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerExam(st); }
    } else if(st.status==='question'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerQuestion(st); }
    } else if(st.status==='reveal'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerReveal(st); }
    } else if(st.status==='leaderboard'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerLeaderboard(st); }
    } else if(st.status==='final'){
      if(S.lastPhaseKey!==phaseKey){ S.lastPhaseKey = phaseKey; await enterPlayerFinal(); }
    }
  }


  async function submitExamForPlayer(st, auto=false){
    clearInterval(S.playerTimerHandle);

      const player = await fbGetStrict(playerPath(S.code,S.pid));
      if(!player) return;
      if(!player.examSubmittedAt){
        player.examSubmittedAt = getSyncedTime();
        player.examAutoSubmitted = !!auto;
        await fbSet(playerPath(S.code,S.pid),player);
      }
      showPlayerExamSubmitted(st,auto);
    }catch(e){
      showConnectionBanner('Your answers are saved, but submission is retrying…',false);
      setTimeout(()=>submitExamForPlayer(st,auto),1200);
