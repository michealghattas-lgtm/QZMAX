<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<meta name="description" content="QZMAX — Create AI-powered quizzes, play live, compete together and see instant results.">
<title>QZMAX — Get smart. Play smarter.</title>
<!-- QZMAX 3.8.5 deployment-ready build: externalized visual assets -->
<link rel="icon" type="image/png" href="assets/qzmax-app-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
html, body{
  margin:0; padding:0;
  background:#050814;
  height:100%;
  overscroll-behavior:none;
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --void: #050814;
  --surface: rgba(13, 19, 36, 0.6);
  --surface-2: rgba(26, 36, 61, 0.8);
  --line: rgba(0, 212, 255, 0.2);
  --ink: #F8FAFC;
  --muted: #8B9BB4;
  --signal: #00D4FF;
  --signal-ink: #001E26;
  --correct: #00FA9A;
  --wrong: #FF2E63;
  --radius: 18px;
}
*{box-sizing:border-box;}
#quiz-root{
  font-family:'Inter',system-ui,sans-serif;
  font-size:17px;
  background: radial-gradient(circle at 50% 0%, #0d162b 0%, var(--void) 70%);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
#quiz-root .num, .ring-num, .code-text, .score-num, .points-num{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
}
.screen{display:none; flex:1; flex-direction:column; padding:28px; animation:fadeIn .35s ease;}
.screen.active{display:flex;}
@media (prefers-reduced-motion: reduce){ .screen{animation:none;} }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-0.01em;}
p{margin:0; color:var(--muted); line-height:1.5;}

.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.brand-logo-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,250,154,0.2));
  border: 1px solid var(--signal);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px rgba(0,212,255,0.4);
  animation: pulseGlow 3s infinite alternate;
}
@keyframes pulseGlow {
  0% { box-shadow: 0 0 15px rgba(0,212,255,0.3); }
  100% { box-shadow: 0 0 30px rgba(0,212,255,0.7); }
}
.brand-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #F8FAFC;
  text-transform: uppercase;
}
.brand-title span {
  color: var(--signal);
  text-shadow: 0 0 12px rgba(0,212,255,0.6);
}

.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:17px;
  border:none; border-radius:12px; padding:14px 22px; cursor:pointer;
  transition:all .2s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:var(--signal); 
  color:var(--signal-ink);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
}
.btn-primary:hover{
  box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}
.btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.btn-ghost:hover{border-color:var(--signal);}
.btn-danger{background:rgba(255, 46, 99, 0.1); color:var(--wrong); border:1px solid rgba(255,46,99,.35);}
.btn-danger:hover{background:rgba(255, 46, 99, 0.2);}
.btn-block{width:100%;}

input[type=text], input[type=password], input[type=email], select{
  font-family:'Inter',sans-serif; font-size:18px; color:var(--ink);
  background:rgba(0,0,0,0.3); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; width:100%; outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}
input[type=text]:focus, input[type=password]:focus, input[type=email]:focus, select:focus{
  border-color:var(--signal);
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
}
select option { background: #0d1324; color: #F8FAFC; }
input[type=text]::placeholder, input[type=password]::placeholder, input[type=email]::placeholder{color:var(--muted);}
label{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600;}

.eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--signal); font-weight:700; text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);}
.center-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.chip{background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.code-text{font-size:22px; letter-spacing:.12em; color:var(--signal); text-shadow: 0 0 8px rgba(0,212,255,0.4);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);}

.ring-wrap{position:relative; width:120px; height:120px;}
.ring-wrap svg{transform:rotate(-90deg); filter:drop-shadow(0 0 8px rgba(0,212,255,0.3));}
.ring-bg{fill:none; stroke:var(--surface-2); stroke-width:8;}
.ring-fg{fill:none; stroke:var(--signal); stroke-width:8; stroke-linecap:round; transition:stroke .2s ease;}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:700;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:640px;}
.opt-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; text-align:left; display:flex; gap:14px; align-items:center; font-size:19px; font-weight:600; cursor:pointer; transition:all .15s ease; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.opt-card:hover{border-color:var(--signal); background:rgba(0, 212, 255, 0.05);}
.opt-card:active{transform:scale(.98);}
.opt-letter{width:36px; height:36px; font-size:17px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:var(--muted); flex-shrink:0;}
.opt-card.selected{border-color:var(--signal); background:rgba(0, 212, 255, 0.1); box-shadow:inset 0 0 15px rgba(0,212,255,0.1);}
.opt-card.correct{border-color:var(--correct); background:rgba(0, 250, 154, 0.1); box-shadow:inset 0 0 15px rgba(0,250,154,0.1);}
.opt-card.correct .opt-letter{background:var(--correct); color:var(--void); box-shadow:0 0 10px rgba(0,250,154,0.5);}
.opt-card.wrong{border-color:var(--wrong); background:rgba(255, 46, 99, 0.1); box-shadow:inset 0 0 15px rgba(255,46,99,0.1);}
.opt-card.wrong .opt-letter{background:var(--wrong); color:var(--void); box-shadow:0 0 10px rgba(255,46,99,0.5);}
.opt-card.disabled{pointer-events:none; opacity:.55;}
.opt-card.selected .opt-letter{background:var(--signal); color:var(--signal-ink); box-shadow:0 0 10px rgba(0,212,255,0.5);}

.bar-row{display:flex; align-items:center; gap:10px; width:100%; max-width:520px; font-size:16px;}
.bar-track{flex:1; height:14px; background:rgba(0,0,0,0.4); border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; background:var(--signal); border-radius:8px; transition:width .5s ease; box-shadow:0 0 10px rgba(0,212,255,0.5);}
.bar-fill.correct{background:var(--correct); box-shadow:0 0 10px rgba(0,250,154,0.5);}

.lb-row{display:flex; align-items:center; gap:14px; width:100%; max-width:520px; padding:13px 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:17px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
.lb-rank{font-family:'Space Grotesk'; font-weight:700; color:var(--muted); width:22px;}
.lb-name{flex:1; font-weight:600; text-align:left;}
.lb-score{font-family:'Space Grotesk'; font-weight:700; color:var(--signal); text-shadow:0 0 8px rgba(0,212,255,0.3);}
.lb-row.me{border-color:var(--signal); background:rgba(0, 212, 255, 0.05);}

.qform-row{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.opt-input-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.correct-toggle{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); font-weight:700; cursor:pointer; flex-shrink:0; transition:all .2s ease;}
.correct-toggle.on{background:var(--correct); color:var(--void); border-color:var(--correct); box-shadow:0 0 10px rgba(0,250,154,0.4);}
.qlist-item{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; font-size:14px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
.qlist-item.editing{border-color:var(--signal); background:rgba(0, 212, 255, 0.08);}
.qlist-item .qtxt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:75%;}
.small-x{background:none; border:none; color:var(--wrong); cursor:pointer; font-size:16px;}

.err-msg{color:var(--wrong); font-size:14px; min-height:16px; text-shadow:0 0 8px rgba(255,46,99,0.3);}
.role-btn{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; text-align:left; cursor:pointer; width:100%; margin-bottom:14px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); transition:all .2s ease;}
.role-btn h3{color:#FFFFFF; margin-bottom:8px;}
.role-btn:hover{border-color:var(--signal); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.4);}
.scroll-y{overflow-y:auto; flex:1;}
.badge-correct{color:var(--correct); font-weight:700; text-shadow:0 0 12px rgba(0,250,154,0.4);}
.badge-wrong{color:var(--wrong); font-weight:700; text-shadow:0 0 12px rgba(255,46,99,0.4);}
.podium{display:flex; align-items:flex-end; gap:14px; margin:20px 0;}
.podium-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
.podium-bar{width:70px; border-radius:8px 8px 0 0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; backdrop-filter:blur(5px);}
.podium-bar.gold{background:var(--signal); color:var(--signal-ink); height:110px; box-shadow:0 0 20px rgba(0,212,255,0.4);}
.podium-bar.silver{background:#C7CBD6; color:var(--void); height:80px;}
.podium-bar.bronze{background:#C08552; color:var(--void); height:60px;}


/* ===== QZMAX 2.0 visual system ===== */
:root{
  --void:#070914;
  --void-2:#0b1020;
  --surface:rgba(16,22,42,.72);
  --surface-2:rgba(25,33,59,.82);
  --surface-solid:#11182c;
  --line:rgba(124,145,255,.20);
  --line-strong:rgba(124,145,255,.42);
  --ink:#f8f9ff;
  --muted:#9ca8c2;
  --signal:#7c6cff;
  --signal-2:#23d9ff;
  --signal-ink:#fff;
  --correct:#27e6a0;
  --wrong:#ff557d;
  --gold:#ffd166;
  --radius:22px;
}
html,body{background:#050711;}
#quiz-root{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(124,108,255,.20), transparent 60%),
    radial-gradient(800px 500px at 90% 10%, rgba(35,217,255,.10), transparent 58%),
    linear-gradient(180deg,#080b18 0%,#050711 100%);
}
#quiz-root:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.34;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}
.screen{position:relative;z-index:1;padding:clamp(18px,4vw,42px);}
h1,h2,h3{letter-spacing:-.025em;}
p{color:#aab4cb;}
.brand-header{gap:14px;margin-bottom:14px;}
.brand-logo-icon{
  width:76px;height:76px;border-radius:24px;
  background:linear-gradient(145deg,rgba(124,108,255,.24),rgba(35,217,255,.10));
  border:1px solid rgba(151,140,255,.62);
  box-shadow:0 18px 55px rgba(89,73,255,.22),inset 0 1px 0 rgba(255,255,255,.10);
  animation:pulseGlow 4s ease-in-out infinite alternate;
}
.brand-logo-icon svg{filter:drop-shadow(0 0 10px rgba(35,217,255,.5));}
.brand-title{font-size:clamp(34px,7vw,48px);text-transform:none;line-height:1;}
.brand-title span{color:#8e82ff;text-shadow:0 0 20px rgba(124,108,255,.45);}
.btn{border-radius:14px;padding:15px 22px;box-shadow:none;}
.btn-primary{background:linear-gradient(135deg,#7c6cff,#5c8dff);color:#fff;box-shadow:0 12px 28px rgba(91,78,255,.24);}
.btn-primary:hover{box-shadow:0 16px 34px rgba(91,78,255,.34);transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,.045);border-color:var(--line);}
input[type=text],input[type=password],input[type=email],select{background:rgba(7,10,22,.70);border-color:rgba(124,145,255,.25);border-radius:14px;}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus,select:focus{border-color:#8e82ff;box-shadow:0 0 0 4px rgba(124,108,255,.12);}
.eyebrow{color:#8e82ff;text-shadow:none;letter-spacing:.16em;}
.chip{background:rgba(255,255,255,.055);border-color:rgba(124,145,255,.24);padding:9px 14px;}
.code-text{color:#77e7ff;text-shadow:0 0 12px rgba(35,217,255,.35);}
.card,.role-btn,.opt-card,.lb-row,.qlist-item{background:rgba(15,21,40,.72);border-color:rgba(124,145,255,.18);box-shadow:0 12px 34px rgba(0,0,0,.16);}
.role-btn{position:relative;overflow:hidden;padding:22px 22px 22px 72px;min-height:112px;transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;}
.role-btn:before{content:"";position:absolute;left:22px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#7c6cff,#23d9ff);box-shadow:0 8px 22px rgba(92,116,255,.28);}
#btn-be-host:after{content:"✦";position:absolute;left:31px;top:50%;transform:translateY(-53%);font-size:18px;color:#fff;}
#btn-be-player:after{content:"→";position:absolute;left:31px;top:50%;transform:translateY(-53%);font-size:20px;color:#fff;}
.role-btn:hover{border-color:rgba(142,130,255,.62);background:rgba(24,30,55,.88);transform:translateY(-3px);box-shadow:0 18px 42px rgba(0,0,0,.30);}
.role-btn h3{font-size:20px!important;margin-bottom:5px;}
.role-btn p{font-size:14px;}
.opt-grid{gap:14px;}
.opt-card{border-radius:18px;padding:19px 18px;min-height:70px;}
.opt-card:hover{border-color:rgba(142,130,255,.65);background:rgba(124,108,255,.08);}
.opt-card.selected{border-color:#8e82ff;background:rgba(124,108,255,.13);box-shadow:0 0 0 2px rgba(124,108,255,.10),0 12px 30px rgba(75,61,180,.18);}
.opt-letter{border-radius:11px;background:rgba(255,255,255,.07);color:#b8c1d6;}
.opt-card.selected .opt-letter{background:#7c6cff;color:#fff;box-shadow:0 0 16px rgba(124,108,255,.45);}
.ring-fg{stroke:#7c6cff;filter:drop-shadow(0 0 7px rgba(124,108,255,.4));}
.ring-num{font-size:34px;}
.lb-row{border-radius:14px;padding:14px 16px;}
.lb-row.me{border-color:rgba(124,108,255,.7);background:rgba(124,108,255,.10);}
.lb-score{color:#77e7ff;text-shadow:0 0 10px rgba(35,217,255,.25);}
.podium-bar.gold{background:linear-gradient(180deg,#8e82ff,#6a5cf0);color:#fff;box-shadow:0 0 28px rgba(124,108,255,.34);}
/* Generated screens: make the question experience feel like a game */
#screen-player-question .topbar{max-width:860px;width:100%;margin:0 auto 10px;}
#screen-player-question>div:nth-child(2){max-width:860px;width:100%;margin:0 auto;}
#screen-player-question h2{font-size:clamp(26px,4vw,40px)!important;line-height:1.16;padding:22px 4px;}
#screen-player-question .opt-card{font-size:clamp(16px,2vw,20px);min-height:78px;}
#screen-player-question #pq-status{font-size:13px;letter-spacing:.08em;text-transform:uppercase;}
#screen-player-question .chip{font-size:13px;}
#screen-player-join .center-stage,.screen-player-lobby .center-stage{width:100%;}
@media(max-width:700px){
  .screen{padding:18px;}
  .opt-grid{grid-template-columns:1fr;}
  .brand-title{font-size:36px;}
  .role-btn{min-height:104px;padding-left:68px;}
}
@media(min-width:900px){
  #screen-role .center-stage{max-width:760px;margin:0 auto;}
  #screen-role .center-stage>p{font-size:17px;}
  #screen-role .center-stage>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;gap:16px;max-width:700px!important;}
  #screen-role .role-btn{margin-bottom:0;}
}


/* AI Quiz Studio polish */
.ai-studio-wrap{max-width:1080px;margin:0 auto;padding:8px 0 24px}.ai-studio-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.ai-studio-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8ea7d0}.ai-studio-title{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.035em;margin:0}.ai-studio-subtitle{color:#91a0b8;margin:6px 0 0;max-width:650px}.ai-studio-room{padding:9px 13px;border:1px solid rgba(130,160,220,.22);border-radius:14px;background:rgba(255,255,255,.035);white-space:nowrap}.ai-studio-room span{color:#7e8ca5;font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-right:8px}.ai-studio-room strong{letter-spacing:.14em}.ai-studio-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.ai-studio-card{border:1px solid rgba(129,157,211,.18);background:linear-gradient(145deg,rgba(18,28,51,.94),rgba(11,17,32,.98));border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.ai-studio-main{padding:22px}.ai-studio-card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.ai-spark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#7657ff,#1ccfff);box-shadow:0 8px 24px rgba(91,102,255,.28)}.ai-studio-card-top h3{margin:0}.ai-studio-card-top p{margin:3px 0 0;color:#8492aa;font-size:12px}.ai-studio-side{padding:20px}.ai-side-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#7e8ca5;font-weight:800;margin-bottom:8px}.ai-feature{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid rgba(130,160,220,.10)}.ai-feature:last-child{border-bottom:0}.ai-feature-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;background:rgba(100,122,255,.1);flex:0 0 auto}.ai-feature strong{display:block;font-size:13px}.ai-feature span{display:block;color:#7f8da5;font-size:11px;margin-top:3px;line-height:1.4}.ai-prompt{min-height:88px!important;resize:vertical}.ai-generate-hero{min-height:50px!important;border-radius:14px!important;font-weight:800!important;margin-top:10px!important}.ai-studio-main .card{border-radius:16px!important}
/* Player-side cinematic background */
#screen-player-join,#screen-player-lobby,#screen-player-question,#screen-player-reveal,#screen-player-leaderboard,#screen-player-final,#screen-player-ended{
  position:relative;overflow:auto;
  background-image:url("assets/background-players.png");background-size:cover;background-position:center top;background-repeat:no-repeat;
}
#screen-player-join::before,#screen-player-lobby::before,#screen-player-question::before,#screen-player-reveal::before,#screen-player-leaderboard::before,#screen-player-final::before,#screen-player-ended::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,26,.50) 0%,rgba(4,8,26,.28) 26%,rgba(4,8,26,.64) 100%);
}
#screen-player-join > *,#screen-player-lobby > *,#screen-player-question > *,#screen-player-reveal > *,#screen-player-leaderboard > *,#screen-player-final > *,#screen-player-ended > *{position:relative;z-index:1;}
.qz-player-join-stage{padding-top:24px;padding-bottom:24px;}
.qz-player-join-card{width:min(420px,92vw);padding:28px 24px 24px;border-radius:30px;background:linear-gradient(180deg,rgba(7,13,36,.72),rgba(7,11,29,.82));border:1px solid rgba(158,180,255,.16);box-shadow:0 28px 70px rgba(0,0,0,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;}
.qz-player-join-sub{margin:6px 0 16px;color:rgba(238,242,255,.74);font-size:13px;}

/* Host auth premium background */
.qz-host-auth-stage{min-height:100dvh;position:relative;display:grid;place-items:center;padding:28px;background-image:url("assets/background-home.png");background-size:cover;background-position:center;background-repeat:no-repeat;}
.qz-host-auth-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,7,24,.50),rgba(3,6,19,.82));}
.qz-host-auth-card{position:relative;z-index:1;width:min(470px,94vw);padding:30px 28px 26px;border-radius:30px;background:linear-gradient(180deg,rgba(9,15,38,.80),rgba(7,11,29,.88));border:1px solid rgba(149,166,255,.16);box-shadow:0 32px 90px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);text-align:center;color:#fff;}
.qz-host-auth-back{position:absolute;left:20px;top:18px;border:0;background:none;color:#9aa8c7;font-size:13px;cursor:pointer;}
.qz-host-auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 16px;}
.qz-host-auth-icon{width:74px;height:74px;object-fit:cover;border-radius:22px;box-shadow:0 14px 35px rgba(0,0,0,.30);}
.qz-host-auth-wordmark{width:min(310px,75vw);height:auto;object-fit:contain;}
.qz-host-auth-title{margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-size:28px;letter-spacing:-.03em;}
.qz-host-auth-subtitle{margin:0 0 18px;color:#9eabc5;font-size:14px;}
.qz-host-auth-form{width:100%;max-width:310px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.qz-auth-text-btn{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;}
@media(max-width:820px){.ai-studio-head{align-items:flex-start;flex-direction:column}.ai-studio-grid{grid-template-columns:1fr}.ai-studio-room{align-self:stretch}}


/* ===== QZMAX 2.2 — Live Question Experience ===== */
.live-game-shell{width:100%;max-width:1120px;margin:0 auto;padding:4px 0 28px;display:flex;flex-direction:column;min-height:calc(100dvh - 56px)}
.live-game-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-bottom:18px}
.live-progress-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.live-q-meta{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8b9ab3;font-weight:800;white-space:nowrap}
.live-progress{height:7px;max-width:280px;flex:1;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden;border:1px solid rgba(255,255,255,.035)}
.live-progress>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#745cff 0%,#2d8cff 55%,#23d7ff 100%);box-shadow:0 0 16px rgba(61,164,255,.35)}
.live-room-pill{justify-self:end;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;border:1px solid rgba(132,158,214,.17);background:rgba(255,255,255,.03);font-size:11px;color:#8998b0}
.live-room-pill strong{font-family:'Space Grotesk',system-ui,sans-serif;color:#f5f8ff;letter-spacing:.12em;font-size:13px}
.live-timer-shell{display:grid;place-items:center;filter:drop-shadow(0 8px 18px rgba(0,0,0,.2))}
.live-timer-shell .ring-wrap{width:88px;height:88px}
.live-timer-shell .ring-wrap svg{width:88px;height:88px}
.live-timer-shell .ring-num{font-size:27px}
.live-question-panel{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,4vw,48px);border-radius:30px;border:1px solid rgba(132,158,214,.17);background:radial-gradient(circle at 50% -15%,rgba(111,86,255,.18),transparent 45%),linear-gradient(145deg,rgba(19,29,52,.95),rgba(8,14,27,.98));box-shadow:0 28px 76px rgba(0,0,0,.32);overflow:hidden}
.live-question-panel:before{content:"";position:absolute;width:380px;height:380px;right:-230px;bottom:-260px;border-radius:50%;background:rgba(34,211,255,.07);filter:blur(4px);pointer-events:none}
.live-category{align-self:center;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(112,88,255,.11);border:1px solid rgba(135,115,255,.2);color:#b8afff;font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.live-question-text{font-size:clamp(26px,4vw,43px);line-height:1.14;letter-spacing:-.035em;text-align:center;max-width:900px;margin:18px auto 0;font-weight:800;text-wrap:balance}
.live-question-help{text-align:center;color:#7f8ea6;font-size:12px;margin:11px 0 0}
.live-answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:25px}
.live-answer.opt-card{position:relative;min-height:78px;padding:15px 17px;border-radius:18px;border:1px solid rgba(132,158,214,.16);background:rgba(255,255,255,.035);display:flex;align-items:center;gap:14px;font-size:15px;color:#edf4ff;text-align:left;box-shadow:none;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
.live-answer.opt-card:hover{transform:translateY(-2px);border-color:rgba(104,136,255,.48);background:rgba(92,104,255,.085);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.live-answer.opt-card .opt-letter{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);color:#aebbd0;box-shadow:none;font-size:15px}
.live-answer.opt-card.selected{border-color:#7a65ff;background:linear-gradient(135deg,rgba(111,85,255,.22),rgba(31,205,255,.08));box-shadow:0 0 0 3px rgba(111,85,255,.1),0 14px 34px rgba(37,29,115,.2)}
.live-answer.opt-card.selected .opt-letter{background:#765fff;color:white;box-shadow:0 0 16px rgba(118,95,255,.32)}
.live-answer.opt-card.disabled{opacity:.68;pointer-events:none}
.live-answer-text{font-weight:700;line-height:1.4;flex:1}
.live-answer-status{min-height:26px;margin-top:16px;text-align:center;color:#8291aa;font-size:12px;letter-spacing:.01em}
.live-answer-status strong{color:#eef4ff}
.live-question-footer{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.live-micro-pill{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.025);border:1px solid rgba(132,158,214,.11);font-size:10px;color:#8291a9;letter-spacing:.02em}
.live-host-answer{min-height:68px;padding:14px 16px;border-radius:17px;border:1px solid rgba(132,158,214,.15);background:rgba(255,255,255,.03);display:flex;align-items:center;gap:13px;text-align:left}
.live-host-answer .opt-letter{width:36px;height:36px;border-radius:10px}
.live-host-answer-text{font-size:15px;font-weight:700;line-height:1.35}
.live-host-status{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#27e1b2;box-shadow:0 0 13px rgba(39,225,178,.55);animation:liveDot 1.4s ease-in-out infinite}
@keyframes liveDot{50%{opacity:.35;transform:scale(.75)}}
.live-end-btn{margin:14px auto 0!important;align-self:center;padding:9px 14px!important;font-size:11px!important;background:transparent!important;color:#76859d!important;border-color:rgba(255,255,255,.08)!important;box-shadow:none!important}
@media(max-width:720px){
  .live-game-shell{min-height:calc(100dvh - 40px)}
  .live-game-top{grid-template-columns:1fr auto;gap:10px}
  .live-progress-wrap{grid-column:1/-1;grid-row:1}
  .live-room-pill{grid-column:1;grid-row:2;justify-self:start}
  .live-timer-shell{grid-column:2;grid-row:2}
  .live-timer-shell .ring-wrap,.live-timer-shell .ring-wrap svg{width:72px;height:72px}
  .live-timer-shell .ring-num{font-size:23px}
  .live-question-panel{padding:21px 14px;border-radius:24px}
  .live-answer-grid{grid-template-columns:1fr;gap:9px;margin-top:20px}
  .live-answer.opt-card{min-height:67px;padding:12px 13px}
  .live-question-text{font-size:clamp(23px,7vw,32px)}
}
@media(prefers-reduced-motion:reduce){.live-dot{animation:none}.live-answer.opt-card{transition:none}}


/* ===== QZMAX 2.5 — Host Reliability & Recovery ===== */
.connection-banner{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px);
  z-index:9999; display:flex; align-items:center; gap:10px; max-width:calc(100vw - 28px);
  padding:10px 14px; border-radius:999px; border:1px solid rgba(255,190,80,.28);
  background:rgba(14,18,31,.96); color:#f6f8ff; box-shadow:0 18px 50px rgba(0,0,0,.34);
  font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:.22s ease;
}
.connection-banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
.connection-banner.ok{border-color:rgba(0,250,154,.22)}
.connection-dot{width:8px;height:8px;border-radius:999px;background:#ffbd59;box-shadow:0 0 12px rgba(255,189,89,.75)}
.connection-banner.ok .connection-dot{background:var(--correct);box-shadow:0 0 12px rgba(0,250,154,.6)}
.host-recovery-card{
  width:100%;max-width:500px;padding:28px;border-radius:24px;border:1px solid rgba(130,160,220,.18);
  background:linear-gradient(145deg,rgba(20,29,53,.96),rgba(8,14,28,.98));
  box-shadow:0 24px 70px rgba(0,0,0,.34);text-align:center;
}
.host-recovery-icon{
  width:60px;height:60px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(118,87,255,.24),rgba(28,207,255,.18));
  border:1px solid rgba(111,154,255,.26);font-size:26px;
}
.host-recovery-room{margin:16px auto 0;display:inline-flex;align-items:center;gap:8px}


/* ===== QZMAX 2.6 — Secondary Host Takeover ===== */
.host-launch-card{width:100%;max-width:560px;padding:26px;border:1px solid rgba(130,160,220,.18);border-radius:24px;background:linear-gradient(145deg,rgba(18,28,51,.94),rgba(10,16,31,.97));box-shadow:0 22px 65px rgba(0,0,0,.3);text-align:left}
.host-launch-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.host-launch-option{padding:18px;border:1px solid rgba(130,160,220,.16);border-radius:18px;background:rgba(255,255,255,.03)}
.host-launch-option h3{font-size:17px;margin:0 0 6px}.host-launch-option p{font-size:12px;margin-bottom:14px}
.host-takeover-row{display:flex;gap:8px;margin-top:10px}.host-takeover-row input{text-transform:uppercase;text-align:center;font-weight:800;letter-spacing:.12em}
.host-control-card{width:100%;max-width:520px;padding:28px;border:1px solid rgba(255,195,90,.2);border-radius:24px;background:linear-gradient(145deg,rgba(38,29,18,.92),rgba(12,17,29,.98));box-shadow:0 25px 70px rgba(0,0,0,.34);text-align:center}
.host-control-icon{width:58px;height:58px;margin:0 auto 14px;display:grid;place-items:center;border-radius:18px;background:rgba(255,193,84,.1);border:1px solid rgba(255,193,84,.18);font-size:25px}
.host-control-note{font-size:12px;color:#8f9db5;max-width:390px;margin:8px auto 0}
@media(max-width:660px){.host-launch-actions{grid-template-columns:1fr}.host-takeover-row{flex-direction:column}}


/* ===== QZMAX 2.7 — Reveal + Momentum Leaderboard ===== */
.reveal-shell,.leader-shell{width:100%;max-width:980px;margin:0 auto;padding:8px 0 30px}
.reveal-hero{text-align:center;margin:6px auto 22px}
.reveal-kicker{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#8998b0}
.reveal-answer-big{font-size:clamp(27px,5vw,48px);font-weight:900;letter-spacing:-.04em;line-height:1.08;margin:8px auto 5px;max-width:780px}
.reveal-answer-big.good{color:var(--correct);text-shadow:0 0 25px rgba(0,250,154,.22)}
.reveal-answer-big.bad{color:#ff708f;text-shadow:0 0 25px rgba(255,46,99,.18)}
.reveal-answer-text{font-size:clamp(20px,3vw,30px);font-weight:800;margin:13px auto 0;max-width:780px}
.reveal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:18px auto 0}
.reveal-stat{padding:13px 12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(130,160,220,.14)}
.reveal-stat span{display:block;color:#8190a8;font-size:10px;text-transform:uppercase;letter-spacing:.11em}
.reveal-stat strong{display:block;margin-top:4px;font-size:20px}
.reveal-bars{width:100%;max-width:650px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.reveal-option{display:grid;grid-template-columns:38px minmax(100px,1fr) minmax(130px,1.3fr) 38px;align-items:center;gap:10px;padding:10px 12px;border-radius:15px;border:1px solid rgba(130,160,220,.12);background:rgba(255,255,255,.025)}
.reveal-option.correct{border-color:rgba(0,250,154,.3);background:rgba(0,250,154,.055)}
.reveal-option .answer-label{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reveal-option .count{text-align:right;font-weight:900}
.reveal-explainer{width:100%;max-width:650px;margin:15px auto 0;text-align:left;padding:17px 18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(130,160,220,.13)}
.reveal-explainer .eyebrow{margin-bottom:6px}
.player-reveal-card{width:100%;max-width:540px;padding:30px 24px;border-radius:28px;border:1px solid rgba(130,160,220,.17);background:radial-gradient(circle at 50% 0,rgba(107,82,255,.13),transparent 42%),linear-gradient(145deg,rgba(18,28,51,.96),rgba(8,14,28,.98));box-shadow:0 28px 75px rgba(0,0,0,.34);text-align:center;animation:revealPop .38s cubic-bezier(.2,.85,.3,1)}
.player-reveal-card.correct{border-color:rgba(0,250,154,.28);background:radial-gradient(circle at 50% 0,rgba(0,250,154,.12),transparent 45%),linear-gradient(145deg,rgba(16,35,38,.96),rgba(8,14,28,.98))}
.player-reveal-card.wrong{border-color:rgba(255,46,99,.24);background:radial-gradient(circle at 50% 0,rgba(255,46,99,.10),transparent 45%),linear-gradient(145deg,rgba(38,20,31,.96),rgba(8,14,28,.98))}
.player-result-icon{width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;border-radius:22px;background:rgba(255,255,255,.055);font-size:34px}
.player-reveal-card.correct .player-result-icon{background:rgba(0,250,154,.12);box-shadow:0 0 35px rgba(0,250,154,.12)}
.player-reveal-card.wrong .player-result-icon{background:rgba(255,46,99,.1)}
.player-points{font-size:clamp(34px,8vw,58px);font-weight:950;letter-spacing:-.055em;margin:3px 0}
.player-points.good{color:var(--correct)}
.player-points.zero{color:#ff708f}
.player-score-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.player-score-cell{padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(130,160,220,.1)}
.player-score-cell span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:#7f8da5}
.player-score-cell strong{display:block;margin-top:4px;font-size:19px}
@keyframes revealPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.leader-head{text-align:center;margin-bottom:18px}
.leader-title{font-size:clamp(29px,5vw,44px);font-weight:900;letter-spacing:-.045em;margin:6px 0}
.leader-round-star{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,211,110,.06);border:1px solid rgba(255,211,110,.17);color:#ffd36e;font-size:12px;font-weight:800}
.momentum-list{width:100%;max-width:650px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.momentum-row{display:grid;grid-template-columns:42px 1fr auto auto;align-items:center;gap:11px;padding:14px 15px;border-radius:17px;border:1px solid rgba(130,160,220,.13);background:rgba(255,255,255,.03);animation:leaderSlide .35s both}
.momentum-row:nth-child(2){animation-delay:.04s}.momentum-row:nth-child(3){animation-delay:.08s}.momentum-row:nth-child(4){animation-delay:.12s}.momentum-row:nth-child(5){animation-delay:.16s}
.momentum-row.first{border-color:rgba(255,211,110,.22);background:linear-gradient(90deg,rgba(255,211,110,.07),rgba(255,255,255,.025))}
.momentum-row.me{border-color:rgba(99,119,255,.42);background:rgba(99,119,255,.08)}
.momentum-rank{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.045);font-weight:900;color:#b7c2d5}
.momentum-row.first .momentum-rank{background:rgba(255,211,110,.12);color:#ffd36e}
.momentum-name{min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.momentum-score{font-family:'Space Grotesk',sans-serif;font-weight:900;color:#dfe9fb;white-space:nowrap}
.rank-move{min-width:50px;text-align:center;padding:5px 7px;border-radius:999px;font-size:10px;font-weight:900}
.rank-up{color:#00ef9a;background:rgba(0,239,154,.08)}
.rank-down{color:#ff7893;background:rgba(255,70,99,.08)}
.rank-same{color:#8290a8;background:rgba(255,255,255,.035)}
@keyframes leaderSlide{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(max-width:680px){
 .reveal-stats{grid-template-columns:1fr 1fr}.reveal-stat:last-child{grid-column:1/-1}
 .reveal-option{grid-template-columns:34px 1fr 34px}.reveal-option .bar-track{grid-column:2/4;width:100%}
 .momentum-row{grid-template-columns:38px 1fr auto}.rank-move{grid-column:2;text-align:left;justify-self:start}.momentum-score{grid-column:3;grid-row:1}
}


/* ===== QZMAX 2.8 — Host Dashboard ===== */
.host-dashboard{width:100%;max-width:1160px;margin:0 auto;padding:4px 0 34px}
.hd-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.hd-brand{display:flex;align-items:center;gap:11px;font-family:'Space Grotesk',sans-serif;font-weight:900;letter-spacing:-.025em}
.hd-brand-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(118,87,255,.22),rgba(28,207,255,.15));border:1px solid rgba(116,119,255,.3);color:#79e8ff}
.hd-nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hd-welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.hd-welcome h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.045em;margin:4px 0 5px}
.hd-welcome p{max-width:620px}
.hd-primary-actions{display:flex;gap:9px;flex-wrap:wrap}
.hd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.hd-stat{padding:17px 18px;border:1px solid rgba(130,160,220,.14);border-radius:18px;background:rgba(255,255,255,.03)}
.hd-stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7f8da5;font-weight:800}
.hd-stat strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:29px;letter-spacing:-.04em;margin-top:4px}
.hd-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px}
.hd-card{border:1px solid rgba(130,160,220,.15);border-radius:22px;background:linear-gradient(145deg,rgba(17,26,48,.92),rgba(9,15,29,.97));box-shadow:0 18px 55px rgba(0,0,0,.24);overflow:hidden}
.hd-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px 12px}
.hd-card-head h3{font-size:17px;margin:0}.hd-card-head span{font-size:11px;color:#7f8da5}
.hd-card-body{padding:0 19px 19px}
.hd-active{padding:18px;border-radius:18px;border:1px solid rgba(100,123,255,.25);background:radial-gradient(circle at 100% 0,rgba(91,94,255,.13),transparent 42%),rgba(255,255,255,.025)}
.hd-active-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd-room-code{font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:900;letter-spacing:.12em;color:#7be7ff}
.hd-status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;background:rgba(0,250,154,.07);color:#65f5b6;border:1px solid rgba(0,250,154,.16)}
.hd-dot{width:6px;height:6px;border-radius:99px;background:currentColor;box-shadow:0 0 10px currentColor}

/* ===== QZMAX 3.2.5 — Winner Celebration ===== */
#screen-host-final{position:relative;overflow-x:hidden}
.hf-celebration-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:999;
}
.hf-confetti{
  position:absolute;
  top:0;
  left:0;
  width:9px;
  height:16px;
  border-radius:2px;
  opacity:0;
  will-change:transform,opacity;
  animation:hfConfettiBurst var(--dur,2.2s) cubic-bezier(.16,.78,.22,1) var(--delay,0s) forwards;
  transform:translate3d(0,0,0) rotate(0deg) scale(var(--start-scale,.85));
}
.hf-confetti.circle{border-radius:999px;width:10px;height:10px}
.hf-confetti.slim{width:5px;height:18px}
@keyframes hfConfettiBurst{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(0deg) scale(var(--start-scale,.85))}
  10%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--drift-x,40px),var(--drift-y,140px),0) rotate(var(--spin,620deg)) scale(var(--end-scale,1.08))}
}
.hf-winner-card.celebrate{animation:hfWinnerGlow 1.05s ease-out both}
@keyframes hfWinnerGlow{
  0%{transform:scale(.975);box-shadow:0 0 0 rgba(255,211,110,0)}
  48%{transform:scale(1.012);box-shadow:0 0 48px rgba(255,211,110,.15)}
  100%{transform:scale(1);box-shadow:0 0 0 rgba(255,211,110,0)}
}
.hf-crown.celebrate{animation:hfCrownPop .8s cubic-bezier(.2,.85,.25,1.15) both}
@keyframes hfCrownPop{
  0%{opacity:0;transform:translateY(12px) scale(.45) rotate(-14deg)}
  62%{opacity:1;transform:translateY(-4px) scale(1.18) rotate(7deg)}
  100%{opacity:1;transform:none}
}
.hf-score-big.counting{text-shadow:0 0 24px rgba(255,211,110,.18)}
.hf-podium-card{opacity:0;transform:translateY(16px)}
.hf-podium-card.hf-enter{animation:hfCardEnter .5s cubic-bezier(.2,.8,.25,1) forwards}
.hf-row{opacity:0;transform:translateY(10px)}
.hf-row.hf-enter{animation:hfRowEnter .4s ease forwards}
@keyframes hfCardEnter{to{opacity:1;transform:none}}
@keyframes hfRowEnter{to{opacity:1;transform:none}}
.hf-champion-line{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(255,211,110,.07);
  border:1px solid rgba(255,211,110,.15);
  color:#ffd36e;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.09em;
}
@media (prefers-reduced-motion:reduce){
  .hf-confetti{display:none!important}
  .hf-winner-card.celebrate,
  .hf-crown.celebrate,
  .hf-podium-card.hf-enter,
  .hf-row.hf-enter{
    animation:none!important;
    opacity:1!important;
    transform:none!important;
  }
}

#screen-host-setup{overflow-y:auto;padding-bottom:28px;}

  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  margin:6px 0 18px;padding:18px 20px;border:1px solid rgba(118,144,215,.16);
  border-radius:22px;background:linear-gradient(180deg,rgba(15,23,48,.78),rgba(10,16,34,.72));

.host-workspace-header h2{margin:2px 0 4px;font-family:'Space Grotesk',sans-serif;font-size:27px;letter-spacing:-.035em;}
.host-workspace-header p{margin:0;color:var(--muted);font-size:12px;line-height:1.45;}

.exam-host-note{

.exam-player-top{

  margin:0 auto 16px;
}
.exam-player-progress{min-width:0}
.exam-player-progress>span{display:block;text-align:center;font-size:11px;color:var(--muted);margin-bottom:5px}
.exam-player-layout{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;

.exam-side-panel>p{font-size:10px;line-height:1.45;margin-top:10px}
.exam-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}

}

}
.exam-nav{display:flex;justify-content:space-between;gap:10px;margin-top:15px}
.exam-nav .btn{min-width:130px}
.exam-submitted-card{max-width:520px;padding:32px;text-align:center}
.exam-submitted-icon{
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 15px;

}
.exam-lobby-note{
  max-width:420px;margin:13px auto 0;padding:10px 12px;border-radius:12px;

}
@media(max-width:900px){
  .exam-config-grid{grid-template-columns:1fr}
  .exam-monitor-grid{grid-template-columns:1fr 1fr}
  .exam-player-top{grid-template-columns:1fr 1fr}
  .exam-player-top .exam-clock-card{grid-column:1/-1}
  .exam-player-layout{grid-template-columns:1fr}
  .exam-side-panel{position:static}
  .exam-palette{grid-template-columns:repeat(8,1fr)}
}
@media(max-width:600px){
  .exam-host-shell,.exam-player-shell{padding:10px}
  .exam-host-hero{display:block;margin-top:16px}
  .exam-host-hero .exam-clock-card{margin-top:12px;width:100%}
  .exam-host-hero h1{font-size:29px}
  .exam-monitor-grid{grid-template-columns:1fr 1fr}
  .exam-player-top{display:block}
  .exam-player-progress{margin:10px 0}
  .exam-player-top .exam-clock-card{width:100%}
  .exam-question-card{padding:14px}
  .exam-palette{grid-template-columns:repeat(5,1fr)}
  .exam-nav{display:grid;grid-template-columns:1fr 1fr}
  .exam-nav .btn{min-width:0}
}

/* =========================================================
   QZMAX 3.13.1 — Bright Mode Refinement
   Cool daylight, not white wash
   ========================================================= */
html[data-theme="light"]{
  --void:#cedcea;
  --surface:rgba(225,237,249,.86);
  --surface-2:rgba(216,230,246,.93);
  --line:rgba(35,73,119,.23);
  --ink:#14253b;
  --muted:#526a84;
  --signal:#0875df;
  --signal-ink:#ffffff;
  --correct:#08795c;
  --wrong:#cc315a;
}
html[data-theme="light"],html[data-theme="light"] body{background:#cedcea!important;}
html[data-theme="light"] #quiz-root{
  background:radial-gradient(circle at 20% 0%,rgba(225,239,253,.88),transparent 43%),linear-gradient(180deg,#d9e6f3 0%,#c7d7e7 100%)!important;

}
html[data-theme="light"] .card,
html[data-theme="light"] .qlist-item,
html[data-theme="light"] .opt-card,

    const saved = localStorage.getItem(QZ_THEME_KEY);
    return saved === 'light' ? 'light' : 'dark';
  }catch(e){ return 'dark'; }
}
function qzApplyTheme(theme, persist=true){
  const selected = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = selected;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', selected === 'light' ? '#F3F6FB' : '#070914');
  const icon = document.getElementById('qz-theme-icon');
  const label = document.getElementById('qz-theme-label');
  const btn = document.getElementById('qz-global-theme-toggle');
  if(icon) icon.textContent = selected === 'light' ? '☾' : '☀';
  if(label) label.textContent = selected === 'light' ? 'Dark Mode' : 'Bright Mode';
  if(btn) {
    btn.title = selected === 'light' ? 'Switch to Dark Mode' : 'Switch to Bright Mode';
    btn.setAttribute('aria-label', btn.title);
  }
  if(persist){
    try{ localStorage.setItem(QZ_THEME_KEY,selected); }catch(e){}
  }
  document.querySelectorAll('[data-theme-choice]').forEach(el=>{
    el.classList.toggle('active',el.dataset.themeChoice===selected);
  });
}
function qzToggleTheme(){
  qzApplyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
}

  function normalizedQuestionType(q){
    const t = q && q.type ? String(q.type) : 'multiple_choice';
    return ['multiple_choice','true_false','multiple_correct','typed'].includes(t) ? t : 'multiple_choice';
  }

  function questionTypeLabel(q){
    const t = normalizedQuestionType(q);
    if(t==='true_false') return 'True / False';
    if(t==='multiple_correct') return 'Select Multiple';
    if(t==='typed') return 'Typed Answer';
    return 'Multiple Choice';
  }

  function normalizeTypedAnswer(value){
    return String(value ?? '')
      .normalize('NFKC')
      .toLowerCase()
      .trim()
      .replace(/\s+/g,' ')
      .replace(/[.,!?;:"“”'‘’]/g,'');
  }

  function getCorrectIndexes(q){
    const t = normalizedQuestionType(q);
    if(t==='multiple_correct'){
      const arr = Array.isArray(q.correctIndexes) ? q.correctIndexes : [];
      return [...new Set(arr.map(Number).filter(i=>Number.isInteger(i) && i>=0 && i<(q.options||[]).length))].sort((a,b)=>a-b);
    }
    const i = Number(q && q.correct);
    return Number.isInteger(i) && i>=0 ? [i] : [];
  }

  function answerSubmitted(a){
    if(!a) return false;
    if(typeof a.answerIndex === 'number') return true;
    if(Array.isArray(a.answerIndexes)) return true;
    if(typeof a.answerText === 'string') return true;
    return false;
  }

  function answerIsCorrect(q, a){
    if(!answerSubmitted(a)) return false;
    const t = normalizedQuestionType(q);
    if(t==='typed'){
      const accepted = Array.isArray(q.acceptedAnswers) ? q.acceptedAnswers : [];
      const submitted = normalizeTypedAnswer(a.answerText);
      return !!submitted && accepted.some(v=>normalizeTypedAnswer(v)===submitted);
    }
    if(t==='multiple_correct'){
      const expected = getCorrectIndexes(q);
      const actual = Array.isArray(a.answerIndexes)
        ? [...new Set(a.answerIndexes.map(Number).filter(Number.isInteger))].sort((x,y)=>x-y)
        : [];
      return expected.length===actual.length && expected.every((v,i)=>v===actual[i]);
    }
    return typeof a.answerIndex==='number' && a.answerIndex===Number(q.correct);
  }

  function getCorrectAnswerDisplay(q){
    const t = normalizedQuestionType(q);
    if(t==='typed'){
      const accepted = Array.isArray(q.acceptedAnswers) ? q.acceptedAnswers.filter(Boolean) : [];
      return accepted.join(' / ') || 'Accepted typed answer';
    }
    const options = q.options || [];
    const indexes = getCorrectIndexes(q);
    return indexes.map(i=>options[i]).filter(v=>v!==undefined).join(' + ');
  }

  function defaultTeams(count){

  function normalizeTeams(teams, count){

    return Array.from({length:desired},(_,i)=>{

  function getTeamStandings(players, st){
    const teams = normalizeTeams(st && st.teams, st && st.teamCount);
    const rows = teams.map((t,i)=>({
      id:t.id, name:t.name, index:i, score:0, lastPoints:0, members:[], correctThisRound:0
    }));
    const map = {};
    rows.forEach(r=>{ map[r.id]=r; });
    (players||[]).forEach(p=>{
      if(!map[p.teamId]) return;
      map[p.teamId].score += p.score||0;
      map[p.teamId].lastPoints += p.lastPoints||0;
      if(p.lastCorrect) map[p.teamId].correctThisRound++;
      map[p.teamId].members.push(p);
    });
    rows.sort((a,b)=>b.score-a.score || b.lastPoints-a.lastPoints || a.index-b.index);
    return rows;
  }

  function updateRing(prefix, remaining, total){
    const frac = Math.max(0, Math.min(1, remaining/total));
    const circ = 339.29;

    if(fg){ fg.style.strokeDashoffset = circ*(1-frac); fg.style.stroke = frac < 0.3 ? 'var(--wrong)' : 'var(--signal)'; }

    if(!code) return false;
    try{
      const st = await fbGetStrict(statePath(code));
      if(!st || !currentUserUid || st.hostUid !== currentUserUid) return false;
      await update(ref(db, statePath(code)), {
        hostControllerId:getHostControllerId(),
        hostControllerUpdatedAt:getSyncedTime()
      });
      S.code = code;
      S.hostControlLost = false;
      saveHostSession(code);
      startHostControlWatch(code);
      return true;
    }catch(e){
      console.error('claim host control failed', e);
      showConnectionBanner('Could not claim host control — check your connection.', false);
      return false;
    }

  async function recoverHostRoomByCode(code){
    code = String(code || '').trim().toUpperCase();
    const err = $('host-launch-err');
    if(err) err.textContent = '';
    if(code.length !== 5){
      if(err) err.textContent = 'Enter the 5-character session code.';
      return;
    }
    try{
      const st = await fbGetStrict(statePath(code));
      if(!st){
        if(err) err.textContent = 'No active session found with that code.';
        return;
      }
      if(!currentUserUid || st.hostUid !== currentUserUid){
        if(err) err.textContent = 'This session belongs to a different host account.';
        return;
      }
      if(await claimHostControl(code)) await tryResumeHostSession(true);
      else if(err) err.textContent = 'Could not take control of this session.';
    }catch(e){
      if(err) err.textContent = 'Could not reach the session. Check your connection and try again.';
    }
  }

  function msToSeconds(ms){

  async function buildGameAnalyticsData(st, players){
    const questions = Array.isArray(st.questions) ? st.questions : [];
    const answerSets = await Promise.all(
      questions.map((q,qi)=>fbGetStrict(answersPath(st.code, qi)).catch(()=>null))
    );

    const playerById = {};
    (players||[]).forEach(p=>{ playerById[p.id] = p; });

    let includedAnswers = 0;
    let includedCorrect = 0;
    let includedTimeTotal = 0;
    let includedTimedAnswers = 0;
    let fastestCorrect = null;

    const perPlayer = {};
    (players||[]).forEach((p,idx)=>{
      perPlayer[p.id] = {
        id:p.id,
        name:p.name || 'Player',
        rank:idx+1,
        score:p.score || 0,
        answered:0,
        correct:0,
        timeTotal:0,
        timedAnswers:0
      };
    });

    const questionAnalytics = questions.map((q,qi)=>{
      const answersObj = answerSets[qi] || {};
      const answers = Object.values(answersObj).filter(answerSubmitted);
      const optionCounts = new Array((q.options||[]).length).fill(0);
      let correctCount = 0;
      let timeTotal = 0;
      let timedAnswers = 0;

      answers.forEach(a=>{
        if(typeof a.answerIndex==='number' && a.answerIndex>=0 && a.answerIndex<optionCounts.length) optionCounts[a.answerIndex]++;
        if(Array.isArray(a.answerIndexes)){
          [...new Set(a.answerIndexes.map(Number).filter(Number.isInteger))].forEach(i=>{ if(i>=0 && i<optionCounts.length) optionCounts[i]++; });
        }
        const correct = typeof a.wasCorrect === 'boolean' ? a.wasCorrect : answerIsCorrect(q,a);
        if(correct) correctCount++;
        if(typeof a.timeMs === 'number' && isFinite(a.timeMs)){
          timeTotal += a.timeMs;
          timedAnswers++;
          if(!q.excluded && correct && (!fastestCorrect || a.timeMs < fastestCorrect.timeMs)){
            const p = playerById[a.pid];
            fastestCorrect = {
              playerId:a.pid || '',
              playerName:p ? p.name : 'Player',
              timeMs:a.timeMs,
              questionIndex:qi
            };
          }
        }

        if(!q.excluded && perPlayer[a.pid]){
          perPlayer[a.pid].answered++;
          if(correct) perPlayer[a.pid].correct++;
          if(typeof a.timeMs === 'number' && isFinite(a.timeMs)){
            perPlayer[a.pid].timeTotal += a.timeMs;
            perPlayer[a.pid].timedAnswers++;
          }
        }
      });

      if(!q.excluded){
        includedAnswers += answers.length;
        includedCorrect += correctCount;
        includedTimeTotal += timeTotal;
        includedTimedAnswers += timedAnswers;
      }

      const accuracy = answers.length ? Math.round(correctCount/answers.length*100) : 0;
      return {
        index:qi,
        question:String(q.q || ''),
        type:normalizedQuestionType(q),
        options:(q.options||[]).map(o=>String(o)),
        correctIndex:q.correct,
        excluded:!!q.excluded,
        answered:answers.length,
        correctCount,
        accuracy,
        averageResponseSec:timedAnswers ? msToSeconds(timeTotal/timedAnswers) : null,
        optionCounts
      };
    });

    const includedQuestions = questionAnalytics.filter(q=>!q.excluded && q.answered>0);
    const byAccuracyAsc = includedQuestions.slice().sort((a,b)=>a.accuracy-b.accuracy || a.index-b.index);
    const byAccuracyDesc = includedQuestions.slice().sort((a,b)=>b.accuracy-a.accuracy || a.index-b.index);

    const playerAnalytics = Object.values(perPlayer).map(p=>({
      id:p.id,
      name:p.name,
      rank:p.rank,
      score:p.score,
      answered:p.answered,
      correct:p.correct,
      accuracy:p.answered ? Math.round(p.correct/p.answered*100) : 0,
      averageResponseSec:p.timedAnswers ? msToSeconds(p.timeTotal/p.timedAnswers) : null
    })).sort((a,b)=>a.rank-b.rank);

    const overallAccuracy = includedAnswers ? Math.round(includedCorrect/includedAnswers*100) : 0;
    const avgResponseSec = includedTimedAnswers ? msToSeconds(includedTimeTotal/includedTimedAnswers) : null;

    return {
      overallAccuracy,
      averageResponseSec:avgResponseSec,
      totalResponses:includedAnswers,
      totalCorrect:includedCorrect,
      excludedQuestionCount:questionAnalytics.filter(q=>q.excluded).length,
      hardestQuestion:byAccuracyAsc.length ? {
        index:byAccuracyAsc[0].index,
        question:byAccuracyAsc[0].question,
        accuracy:byAccuracyAsc[0].accuracy
      } : null,
      easiestQuestion:byAccuracyDesc.length ? {
        index:byAccuracyDesc[0].index,
        question:byAccuracyDesc[0].question,
        accuracy:byAccuracyDesc[0].accuracy
      } : null,
      fastestCorrect:fastestCorrect ? {
        playerName:fastestCorrect.playerName,
        timeSec:msToSeconds(fastestCorrect.timeMs),
        questionIndex:fastestCorrect.questionIndex
      } : null,
      questions:questionAnalytics,
      players:playerAnalytics
    };
  }

  async function recordGameHistory(st, players){
    if(!currentUserUid || !st || !st.code || !st.createdAt) return null;
    const id = String(st.code)+'_'+String(st.createdAt);
    const winner = players && players.length ? players[0] : null;
    const teamMode = st.gameMode==='teams';
    const teamStandings = teamMode ? getTeamStandings(players||[],st) : [];
    const winningTeam = teamStandings[0] || null;

    let analytics = null;
    try{
      analytics = await buildGameAnalyticsData(st, players || []);
    }catch(e){
      console.error('analytics build failed', e);
    }

    const item = {
      id,
      roomCode:st.code,
      createdAt:st.createdAt,
      completedAt:Date.now(),
      playerCount:players ? players.length : 0,
      questionCount:Array.isArray(st.questions) ? st.questions.length : 0,
      gameMode:teamMode ? 'teams' : 'individual',
      winnerName:teamMode ? (winningTeam ? winningTeam.name : '') : (winner ? winner.name : ''),
      winningScore:teamMode ? (winningTeam ? winningTeam.score : 0) : (winner ? (winner.score||0) : 0),
      teamStandings:teamMode ? teamStandings.map(t=>({id:t.id,name:t.name,score:t.score,playerCount:t.members.length})) : null,
      analytics:analytics
    };
    await fbSet(hostHistoryPath(id), item);
    return item;

  function exportGameAnalyticsCsv(game){
    if(!game) return;
    const rows = [];
    const esc = v => '"' + String(v===null||v===undefined?'':v).replace(/"/g,'""') + '"';
    rows.push(['QZMAX Game Analytics']);
    rows.push(['Session', game.roomCode || '']);
    rows.push(['Completed', game.completedAt ? new Date(game.completedAt).toISOString() : '']);
    rows.push([game.gameMode==='teams' ? 'Winning Team' : 'Winner', game.winnerName || '']);
    rows.push(['Winning Score', game.winningScore || 0]);
    if(game.analytics){
      rows.push(['Overall Accuracy', (game.analytics.overallAccuracy||0)+'%']);
      rows.push(['Average Response (sec)', game.analytics.averageResponseSec ?? '']);
      rows.push([]);
      rows.push(['Question','Answered','Correct','Accuracy','Average Response (sec)','Excluded']);
      (game.analytics.questions||[]).forEach(q=>{
        rows.push([
          'Q'+(q.index+1)+'. '+q.question,
          q.answered,
          q.correctCount,
          q.accuracy+'%',
          q.averageResponseSec ?? '',
          q.excluded ? 'Yes' : 'No'
        ]);
      });
      rows.push([]);
      rows.push(['Rank','Player','Score','Answered','Correct','Accuracy','Average Response (sec)']);
      (game.analytics.players||[]).forEach(p=>{
        rows.push([p.rank,p.name,p.score,p.answered,p.correct,p.accuracy+'%',p.averageResponseSec ?? '']);
      });
    }
    const csv = rows.map(r=>r.map(esc).join(',')).join('\r\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'QZMAX_'+(game.roomCode||'game')+'_analytics.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),500);
  }

  function getSavedHostSession(){
    const raw = lsGet(HOST_SESSION_KEY);
    if(!raw) return null;
    try{
      const parsed = JSON.parse(raw);
      if(parsed && parsed.code) return { code:String(parsed.code).toUpperCase(), hostUid:parsed.hostUid || null };
    }catch(e){}
    // Backward compatibility with older versions that stored just the room code.
    return { code:String(raw).toUpperCase(), hostUid:null };
  }

  function saveHostSession(code){
    if(!code) return;
    lsSet(HOST_SESSION_KEY, JSON.stringify({ code:String(code).toUpperCase(), hostUid:currentUserUid || null }));
  }

  function clearHostSession(){
    lsRemove(HOST_SESSION_KEY);
  }

  function ensureConnectionBanner(){
    let el = document.getElementById('connection-banner');
    if(el) return el;

    el.innerHTML = '<span class="connection-dot"></span><span id="connection-banner-text">Connection interrupted — reconnecting…</span>';
    document.body.appendChild(el);
    return el;
  }

  function showConnectionBanner(message, ok){
    const el = ensureConnectionBanner();
    const text = document.getElementById('connection-banner-text');
    if(text) text.textContent = message;
    el.classList.toggle('ok', !!ok);
    el.classList.add('show');
    clearTimeout(connectionBannerTimer);
    if(ok){
      connectionBannerTimer = setTimeout(()=>el.classList.remove('show'), 1800);
    }
  }

  function hideConnectionBanner(){
    const el = document.getElementById('connection-banner');
    if(el) el.classList.remove('show');

  function scheduleHostRecovery(code){
    clearTimeout(S.hostRecoveryHandle);
    S.hostRecoveryHandle = setTimeout(async ()=>{

      await tryResumeHostSession(true);

  function savePlayerSession(){
    if(!S.code || !S.pid) return;
    lsSet(PLAYER_SESSION_KEY, JSON.stringify({ code:S.code, pid:S.pid, name:S.name || '', teamId:S.teamId || null }));
  }

  function clearPlayerSession(){
    lsRemove(PLAYER_SESSION_KEY);
  }

  async function tryResumePlayerSession(preferredCode){
    const raw = lsGet(PLAYER_SESSION_KEY);
    if(!raw) return false;
    let saved;
    try{ saved = JSON.parse(raw); }catch(e){ clearPlayerSession(); return false; }
    if(!saved || !saved.code || !saved.pid){ clearPlayerSession(); return false; }
    const code = String(saved.code).toUpperCase();
    if(preferredCode && code !== String(preferredCode).toUpperCase()) return false;

    const [st, player] = await Promise.all([
      fbGet(statePath(code)),
      fbGet(playerPath(code, saved.pid))
    ]);
    if(!st || !player){ clearPlayerSession(); return false; }

    S.code = code;
    S.pid = saved.pid;
    S.name = player.name || saved.name || 'Player';
    S.teamId = player.teamId || saved.teamId || null;
    S.lastPhaseKey = null;
    S.hadRoom = true;
    savePlayerSession();
    startPlayerPoll();
    return true;
  }

  async function leavePlayerSession(){
    clearInterval(S.playerPollHandle);
    clearInterval(S.playerTimerHandle);
    const code = S.code;
    const pid = S.pid;
    clearPlayerSession();
    if(code && pid) await fbDelete(playerPath(code,pid));
    S.code = null; S.pid = null; S.name = ''; S.teamId = null; S.lastPhaseKey = null; S.hadRoom = false;
    buildRoleScreen();
    showScreen('screen-role');
  }


  async function tryResumeHostSession(isRetry){
    const saved = getSavedHostSession();
    if(!saved || !saved.code) return false;
    const code = saved.code;

    let st;
    try{
      st = await fbGetStrict(statePath(code));
      firebaseConnected = true;
    }catch(e){
      console.error('host recovery read failed', e);
      firebaseConnected = false;
      buildHostRecoveryScreen(code, 'Connection interrupted. Your session and players remain in place while QZMAX reconnects.');
      showConnectionBanner('Host offline — session preserved. Reconnecting…', false);
      scheduleHostRecovery(code);
      return true;
    }

    if(!st){
      clearHostSession();
      hideConnectionBanner();
      return false;
    }

    // Only the authenticated owner of the room can recover the host session.
    if(st.hostUid && currentUserUid && st.hostUid !== currentUserUid){
      if(auth.currentUser && auth.currentUser.isAnonymous){
        buildHostAuthScreen();
        const err = $('host-auth-err');
        if(err){
          err.style.color = 'var(--muted)';
          err.textContent = 'Log in with the host account that owns session '+code+' to recover it.';
        }
        return true;
      }
      clearHostSession();
      return false;
    }

    const controllerId = getHostControllerId();
    if(st.hostControllerId && st.hostControllerId !== controllerId){
      S.code = code;
      saveHostSession(code);
      startHostControlWatch(code);
      buildHostControlLostScreen(code);
      return true;
    }
    if(!st.hostControllerId){
      try{
        await update(ref(db, statePath(code)), {
          hostControllerId:controllerId,
          hostControllerUpdatedAt:getSyncedTime()
        });
        st.hostControllerId = controllerId;
      }catch(e){
        buildHostRecoveryScreen(code, 'QZMAX found your session but could not confirm host control yet. Reconnecting…');
        scheduleHostRecovery(code);
        return true;
      }
    }

    clearTimeout(S.hostRecoveryHandle);
    S.hostRecoveryInProgress = false;
    S.code = code;
    saveHostSession(code);
    startHostControlWatch(code);
    S.hostControlLost = false;
    S.questionsDraft = st.questions || [];
    S.sessionMode = st.sessionMode === 'exam' ? 'exam' : 'live';
    S.examDurationMinutes = Math.max(1, Math.min(480, Number(st.examDurationMinutes)||30));
    S.gameMode = st.gameMode === 'teams' ? 'teams' : 'individual';
    S.teams = normalizeTeams(st.teams, st.teamCount);
    S.loadedQuizId = null;
    S.editingQuestionIndex = null;
    S.viewingArchive = false;
    S.hostRevealing = false;

    showConnectionBanner('Host reconnected — session '+code+' restored.', true);

    if(st.status === 'setup'){
      buildHostSetup('launch');
      showScreen('screen-host-setup');
      startHostSetupPoll();
    } else if(st.status === 'exam'){
      enterHostExam(st);
    } else if(st.status === 'question'){
      enterHostQuestion(st);
    } else if(st.status === 'reveal'){
      const q = st.questions && st.questions[st.currentIndex];
      if(!q){ return false; }
      buildHostReveal(st, st.optionCounts || new Array((q.options||[]).length).fill(0));
    } else if(st.status === 'leaderboard'){
      buildHostLeaderboard(st, await fetchAllPlayers(S.code));
    } else if(st.status === 'final'){
      buildHostFinal(st, await fetchAllPlayers(S.code));
    } else {
      return false;
    }
    return true;
  }

  // Firebase's own connection signal is more reliable than navigator.onLine alone.
  const connectedRef = ref(db, '.info/connected');
  onValue(connectedRef, snap=>{
    firebaseConnected = snap.val() === true;
    const savedHost = getSavedHostSession();
    if(!firebaseConnected && savedHost && S.code === savedHost.code){
      showConnectionBanner('Connection interrupted — your live session is preserved.', false);
    } else if(firebaseConnected && savedHost && S.code === savedHost.code){
      showConnectionBanner('Connection restored.', true);
    }
  });

  window.addEventListener('offline', ()=>{
    const savedHost = getSavedHostSession();
    if(savedHost && S.code === savedHost.code){
      showConnectionBanner('Internet connection lost — your session is preserved.', false);
    }
  });
  window.addEventListener('online', ()=>{
    const savedHost = getSavedHostSession();
    if(savedHost && S.code === savedHost.code){
      showConnectionBanner('Internet is back — syncing live game…', true);
    }
  });

    const submit=async()=>{
      const email=emailInp.value.trim(),pass=passInp.value,name=(nameInp?.value||'').trim();
      if(!email||!pass){errEl.style.color='var(--wrong)';errEl.textContent='Please enter both email and password.';return;}
      if(!isLoginMode&&!name){errEl.style.color='var(--wrong)';errEl.textContent='Please enter your name.';return;}
      submitBtn.disabled=true;submitBtn.textContent='Please wait…';errEl.textContent='';
      try{
        if(isLoginMode) await signInWithEmailAndPassword(auth,email,pass);
        else{
          await createUserWithEmailAndPassword(auth,email,pass);
          currentUserUid=auth.currentUser.uid;
          await saveAccountProfile({displayName:name,role:selectedSignupRole(),country:'Australia',plan:'free',createdAt:Date.now()});
        }
        currentUserUid=auth.currentUser.uid;
        await routeAuthenticatedAccount();
      }catch(error){
        errEl.style.color='var(--wrong)';
        errEl.textContent=(error.message||'Account sign-in failed.').replace('Firebase: ','');
        submitBtn.disabled=false;
        syncAuthMode();
      }
    };

    submitBtn.onclick=submit;
    passInp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    emailInp.addEventListener('keydown',e=>{if(e.key==='Enter')passInp.focus();});
    $('host-auth-back').onclick=buildGetStartedScreen;
    syncAuthMode();
    emailInp.focus();
  }

    async function loadQZMAXPuzzleBank(){
      if(qzPuzzleBank) return qzPuzzleBank;
      if(qzPuzzleBankPromise) return qzPuzzleBankPromise;

      qzPuzzleBankPromise=fetch(QZMAX_PUZZLE_BANK_URL,{cache:'force-cache'})
        .then(async res=>{
          if(!res.ok) throw new Error('Puzzle Bank file unavailable.');
          const data=await res.json();
          if(!data || !Array.isArray(data.puzzles)) throw new Error('Puzzle Bank format invalid.');
          qzPuzzleBank=data;
          populateQZMAXPuzzleTypes();
          return data;
        })
        .catch(err=>{
          console.warn('[QZMAX Puzzle Bank]',err);
          qzPuzzleBankPromise=null;
          return null;
        });
      return qzPuzzleBankPromise;
    }

    function populateQZMAXPuzzleTypes(){
      const typeSel=$('qz-puzzle-type');
      if(!typeSel || !qzPuzzleBank) return;
      const types=[...new Set(qzPuzzleBank.puzzles.map(p=>String(p.type||'')).filter(Boolean))];
      const previous=typeSel.value;
      typeSel.innerHTML=types.map(t=>'<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('');
      if(types.includes(previous)) typeSel.value=previous;
      populateQZMAXPuzzleTopics();
    }

    function populateQZMAXPuzzleTopics(){
      const type=$('qz-puzzle-type')?.value||'';
      const topicSel=$('qz-puzzle-topic');
      if(!topicSel || !qzPuzzleBank) return;
      const previous=topicSel.value;
      const topics=[...new Set(
        qzPuzzleBank.puzzles.filter(p=>!type||p.type===type).map(p=>String(p.topic||'')).filter(Boolean)
      )].sort((a,b)=>a.localeCompare(b));
      topicSel.innerHTML='<option value="">All Topics</option>'+
        topics.map(t=>'<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('');
      if(topics.includes(previous)) topicSel.value=previous;
      schedulePuzzleCoverage();
    }

    function currentPuzzleFilters(){
      return {
        type:$('qz-puzzle-type')?.value||'',
        topic:$('qz-puzzle-topic')?.value||'',
        difficulty:$('ai-difficulty')?.value||'Medium',
        language:$('ai-language')?.value||'English'
      };
    }

    function puzzleCandidates(filters,existingQuestions=[]){
      if(!qzPuzzleBank) return [];
      const knownKeys=new Set(
        (existingQuestions||[])
          .map(q=>q&&q.aiMeta&&q.aiMeta.puzzleKey)
          .filter(Boolean)
      );
      return qzPuzzleBank.puzzles.filter(p=>{
        if(filters.type && p.type!==filters.type) return false;
        if(filters.topic && p.topic!==filters.topic) return false;
        if(filters.difficulty && p.difficulty!==filters.difficulty) return false;
        if(filters.language && p.language!==filters.language) return false;
        if(knownKeys.has(p.puzzleKey)) return false;
        return true;
      });
    }

    function puzzleToQZMAX(p,context){
      const options=(p.options||[]).map(v=>String(v));
      const prompt=String(p.prompt||'Solve the puzzle.').trim();
      const clue=String(p.clue||'').trim();
      const q={
        q:[prompt,clue].filter(Boolean).join('\n\n'),
        type:'multiple_choice',
        options,

      if(out.length<target){
        throw new Error('Puzzle duplicate checks left only '+out.length+' of '+target+' usable puzzles. Request fewer or choose another topic.');
