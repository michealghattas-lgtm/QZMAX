    function verifiedRecordIsFresh(fact){
      if(!fact || fact.status!=='Verified') return false;
      const review=String(fact.reviewBy||'').trim();
      if(!review) return true;
      const reviewDate=new Date(review+'T23:59:59');
      return Number.isNaN(reviewDate.getTime()) || reviewDate.getTime()>=Date.now();
    }

    function qzNorm(value){
      return normalizedTopicKey(String(value||'')).replace(/\s+/g,' ').trim();
    }

    function verifiedRegionMatches(requested,factRegion){
      const req=qzNorm(requested);
      const got=qzNorm(factRegion);
      if(!req) return true;
      if(!got) return false;
      if(req===got || got.includes(req) || req.includes(got)) return true;
      if(req==='australia' && QZMAX_AUSTRALIAN_REGIONS.has(got)) return true;
      return false;
    }

    function parseVerifiedYearRange(value){
      const raw=String(value||'').replace(/[–—]/g,'-').toLowerCase();
      const years=[...raw.matchAll(/\b(1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/g)].map(m=>Number(m[1]));
      const present=/present|current|now/.test(raw);
      if(/20th\s*century/.test(raw)) return {start:1900,end:1999};
      if(/21st\s*century/.test(raw)) return {start:2000,end:2099};
      if(years.length>=2) return {start:Math.min(years[0],years[1]),end:Math.max(years[0],years[1])};
      if(years.length===1 && present) return {start:years[0],end:new Date().getFullYear()};
      if(years.length===1) return {start:years[0],end:years[0]};
      return null;
    }

    function verifiedTimeMatches(requested,factTime){
      const req=String(requested||'').trim();
      if(!req) return true;
      const fact=String(factTime||'').trim();
      if(!fact) return false;

      const reqNorm=qzNorm(req);
      const factNorm=qzNorm(fact);
      if(reqNorm===factNorm || factNorm.includes(reqNorm) || reqNorm.includes(factNorm)) return true;

      const rr=parseVerifiedYearRange(req);
      if(!rr){
        if(/ancient/.test(reqNorm)) return /ancient/.test(factNorm);
        return false;
      }

      if(/current|present/.test(factNorm)){
        const now=new Date().getFullYear();
        return now>=rr.start && now<=rr.end;
      }

      const fr=parseVerifiedYearRange(fact);
      if(!fr) return false;
      return fr.end>=rr.start && fr.start<=rr.end;
    }

    function verifiedFocusMatches(scope,question,fact){
      const focus=qzNorm(scope&&scope.focus);
      if(!focus) return true;
      const stop=new Set(['focus','specific','instructions','major','key','general','about','avoid','only','include','including']);
      const tokens=focus.split(' ').filter(t=>t.length>=4&&!stop.has(t));
      if(!tokens.length) return true;
      const hay=qzNorm([
        question&&question.question,question&&question.topic,question&&question.category,
        fact&&fact.fact,fact&&fact.subtopic,fact&&fact.subject
      ].filter(Boolean).join(' '));
      return tokens.some(t=>hay.includes(t));
    }

    function verifiedFormatMatches(question,requestedType,optsPerQ){
      const type=String(question&&question.type||'');
      const map={
        'Multiple Choice':'multiple_choice',
        'True / False':'true_false',
        'Select Multiple':'multiple_correct',
        'Typed':'typed'
      };
      const appType=map[type]||'';

      if(requestedType==='mixed'){
        if(!['multiple_choice','true_false','multiple_correct'].includes(appType)) return false;
      }else if(appType!==requestedType){
        return false;
      }

      const options=Array.isArray(question.options)?question.options:[];
      if(appType==='true_false') return options.length===2;
      if(appType==='multiple_choice' || appType==='multiple_correct'){
        return options.length===Number(optsPerQ||4);
      }
      return true;
    }

    function verifiedScopeMatches(question,fact,scope){
      if(!question || !fact) return false;
      if(question.status!=='Ready' || !verifiedRecordIsFresh(fact)) return false;

      const requestedDifficulty=String(scope.difficulty||'Medium');
      if(String(question.difficulty||fact.difficulty||'')!==requestedDifficulty) return false;

      const category=qzNorm(scope.category);
      const topic=qzNorm(scope.topic);
      const qCategory=qzNorm(question.category||fact.category);
      const qTopic=qzNorm(question.topic||fact.topic);

      let requestedRegion=scope.region||'';
      if(category==='general knowledge' && topic==='australia' && !requestedRegion){
        requestedRegion='Australia';
      }

      if(!verifiedRegionMatches(requestedRegion,fact.region)) return false;
      if(!verifiedTimeMatches(scope.timePeriod,fact.timePeriod)) return false;
      if(!verifiedFocusMatches(scope,question,fact)) return false;

      if(category==='general knowledge'){
        if(topic==='mixed general knowledge' || topic==='world'){
          return QZMAX_GENERAL_KNOWLEDGE_CATEGORIES.has(qCategory);
        }
        if(topic==='australia'){
          return QZMAX_GENERAL_KNOWLEDGE_CATEGORIES.has(qCategory) &&
            verifiedRegionMatches('Australia',fact.region);
        }
        if(topic==='science nature') return qCategory==='science nature';
        if(topic==='entertainment') return qCategory==='film television' || qCategory==='music';
        if(topic==='sports') return qCategory==='sports';
        if(topic==='history geography') return qCategory==='history' || qCategory==='geography';
        return qTopic===topic || qCategory===topic;
      }

      return qCategory===category && (qTopic===topic || qzNorm(fact.topic)===topic);
    }

    function verifiedQuestionToQZMAX(question,fact,source,context){
      const options=(question.options||[]).map(v=>String(v));
      const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const selected=String(question.correctOption||'')
        .split(',').map(v=>v.trim()).filter(Boolean);
      const indexes=selected.map(letter=>letters.indexOf(letter.toUpperCase()))
        .filter(i=>i>=0&&i<options.length);

      let type='multiple_choice';
      if(question.type==='True / False') type='true_false';
      else if(question.type==='Select Multiple') type='multiple_correct';
      else if(question.type==='Typed') type='typed';

      const q={
        q:String(question.question||'').trim(),
        type,
        options,
        timeLimit:context.timePerQuestion,
        points:context.pointsPerQuestion,
        explanation:String(question.explanation||'').trim(),
        excluded:false,
        aiMeta:{
          kind:'qzmax',
          label:'QZMAX Verified',
          sourceName:source
            ? [source.publisher,source.title].filter(Boolean).join(' • ')
            : 'QZMAX Verified Knowledge Base',
          sourceUrls:source&&source.url?[source.url]:[],
          evidence:String(fact.evidence||'').slice(0,900),
          language:question.language||'English',
          provider:'QZMAX Verified Knowledge',
          model:'KB v0.2',
          verification:'Pre-verified record',
          generationId:context.generationId||'',
          requestedTopic:context.topic||'',
          factKey:String(fact.factKey||question.factId||question.id||''),
          category:question.category||fact.category||'',
          verifiedQuestionId:question.id||'',
          verifiedFactId:fact.id||'',
          verifiedDate:fact.verifiedDate||'',
          reviewBy:fact.reviewBy||''
        }
      };

      if(type==='multiple_correct'){
        q.correctIndexes=indexes;
        q.correct=indexes[0];
      }else if(type==='typed'){
        q.options=[];
        q.acceptedAnswers=[question.correctAnswer].filter(Boolean);
      }else{
        q.correct=indexes.length?indexes[0]:0;
      }
      return q;
    }

    function shuffleVerifiedCopy(arr){
      const out=arr.slice();
      for(let i=out.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [out[i],out[j]]=[out[j],out[i]];
      }
      return out;
    }

    async function qzVerifiedCoverage(scope,requestedType,optsPerQ,questionLanguage){
      const data=await loadQZMAXVerifiedKB();
      if(!data) return {available:false,questions:[],facts:[]};

      const candidates=[];
      const factMatches=[];

      for(const question of data.questions){
        if(String(question.language||'English')!==String(questionLanguage||'English')) continue;
        if(!verifiedFormatMatches(question,requestedType,optsPerQ)) continue;
        const fact=data._factById.get(question.factId);
        if(!fact || !verifiedScopeMatches(question,fact,scope)) continue;
        candidates.push({
          question,
          fact,
          source:data._sourceById.get(fact.sourceId)||null
        });
      }

      for(const fact of data.facts){
        if(!verifiedRecordIsFresh(fact)) continue;
        const pseudo={
          status:'Ready',
          difficulty:fact.difficulty,
          category:fact.category,
          topic:fact.topic,
          question:fact.fact
        };
        if(verifiedScopeMatches(pseudo,fact,scope)) factMatches.push(fact);
      }

      return {available:true,questions:candidates,facts:factMatches};
    }

    async function selectQZMAXVerifiedQuestions({
      scope,requestedType,optsPerQ,questionLanguage,target,timePerQuestion,
      pointsPerQuestion,generationId,topic,existingQuestions
    }){
      const coverage=await qzVerifiedCoverage(scope,requestedType,optsPerQ,questionLanguage);
      if(!coverage.available || !coverage.questions.length) return [];

      const known=Array.isArray(existingQuestions)?existingQuestions:[];
      let pool=shuffleVerifiedCopy(coverage.questions);

      if(requestedType==='mixed'){
        const quotas={multiple_choice:0,true_false:0,multiple_correct:0};
        const order=['multiple_choice','true_false','multiple_correct'];
        for(let i=0;i<target;i++) quotas[order[i%order.length]]++;

        const selected=[];
        for(const type of order){
          const typePool=pool.filter(entry=>{
            const t=entry.question.type==='Multiple Choice'?'multiple_choice':
              entry.question.type==='True / False'?'true_false':
              entry.question.type==='Select Multiple'?'multiple_correct':'';
            return t===type;
          });
          selected.push(...typePool.slice(0,quotas[type]));
        }
        const ids=new Set(selected.map(x=>x.question.id));
        pool=selected.concat(pool.filter(x=>!ids.has(x.question.id)));
      }

      const out=[];
      for(const entry of pool){
        if(out.length>=target) break;
        const q=verifiedQuestionToQZMAX(entry.question,entry.fact,entry.source,{
          timePerQuestion,pointsPerQuestion,generationId,topic
        });
        if(!aiQuestionStructuralCheck(q)) continue;
        if(isDuplicateGeneratedQuestion(q,known) || isDuplicateGeneratedQuestion(q,out)) continue;
        out.push(q);
      }

      randomizeGeneratedAnswerPositions(out);
      return out;
    }

    async function loadQZMAXKnowledgePack(pack){

      const promise=fetch('data/'+pack.file,{cache:'force-cache'})

          qzKnowledgePackCache.delete(pack.id);

        });

      qzKnowledgePackCache.set(pack.id,promise);
      return promise;

    function knowledgeNormSet(values){
      return new Set((values||[]).map(qzNorm).filter(Boolean));
    }

    function knowledgePackScore(pack,scope,language){
      if(!pack || String(pack.language||'')!==String(language||'')) return -1;

      const category=qzNorm(scope.category);
      const topic=qzNorm(scope.topic);
      const region=qzNorm(scope.region);
      const market=qzNorm(pack.market);
      const cats=knowledgeNormSet(pack.categories);
      const topics=knowledgeNormSet(pack.topics);
      let score=0;

      if(category==='bible christianity'){
        if(pack.trustKind!=='studybible') return -1;
        score+=30;
        if(topic && topic!=='orthodox study bible mixed' && topics.has(topic)) score+=20;
        return score;
      }
      if(pack.trustKind==='studybible') return -1;

      if(category==='general knowledge'){
        if(topic==='australia'){
          if(!market.includes('australia')) return -1;
          score+=40;
        }else if(topic==='egypt'){
          if(!market.includes('egypt')) return -1;
          score+=40;
        }else if(topic==='middle east'){
          if(!market.includes('middle east')) return -1;
          score+=40;
        }else if(topic==='world'){
          if(!market.includes('world')) return -1;
          score+=30;
        }else{
          score+=8;
        }
      }else{
        if(!cats.has(category)) return -1;
        score+=20;
        if(topic && topics.has(topic)) score+=20;
      }

      if(region){
        if(market.includes(region) || region.includes(market)) score+=12;
        if(region==='egypt' && market.includes('egypt')) score+=12;
        if(region==='australia' && market.includes('australia')) score+=12;
        if(region==='middle east' && market.includes('middle east')) score+=12;
      }

      return score;
    }

    async function loadRelevantQZMAXKnowledgePacks(scope,language){
      const manifest=await loadQZMAXKnowledgeManifest();
      if(!manifest) return [];

      const ranked=manifest.packs
        .map(pack=>({pack,score:knowledgePackScore(pack,scope,language)}))
        .filter(x=>x.score>=0)
        .sort((a,b)=>b.score-a.score)
        .slice(0,3);

      const loaded=await Promise.all(ranked.map(async x=>({
        meta:x.pack,
        score:x.score,
        data:await loadQZMAXKnowledgePack(x.pack)
      })));
      return loaded.filter(x=>x.data);
    }

    function knowledgeRegionMatches(requested,record){
      const req=qzNorm(requested);
      if(!req) return true;
      const region=qzNorm(record.region);
      const market=qzNorm(record.market);
      const joined=region+' '+market;

      if(joined.includes(req) || req.includes(region) || req.includes(market)) return true;
      if(req==='egypt' && (joined.includes('egypt') || joined.includes('مصر'))) return true;
      if(req==='australia' && (joined.includes('australia') || joined.includes('أستراليا'))) return true;
      if(req==='middle east' && (joined.includes('middle east') || joined.includes('الشرق الأوسط') || joined.includes('الشرق الاوسط'))) return true;
      if(req==='world' && market.includes('world')) return true;
      return false;
    }

    function knowledgeTimeMatches(requested,yearPeriod){
      const req=String(requested||'').trim();
      if(!req) return true;
      const fact=String(yearPeriod||'').trim();
      if(!fact) return true;

      const factNorm=qzNorm(fact);
      if(
        factNorm.includes('غير مرتبط بزمن') ||
        factNorm.includes('not time bound') ||
        factNorm.includes('timeless')
      ) return true;

      const reqNorm=qzNorm(req);
      if(reqNorm===factNorm || factNorm.includes(reqNorm) || reqNorm.includes(factNorm)) return true;

      const rr=parseVerifiedYearRange(req);
      const fr=parseVerifiedYearRange(fact);
      if(rr && fr) return fr.end>=rr.start && fr.start<=rr.end;

      if(rr && (factNorm.includes('معاصر') || factNorm.includes('current') || factNorm.includes('contemporary'))){
        const now=new Date().getFullYear();
        return now>=rr.start && now<=rr.end;
      }

      if(reqNorm.includes('ancient')){
        return (
          factNorm.includes('ancient') ||
          factNorm.includes('مصر القديمة') ||
          factNorm.includes('الدولة القديمة') ||
          factNorm.includes('ق م') ||
          factNorm.includes('bc')
        );
      }

      return false;
    }

    const KNOWLEDGE_TOPIC_ALIASES={

    function knowledgeTopicMatches(scope,record){
      const category=qzNorm(scope.category);
      const topic=qzNorm(scope.topic);
      const recCategory=qzNorm(record.category);
      const recTopic=qzNorm(record.topic);

      if(category==='bible christianity'){
        if(recCategory!=='bible christianity') return false;
        if(!topic || topic==='orthodox study bible mixed') return true;
        const aliases=KNOWLEDGE_TOPIC_ALIASES[topic]||[topic];
        return aliases.some(a=>recTopic===qzNorm(a));
      }

      if(category==='general knowledge'){
        if(topic==='mixed general knowledge') return true;
        if(topic==='australia') return knowledgeRegionMatches('Australia',record);
        if(topic==='egypt') return knowledgeRegionMatches('Egypt',record);
        if(topic==='middle east') return knowledgeRegionMatches('Middle East',record);
        if(topic==='world') return qzNorm(record.market).includes('world');
        if(topic==='science nature') return recCategory==='science nature';
        if(topic==='entertainment') return ['film television','music','arts literature'].includes(recCategory);
        if(topic==='sports') return recCategory==='sports';
        if(topic==='history geography') return recCategory==='history' || recCategory==='geography';
        if(topic==='people places') return ['history','geography','culture society'].includes(recCategory);
        return recTopic===topic || recCategory===topic;
      }

      if(recCategory!==category) return false;
      if(!topic) return true;
      if(recTopic===topic) return true;

      const aliases=KNOWLEDGE_TOPIC_ALIASES[topic]||[];
      if(aliases.some(a=>recTopic===qzNorm(a))) return true;

      if(topic==='general science' && recCategory==='science nature') return true;
      if(topic==='egyptian arts' && recTopic==='egyptian arts') return true;
      if(topic==='ancient egypt' && recTopic==='egyptian history'){
        const period=qzNorm(record.yearPeriod);
        return (
          period.includes('ancient') ||
          period.includes('مصر القديمة') ||
          period.includes('الدولة القديمة') ||
          period.includes('الدولة الوسطى') ||
          period.includes('الدولة الحديثة') ||
          period.includes('ق م')
        );
      }
      return false;
    }

    function knowledgeFocusMatches(scope,record){
      const focus=qzNorm(scope.focus);
      if(!focus) return true;
      const stop=new Set(['focus','specific','instructions','major','key','general','about','avoid','only','include','including']);
      const tokens=focus.split(' ').filter(t=>t.length>=3 && !stop.has(t));
      if(!tokens.length) return true;
      const hay=qzNorm([
        record.question,record.category,record.topic,record.originalCategory,record.originalTopic,
        record.region,record.yearPeriod,record.sourceType
      ].filter(Boolean).join(' '));
      return tokens.some(t=>hay.includes(t));
    }

    function knowledgeRecordMatches(record,scope,language,requestedType,optsPerQ){
      if(!record || record.runtimeEligible!==true) return false;
      if(String(record.language||'')!==String(language||'')) return false;

      // Imported Knowledge Bank records are currently MCQ-only.
      if(requestedType!=='multiple_choice' && requestedType!=='mixed') return false;
      if(Number(optsPerQ||4)!==4) return false;

      const requestedDifficulty=String(scope.difficulty||'Medium');
      if(String(record.difficulty||'Medium')!==requestedDifficulty) return false;

      if(!knowledgeRegionMatches(scope.region,record)) return false;
      if(!knowledgeTimeMatches(scope.timePeriod,record.yearPeriod)) return false;
      if(!knowledgeTopicMatches(scope,record)) return false;
      if(!knowledgeFocusMatches(scope,record)) return false;
      return true;
    }

    async function qzKnowledgeCoverage(scope,requestedType,optsPerQ,language){
      const packs=await loadRelevantQZMAXKnowledgePacks(scope,language);
      const candidates=[];
      for(const loaded of packs){
        for(const record of loaded.data.records){
          if(knowledgeRecordMatches(record,scope,language,requestedType,optsPerQ)){
            candidates.push(record);
          }
        }
      }

      return {
        available:packs.length>0,
        candidates,
        knowledgeCount:candidates.filter(r=>r.trustKind==='knowledge').length,
        studyBibleCount:candidates.filter(r=>r.trustKind==='studybible').length,
        packs:packs.map(x=>x.meta.name)
      };
    }

    function knowledgeRecordToQZMAX(record,context){
      const kind=record.trustKind==='studybible'?'studybible':'knowledge';
      const label=record.trustKind==='studybible'
        ? 'Study Bible Grounded'
        : (record.trustLabel||'QZMAX Knowledge');

      return {
        q:String(record.question||'').trim(),
        type:'multiple_choice',
        options:(record.options||[]).map(v=>String(v)),
        correct:Number(record.correctIndex)||0,
        timeLimit:context.timePerQuestion,
        points:context.pointsPerQuestion,
        explanation:'',
        excluded:false,
        aiMeta:{
          kind,
          label,
          sourceName:record.sourceType
            ? record.pack+' • '+record.sourceType
            : record.pack,
          sourceUrls:record.sourceUrl?[record.sourceUrl]:[],
          language:record.language||context.questionLanguage||'English',
          provider:'QZMAX Unified Knowledge Bank',
          model:'Knowledge v0.4',
          verification:String(record.verificationStatus||'Imported review status'),
          generationId:context.generationId||'',
          requestedTopic:context.topic||'',
          factKey:'knowledge:'+String(record.duplicateKey||record.id||''),
          category:record.category||'',
          knowledgeRecordId:record.id||'',
          knowledgePack:record.pack||'',
          knowledgeTrust:record.trustKind||'knowledge',
          yearPeriod:record.yearPeriod||'',
          region:record.region||'',
          difficultyUnrated:record.difficultyUnrated===true
        }
      };
    }

    async function selectQZMAXKnowledgeQuestions({
      scope,requestedType,optsPerQ,questionLanguage,target,timePerQuestion,
      pointsPerQuestion,generationId,topic,existingQuestions
    }){
      if(target<=0) return [];
      const coverage=await qzKnowledgeCoverage(scope,requestedType,optsPerQ,questionLanguage);
      if(!coverage.available || !coverage.candidates.length) return [];

      const known=Array.isArray(existingQuestions)?existingQuestions:[];
      let maxTake=target;

      // Knowledge packs are MCQ-only. Preserve room for other formats in Mixed mode.
      if(requestedType==='mixed') maxTake=Math.min(target,Math.ceil(target/3));

      const pool=shuffleVerifiedCopy(coverage.candidates);
      const out=[];
      for(const record of pool){
        if(out.length>=maxTake) break;
        const q=knowledgeRecordToQZMAX(record,{
          timePerQuestion,pointsPerQuestion,generationId,topic,questionLanguage
        });
        if(!aiQuestionStructuralCheck(q)) continue;
        if(isDuplicateGeneratedQuestion(q,known) || isDuplicateGeneratedQuestion(q,out)) continue;
        out.push(q);
      }

      randomizeGeneratedAnswerPositions(out);
      return out;
    }

    async function fetchSourceLink(){
      const input = $('ai-link-url');
      const status = $('ai-link-status');
      const fetchBtn = $('ai-link-fetch');
      const value = input ? input.value.trim() : '';

      if(!sourceLinkUrlLooksValid(value)){
        resetSourceLinkState('Enter a valid public http:// or https:// URL.');
        status.className='source-link-status error';
        return;
      }

      fetchBtn.disabled = true;
      fetchBtn.textContent = 'Fetching…';
      status.className = 'source-link-status loading';
      status.textContent = 'Extracting the source page…';
      $('ai-link-preview').style.display='none';

      try{
        const res = await fetch('/.netlify/functions/generate',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'extract_source',url:value})
        });

        let data = null;
        try{ data = await res.json(); }catch(e){}

        if(!res.ok){
          throw new Error(
            data && data.error
              ? data.error
              : 'Source extraction requires QZMAX Full Local Preview (Netlify Dev) or the deployed backend.'
          );
        }
        if(!data || !data.content){
          throw new Error('No usable page content was returned from this link.');
        }

        aiLinkState = {
          url:data.url || value,
          title:data.title || data.domain || 'Source page',
          domain:data.domain || '',
          text:data.content,
          chars:Number(data.chars)||data.content.length,
          words:Number(data.words)||0,
          truncated:data.truncated===true,
          extractDepth:data.extractDepth||'basic'
        };

        status.className='source-link-status ready';
        status.textContent =
          '✓ Source ready · '+aiLinkState.words.toLocaleString()+' words'+
          (aiLinkState.truncated?' · long page trimmed for QZMAX':'')+'.';

        $('ai-link-title').textContent=aiLinkState.title;
        $('ai-link-domain').textContent=aiLinkState.domain;
        $('ai-link-words').textContent=aiLinkState.words.toLocaleString();
        $('ai-link-chars').textContent=aiLinkState.chars.toLocaleString();
        $('ai-link-depth').textContent=(aiLinkState.extractDepth==='advanced'?'Advanced':'Basic')+' extraction';
        $('ai-link-open').href=aiLinkState.url;
        $('ai-link-excerpt').textContent=aiLinkState.text.slice(0,1800)+(aiLinkState.text.length>1800?'…':'');
        $('ai-link-preview').style.display='';
      }catch(err){
        aiLinkState = {url:'',title:'',domain:'',text:'',chars:0,words:0,truncated:false,extractDepth:'basic'};
        status.className='source-link-status error';
        status.textContent=err.message || 'Could not extract this source link.';
      }finally{
        fetchBtn.disabled=false;
        fetchBtn.textContent='Fetch source';
      }
    }

    $('ai-generate').onclick = async ()=>{
      let topic = '';
      let sourceText = '';
      let sourceType = aiSourceMode;
      let sourceName = '';
      let sourceUrls = [];
      let structuredScope = {};
      const selectedDifficulty = $('ai-difficulty') ? $('ai-difficulty').value : 'Medium';

      if(aiSourceMode==='document'){
        if(!aiDocumentState.text){
          $('ai-msg').style.color='var(--wrong)';
          $('ai-msg').textContent = 'Choose and process a PDF, DOCX or TXT document first.';
          return;
        }
        const focus = $('ai-document-focus').value.trim();
        topic = focus || ('Create a quiz from '+aiDocumentState.name);
        sourceText = aiDocumentState.text;
        sourceName = aiDocumentState.name;
        structuredScope = {
          mode:'document',
          topic:focus || aiDocumentState.name,
          difficulty:selectedDifficulty
        };
      }else if(aiSourceMode==='link'){
        if(!aiLinkState.text){
          $('ai-msg').style.color='var(--wrong)';
          $('ai-msg').textContent = 'Fetch a source link successfully before generating questions.';
          return;
        }
        const focus = $('ai-link-focus').value.trim();
        topic = focus || ('Create a quiz from '+aiLinkState.title);
        sourceText = aiLinkState.text;
        sourceName = aiLinkState.title || aiLinkState.domain || 'Source link';
        sourceUrls = [aiLinkState.url];
        sourceType = 'link';
        structuredScope = {
          mode:'link',
          topic:focus || aiLinkState.title || aiLinkState.domain || 'Source link',
          difficulty:selectedDifficulty
        };
      }else if(aiSourceMode==='puzzle'){
        const pf=currentPuzzleFilters();
        if(!pf.type){
          $('ai-msg').style.color='var(--wrong)';
          $('ai-msg').textContent='Choose a puzzle type.';
          return;
        }
        topic=[pf.type,pf.topic||'All Topics'].join(' — ');
        sourceType='puzzle';
        sourceName='QZMAX Puzzle Bank';
        structuredScope={
          mode:'puzzle',
          puzzleType:pf.type,
          topic:pf.topic||'',
          difficulty:selectedDifficulty
        };
      }else if(aiSourceMode==='school'){
        const grade = $('ai-grade').value;
        const subject = $('ai-subject').value;
        topic = buildSchoolExamTopic(grade, subject, selectedDifficulty);
        sourceType = 'school';
        sourceName = `${grade} ${subject} — curriculum-guided review`;
        structuredScope = {
          mode:'school',
          year:grade,
          subject,
          difficulty:selectedDifficulty
        };
      }else{
        structuredScope = guidedScopeFromUI();
        if(!structuredScope.category){
          $('ai-msg').style.color='var(--wrong)';
          $('ai-msg').textContent = 'Choose a category or enter your custom category.';
          return;
        }
        if(!structuredScope.topic){
          $('ai-msg').style.color='var(--wrong)';
          $('ai-msg').textContent = 'Choose a topic or enter your custom topic.';
          return;
        }
        topic = buildGuidedAITopic(structuredScope);
        sourceType = 'ai';
        sourceName = 'QZMAX Guided AI + Search';
      }

      const generationId = newGenerationId();
      const count = Math.max(1, Math.min(100, parseInt($('ai-count').value,10) || 10));
      $('ai-count').value = String(count);
      const questionLanguage = $('ai-language') ? $('ai-language').value : 'English';
      const aiQuestionType = $('ai-question-type').value || 'multiple_choice';
      const optsPerQ = aiQuestionType==='true_false'
        ? 2
        : Math.max((aiQuestionType==='multiple_correct' || aiQuestionType==='mixed') ? 3 : 2, Math.min(8, parseInt($('ai-opts-per-q').value,10) || 4));
      const rawAITime = parseInt($('ai-time-per-q').value,10);
      const timePerQuestion = Math.max(3, Math.min(600, Number.isFinite(rawAITime) ? rawAITime : DEFAULT_QUESTION_TIME));
      $('ai-time-per-q').value = String(timePerQuestion);
      const rawAIPoints = parseInt($('ai-points-per-q').value,10);
      const pointsPerQuestion = Math.max(0, Math.min(100000, Number.isFinite(rawAIPoints) ? rawAIPoints : DEFAULT_QUESTION_POINTS));
      $('ai-points-per-q').value = String(pointsPerQuestion);

      const btn = $('ai-generate');
      const msg = $('ai-msg');
      btn.disabled = true;
      $('ai-progress-shell').style.display = '';
      setAIProgress(
        2,
        aiSourceMode==='document'
          ? 'Preparing document source…'
          : aiSourceMode==='link'
          ? 'Preparing extracted source link…'
          : aiSourceMode==='puzzle'
          ? 'Selecting unused Ready puzzles…'
          : 'Preparing AI request…'
      );
      msg.textContent = '';
      msg.style.color = 'var(--muted)';

      try{
        let verifiedQuestions = [];
        let knowledgeQuestions = [];
        let generatedAI = [];
        let aiShortfallError = null;

        if(aiSourceMode==='puzzle'){
          setAIProgress(35,'Selecting matching puzzles from QZMAX Puzzle Bank…');
          generatedAI=await selectQZMAXPuzzles({
            target:count,
            timePerQuestion,
            pointsPerQuestion,
            generationId,
            existingQuestions:S.questionsDraft
          });
          setAIProgress(92,'Puzzle selection complete — checking duplicates and answer positions…');
        }else if(aiSourceMode==='trusted'){
          sourceText = '';
          sourceUrls = [];
          sourceType = 'ai';
          sourceName = 'QZMAX Guided AI + Search';

          setAIProgress(5, 'Checking QZMAX Verified Knowledge first…');

          verifiedQuestions = await selectQZMAXVerifiedQuestions({
            scope:structuredScope,
            requestedType:aiQuestionType,
            optsPerQ,
            questionLanguage,
            target:count,
            timePerQuestion,
            pointsPerQuestion,
            generationId,
            topic,
            existingQuestions:S.questionsDraft
          });

          if(verifiedQuestions.length){
            setAIProgress(
              Math.min(52,10+Math.round((verifiedQuestions.length/count)*40)),
              verifiedQuestions.length+' of '+count+' found in QZMAX Verified Knowledge…'
            );
          }

          const afterVerified=Math.max(0,count-verifiedQuestions.length);
          if(afterVerified>0){
            setAIProgress(
              Math.max(14,Math.min(58,10+Math.round((verifiedQuestions.length/count)*40))),
              'Checking matching QZMAX Knowledge and Study Bible packs…'
            );

            knowledgeQuestions=await selectQZMAXKnowledgeQuestions({
              scope:structuredScope,
              requestedType:aiQuestionType,
              optsPerQ,
              questionLanguage,
              target:afterVerified,
              timePerQuestion,
              pointsPerQuestion,
              generationId,
              topic,
              existingQuestions:S.questionsDraft.concat(verifiedQuestions)
            });

            if(knowledgeQuestions.length){
              setAIProgress(
                Math.min(72,24+Math.round(((verifiedQuestions.length+knowledgeQuestions.length)/count)*48)),
                (verifiedQuestions.length+knowledgeQuestions.length)+' of '+count+
                ' supplied instantly from QZMAX content banks…'
              );
            }
          }

          const remaining=Math.max(0,count-verifiedQuestions.length-knowledgeQuestions.length);
          if(remaining>0){
            const localCount=verifiedQuestions.length+knowledgeQuestions.length;
            setAIProgress(
              Math.max(28,Math.min(76,24+Math.round((localCount/count)*48))),
              'Local content supplied '+localCount+
              '. Freshly generating and verifying only the remaining '+remaining+'…'
            );

            try{
              generatedAI = await generateVerifiedQuestionBatches({
                topic,
                requestedCount:remaining,
                optsPerQ,
                questionType:aiQuestionType,
                sourceText:'',
                sourceType:'ai',
                sourceName:'QZMAX Guided AI + Search',
                sourceUrls:[],
                questionLanguage,
                timePerQuestion,
                pointsPerQuestion,
                difficulty:selectedDifficulty,
                structuredScope,
                generationId,
                existingQuestions:S.questionsDraft.concat(verifiedQuestions,knowledgeQuestions),
                onProgress:(done,total,label)=>{
                  const localCount=verifiedQuestions.length+knowledgeQuestions.length;
                  const basePct=localCount/count;
                  const aiPct=(done/Math.max(1,total))*(1-basePct);
                  setAIProgress(
                    Math.min(96,18+Math.round((basePct+aiPct)*78)),
                    label||('Verified '+done+' of '+total+' shortfall questions…')
                  );
                }
              });
            }catch(shortfallErr){
              if(!(verifiedQuestions.length+knowledgeQuestions.length)) throw shortfallErr;
              aiShortfallError=shortfallErr;
            }
          }
        }else{
          if(aiSourceMode==='school'){
            sourceText = '';
            sourceUrls = [];
            sourceType = 'school';
            setAIProgress(8, 'Year-level subject guidance ready — starting generation…');
          }else{
            setAIProgress(
              8,
              aiSourceMode==='link'
                ? 'Source link grounded content ready — starting generation…'
                : 'Document ready — starting generation…'
            );
          }

          generatedAI = await generateVerifiedQuestionBatches({
            topic,
            requestedCount:count,
            optsPerQ,
            questionType:aiQuestionType,
            sourceText,
            sourceType,
            sourceName,
            sourceUrls,
            questionLanguage,
            timePerQuestion,
            pointsPerQuestion,
            difficulty:selectedDifficulty,
            structuredScope,
            generationId,
            existingQuestions:S.questionsDraft,
            onProgress:(done,total,label)=>{
              const pct = Math.min(96, 8 + Math.round((done/Math.max(1,total))*88));
              setAIProgress(pct, label || ('Generated '+done+' of '+total+'…'));
            }
          });
        }

        const generated=verifiedQuestions.concat(knowledgeQuestions,generatedAI).slice(0,count);
        if(!generated.length){
          throw aiShortfallError || new Error('No usable questions could be produced.');
        }

        generated.forEach(q=>{
          q.timeLimit = timePerQuestion;
          q.points = pointsPerQuestion;
        });

        S.questionsDraft = S.questionsDraft.concat(generated);
        renderHostQList();
        await pushQuestionsToState();

        setAIProgress(100, 'Complete');

        const puzzleCount=generated.filter(q=>q&&q.aiMeta&&q.aiMeta.label==='QZMAX Puzzle').length;
        const qzmaxCount=generated.filter(q=>q&&q.aiMeta&&q.aiMeta.label==='QZMAX Verified').length;
        const knowledgeCount=generated.filter(q=>q&&q.aiMeta&&q.aiMeta.kind==='knowledge').length;
        const studyBibleCount=generated.filter(q=>q&&q.aiMeta&&q.aiMeta.kind==='studybible').length;
        const webCount=generated.filter(q=>q&&q.aiMeta&&q.aiMeta.label==='2-Source Checked').length;
        const localKnowledgeCount=qzmaxCount+knowledgeCount+studyBibleCount;

        if(puzzleCount===generated.length){
          msg.style.color='var(--correct)';
          msg.textContent='Added '+generated.length+' QZMAX Puzzle'+(generated.length===1?'':'s')+
            ' instantly from the curated Puzzle Bank. No AI or web-search call was needed.';
          schedulePuzzleCoverage();
        }else if(aiShortfallError){
          msg.style.color='var(--wrong)';
          msg.textContent='Added '+localKnowledgeCount+' local content question'+(localKnowledgeCount===1?'':'s')+
            ' ('+qzmaxCount+' Verified · '+knowledgeCount+' Knowledge · '+studyBibleCount+' Study Bible). '+
            'QZMAX could not complete the remaining '+Math.max(0,count-generated.length)+
            ' through fresh AI verification: '+(aiShortfallError.message||'verification unavailable')+'.';
        }else if(localKnowledgeCount===generated.length){
          msg.style.color='var(--correct)';
          msg.textContent='Added '+generated.length+' instantly from QZMAX content banks: '+
            qzmaxCount+' Verified · '+knowledgeCount+' Knowledge · '+studyBibleCount+
            ' Study Bible Grounded. No AI or web-search call was needed.';
        }else if(localKnowledgeCount){
          msg.style.color='var(--correct)';
          msg.textContent='Added '+generated.length+' questions: '+qzmaxCount+' Verified · '+
            knowledgeCount+' Knowledge · '+studyBibleCount+' Study Bible Grounded · '+
            webCount+' freshly 2-Source Checked. AI/search was used only for the shortfall.';
        }else{
          msg.style.color = 'var(--correct)';
          const allWebVerified = generated.length>0 &&
            generated.every(q=>q&&q.aiMeta&&q.aiMeta.label==='2-Source Checked');
          const groundedLabel = allWebVerified
            ? 'web-verified'
            : aiSourceMode==='document'
            ? 'document-grounded'
            : aiSourceMode==='link'
            ? 'link-grounded'
            : sourceType==='school'
            ? 'year-level curriculum-guided'
            : 'AI-review';
          const usedRoutes=[...new Set(generated.map(q=>{
            const p=q&&q.aiMeta&&q.aiMeta.provider;
            const m=q&&q.aiMeta&&q.aiMeta.model;
            return p ? (m ? p+' · '+m : p) : '';
          }).filter(Boolean))];
          msg.textContent='Added '+generated.length+' '+groundedLabel+' question'+
            (generated.length===1?'':'s')+'. Duplicate and structural checks passed.'+
            (usedRoutes.length?' Route'+(usedRoutes.length>1?'s':'')+': '+usedRoutes.join(' → ')+'.':'')+
            ' Review before saving.';
        }

        scheduleVerifiedCoveragePreview();
      }catch(err){
        msg.style.color = 'var(--wrong)';
        msg.textContent = err.message || 'Something went wrong generating questions.';
      }finally{
        btn.disabled = false;
        updateAIGenerateButton();
        setTimeout(()=>{ if($('ai-progress-shell')) $('ai-progress-shell').style.display='none'; }, 1600);
      }
    };

    function setAIProgress(percent,label){
      const fill = $('ai-progress-fill');
      const text = $('ai-progress-label');
      if(fill) fill.style.width = Math.max(0,Math.min(100,percent))+'%';
      if(text) text.textContent = label || '';
    }

    $('qf-type').value = S.questionType || 'multiple_choice';
    updateQuestionTypeUI();
    $('qf-type').onchange = updateQuestionTypeUI;
    $('qf-add-option').onclick = ()=>{
      if(S.formOpts.length>=MAX_OPTIONS) return;
      S.formOpts.push({text:'', correct:false});
      renderOptionInputs();
    };

    $('qf-add').onclick = ()=>{
      const type = $('qf-type').value || 'multiple_choice';
      const text = $('qf-text').value.trim();
      const timeLimit = Math.max(3, Math.min(600, parseInt($('qf-time').value,10) || DEFAULT_QUESTION_TIME));
      const rawPoints = parseInt($('qf-points').value,10);
      const points = Math.max(0, Number.isFinite(rawPoints) ? rawPoints : DEFAULT_QUESTION_POINTS);
      const explanation = $('qf-explanation').value.trim();
      const rawImage = $('qf-image-url').value.trim();
      const imageUrl = safeImageUrl(rawImage);

      if(!text){
        $('qf-err').textContent = 'Enter the question first.';
        return;
      }
      if(rawImage && !imageUrl){
        $('qf-err').textContent = 'Image URL must be a full http:// or https:// address.';
        return;
      }

      const previousAI = S.editingQuestionIndex !== null && S.questionsDraft[S.editingQuestionIndex]
        ? S.questionsDraft[S.editingQuestionIndex].aiMeta
        : null;
      let question = {
        q:text,
        type,
        timeLimit,
        points,
        explanation,
        imageUrl,
        excluded:false,
        ...(previousAI ? {aiMeta:previousAI} : {})
      };

      if(type==='typed'){
        const accepted = $('qf-typed-answers').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
        const unique = [];
        const seen = new Set();
        accepted.forEach(v=>{
          const n = normalizeTypedAnswer(v);
          if(n && !seen.has(n)){ seen.add(n); unique.push(v); }
        });
        if(!unique.length){
          $('qf-err').textContent = 'Add at least one accepted typed answer.';
          return;
        }
        question.options = [];
        question.acceptedAnswers = unique;
      }else{
        const opts = S.formOpts.map(o=>o.text.trim());
        if(opts.length<2 || opts.some(o=>o.length===0)){
          $('qf-err').textContent = 'Fill in at least two answer options.';
          return;
        }
        question.options = opts;

        if(type==='multiple_correct'){
          const correctIndexes = S.formOpts.map((o,i)=>o.correct?i:null).filter(i=>i!==null);
          if(correctIndexes.length<2){
            $('qf-err').textContent = 'Select Multiple questions need at least two correct options.';
            return;
          }
          question.correctIndexes = correctIndexes;
          question.correct = correctIndexes[0];
        }else{
          const correctIdx = S.formOpts.findIndex(o=>o.correct);
          if(correctIdx<0){
            $('qf-err').textContent = 'Mark one option as correct.';
            return;
          }
          question.correct = correctIdx;
        }
      }

      $('qf-err').textContent = '';
      const editedIndex = S.editingQuestionIndex;
      if(editedIndex !== null) S.questionsDraft[editedIndex] = question;
      else S.questionsDraft.push(question);

      cancelEditQuestion();
      renderHostQList();
      pushQuestionsToState();
      if(editedIndex !== null) qzScrollBackToQuestion(editedIndex);
    };
    $('qf-cancel-edit').onclick = ()=>{
      const editedIndex = S.editingQuestionIndex;
      cancelEditQuestion();
      renderHostQList();
      if(editedIndex !== null) qzScrollBackToQuestion(editedIndex);
    };
    renderHostQList();
    $('btn-start-quiz').onclick = beginQuiz;

    let pendingPermanentDeleteKey = null;

    $('qf-toggle-archive').onclick = async ()=>{
      S.viewingArchive = !S.viewingArchive;
      pendingPermanentDeleteKey = null;
      $('qf-save-msg').textContent = '';
      await refreshSavedQuizList();
    };

    $('qf-saved-select').addEventListener('change', ()=>{
      pendingPermanentDeleteKey = null;
      const delBtn = $('qf-delete-saved');
      if(delBtn && S.viewingArchive) delBtn.textContent = 'Delete permanently';
    });

    $('qf-load-saved').onclick = async ()=>{
      const key = $('qf-saved-select').value;
      if(!key) return;
      if(S.viewingArchive){
        const data = await fbGet(savedQuizPath(key));
        if(!data) return;
        data.archived = false;
        await fbSet(savedQuizPath(key), data);
        S.viewingArchive = false;
        pendingPermanentDeleteKey = null;
        await refreshSavedQuizList();
        $('qf-save-msg').style.color = 'var(--correct)';
        $('qf-save-msg').textContent = 'Restored "'+data.name+'".';
        return;
      }
      const data = await fbGet(savedQuizPath(key));
      if(!data) return;
      S.questionsDraft = JSON.parse(JSON.stringify(data.questions||[]));
      S.loadedQuizId = key;
      cancelEditQuestion();
      renderHostQList();
      pushQuestionsToState();
      $('qf-save-name').value = data.name;
      updateSaveButtonMode();
      $('qf-save-msg').style.color = 'var(--correct)';
      $('qf-save-msg').textContent = 'Loaded "'+data.name+'".';
    };
    
    $('qf-delete-saved').onclick = async ()=>{
      const key = $('qf-saved-select').value;
      if(!key) return;
      if(S.viewingArchive){
        if(pendingPermanentDeleteKey !== key){
          pendingPermanentDeleteKey = key;
          $('qf-delete-saved').textContent = 'Click again to confirm';
          return;
        }
        await fbDelete(savedQuizPath(key));
        pendingPermanentDeleteKey = null;
        await refreshSavedQuizList();
        return;
      }
      const data = await fbGet(savedQuizPath(key));
      if(!data) return;
      data.archived = true;
      data.archivedAt = Date.now();
      await fbSet(savedQuizPath(key), data);
      if(S.loadedQuizId === key){ S.loadedQuizId = null; updateSaveButtonMode(); }
      await refreshSavedQuizList();
    };
    
    $('qf-save-quiz').onclick = async ()=>{
      const name = $('qf-save-name').value.trim();
      if(!name){ $('qf-save-msg').style.color = 'var(--wrong)'; $('qf-save-msg').textContent = 'Give your quiz a name first.'; return; }
      if(S.questionsDraft.length===0){ $('qf-save-msg').style.color = 'var(--wrong)'; $('qf-save-msg').textContent = 'Add at least one question.'; return; }
      const id = S.loadedQuizId || genId();
      await fbSet(savedQuizPath(id), { name, questions: S.questionsDraft, savedAt: Date.now(), archived:false, ownerUid: currentUserUid });
      S.loadedQuizId = id;
      updateSaveButtonMode();
      $('qf-save-msg').style.color = 'var(--correct)';
      $('qf-save-msg').innerHTML = 'Saved "'+escapeHtml(name)+'". <button type="button" id="qf-go-launch" class="studio-inline-link">Go to My Quizzes / Launch →</button>';
      const goLaunch = $('qf-go-launch');
      if(goLaunch) goLaunch.onclick = ()=>buildHostSetup('launch');
      await refreshSavedQuizList();
    };

    $('qf-clear-queue').onclick = () => {
      if (confirm('Clear all questions from the current queue?')) {
        S.questionsDraft = [];
        cancelEditQuestion();
        renderHostQList();
        pushQuestionsToState();
      }
    };

    updateSaveButtonMode();
    refreshSavedQuizList();
    applyHostWorkspaceMode(S.hostWorkspaceMode);
  }

  function applyHostWorkspaceMode(mode){
    const studio = mode === 'studio';
    S.hostWorkspaceMode = studio ? 'studio' : 'launch';
    const root = $('screen-host-setup');
    if(!root) return;

    root.classList.toggle('host-workspace-studio', studio);
    root.classList.toggle('host-workspace-launch', !studio);

    root.querySelectorAll('.host-studio-only').forEach(el=>{
      if(el.id === 'qf-save-as-new') el.style.display = 'none';
      else el.style.display = studio ? '' : 'none';
    });
    root.querySelectorAll('.host-launch-only').forEach(el=>{
      el.style.display = studio ? 'none' : '';
    });

    const title = $('host-workspace-title');
    const kicker = $('host-workspace-kicker');
    const subtitle = $('host-workspace-subtitle');
    if(title) title.textContent = studio ? 'Quiz Studio' : 'My Quizzes / Launch';
    if(kicker) kicker.textContent = studio ? 'CREATE' : 'PLAY';
    if(subtitle) subtitle.textContent = studio
      ? 'Generate with AI, create questions manually, review them and save your quiz.'
      : 'Load a saved quiz, choose how players compete, invite them and start the live game.';

    const studioTab = $('host-tab-studio');
    const launchTab = $('host-tab-launch');
    if(studioTab){
      studioTab.classList.toggle('active', studio);
      studioTab.onclick = ()=>buildHostSetup('studio');
    }
    if(launchTab){
      launchTab.classList.toggle('active', !studio);
      launchTab.onclick = ()=>buildHostSetup('launch');
    }

    const queueTitle = $('host-queue-title');
    if(queueTitle) queueTitle.textContent = studio ? 'Question queue' : 'Quiz preview';

    renderHostQList();
  }

  function updateSaveButtonMode(){
    const saveBtn = $('qf-save-quiz');
    if(!saveBtn) return;
    saveBtn.textContent = S.loadedQuizId ? 'Update saved quiz' : 'Save';
  }

  function qzScrollToEditor(){
    const pane=$('host-question-editor-pane');
    if(!pane)return;
    pane.scrollIntoView({behavior:'smooth',block:'start'});
    const card=pane.querySelector('.card');
    if(card){card.classList.remove('qz-edit-focus');void card.offsetWidth;card.classList.add('qz-edit-focus');}
  }

  function qzScrollBackToQuestion(i){
    requestAnimationFrame(()=>setTimeout(()=>{
      const card=document.getElementById('qz-question-card-'+i);
      if(!card)return;
      card.scrollIntoView({behavior:'smooth',block:'center'});
      card.classList.remove('qz-return-focus');void card.offsetWidth;card.classList.add('qz-return-focus');
    },100));
  }

  function startEditQuestion(i){
    const q = S.questionsDraft[i];
    if(!q) return;
    S.editingQuestionIndex = i;
    S.questionType = normalizedQuestionType(q);
    $('qf-type').value = S.questionType;
    $('qf-text').value = q.q;
    $('qf-time').value = q.timeLimit;
    $('qf-points').value = q.points;
    $('qf-explanation').value = q.explanation || '';
    $('qf-image-url').value = q.imageUrl || '';

    if(S.questionType==='typed'){
      S.formOpts = [{text:'',correct:true},{text:'',correct:false}];
      $('qf-typed-answers').value = (q.acceptedAnswers||[]).join('\n');
    }else{
      const correctSet = new Set(getCorrectIndexes(q));
      S.formOpts = (q.options||[]).map((opt,idx)=>({ text:opt, correct:correctSet.has(idx) }));
      $('qf-typed-answers').value = '';
    }

    updateQuestionTypeUI();
    $('qf-heading').textContent = 'Edit question';
    $('qf-add').textContent = 'Save changes';
    $('qf-cancel-edit').style.display = '';
    requestAnimationFrame(()=>setTimeout(qzScrollToEditor,80));
  }

  function cancelEditQuestion(){
    S.editingQuestionIndex = null;
    S.questionType = 'multiple_choice';
    $('qf-type').value = 'multiple_choice';
    $('qf-text').value = '';
    $('qf-time').value = String(DEFAULT_QUESTION_TIME);

  function normalizedTopicKey(text){

      .normalize('NFKC')

  function isGeneralKnowledgeTopic(topic){

  function topicDifficultyLabel(topic){

    if(/\bhard\b|\bdifficult\b|\bexpert\b|صعب/u.test(t)) return 'Hard';

  function buildGenerationScope(topic,count,attempt=0,structuredScope={}){
    const structuredParts = [
      structuredScope.category ? 'Category: '+structuredScope.category : '',
      structuredScope.topic ? 'Topic: '+structuredScope.topic : '',
      structuredScope.region ? 'Country / Region: '+structuredScope.region : '',
      structuredScope.timePeriod ? 'Time period: '+structuredScope.timePeriod : '',
      structuredScope.focus ? 'Specific focus: '+structuredScope.focus : '',
      structuredScope.year ? 'Year level: '+structuredScope.year : '',
      structuredScope.subject ? 'Subject: '+structuredScope.subject : '',
      structuredScope.difficulty ? 'Difficulty: '+structuredScope.difficulty : ''
    ].filter(Boolean);

    if(!isGeneralKnowledgeTopic(topic)){
      return {
        generalKnowledge:false,
        coverageCategories:[],
        instruction:[
          'HOST SCOPE CONTRACT: '+String(topic||'').trim(),
          structuredParts.length ? 'STRUCTURED HOST SCOPE: '+structuredParts.join(' | ') : '',
          'Generate only questions that directly belong to this host-requested scope.',
          'Treat every populated structured field as a required scope constraint, not a suggestion.',
          'Do not import themes, entities, examples, places, eras, or subject matter from any previous quiz generation.'
        ].filter(Boolean).join(' ')
      };
    }

    const difficulty = topicDifficultyLabel(topic);
    const categories = GENERAL_KNOWLEDGE_CATEGORIES.slice();
    const shift = Math.abs(Number(attempt)||0) % categories.length;
    const rotated = categories.slice(shift).concat(categories.slice(0,shift));
    const selected = rotated.slice(0,Math.min(Math.max(1,count),categories.length));

    return {
      generalKnowledge:true,
      coverageCategories:selected,
      instruction:[
        'GENERAL KNOWLEDGE COVERAGE CONTRACT.',
        'Difficulty: '+difficulty+'.',
        structuredParts.length ? 'STRUCTURED HOST SCOPE: '+structuredParts.join(' | ') : '',
        structuredScope.region
          ? 'Keep every question within the requested country / region: '+structuredScope.region+'.'
          : 'Use a broad worldwide mix rather than concentrating on one country, celebrity, film, music scene, franchise, era, or industry.',
        structuredScope.timePeriod ? 'Keep every question within this time period: '+structuredScope.timePeriod+'.' : '',
        structuredScope.focus ? 'Apply this specific focus: '+structuredScope.focus+'.' : '',
        'For this batch use these categories: '+selected.join(' | ')+'.',
        'Include a JSON field named category on every question, using exactly one of those category labels.',
        'Use every listed category once before repeating any category.',
        'Do not generate more than one question about the same person, work, franchise, team, country-specific entertainment scene, or underlying fact in this batch.',
        'Questions must feel like a balanced general-knowledge quiz at '+difficulty.toLowerCase()+' difficulty.'
      ].join(' ')
    };
  }

  function correctAnswerFingerprint(q){
    if(!q || !Array.isArray(q.options)) return '';
    if(q.type==='multiple_correct' && Array.isArray(q.correctIndexes)){
      return q.correctIndexes
        .map(i=>q.options[i])
        .filter(v=>v!=null)
        .map(normalizeQuestionFingerprint)
        .sort()
        .join('|');
    }
    const idx = Number(q.correct);
    return Number.isInteger(idx) && q.options[idx]!=null
      ? normalizeQuestionFingerprint(q.options[idx])
      : '';
  }

  function canonicalFactKey(q){
    const stored = q && q.aiMeta && q.aiMeta.factKey;
    if(stored) return normalizedTopicKey(stored);
    const stem = normalizeQuestionFingerprint(q && q.q);
    const answer = correctAnswerFingerprint(q);
    return [stem,answer].filter(Boolean).join('|');
  }

  function sameRequestedTopic(q,topic){
    const previous = q && q.aiMeta && q.aiMeta.requestedTopic;
    if(!previous) return false;
    return normalizedTopicKey(previous) === normalizedTopicKey(topic);
  }

  function sameTopicFactKeys(existing,topic){
    const out = [];
    for(const q of Array.isArray(existing)?existing:[]){
      if(!sameRequestedTopic(q,topic)) continue;
      const key = canonicalFactKey(q);
      if(key && !out.includes(key)) out.push(key);
    }
    return out.slice(-80);
  }

  function isDuplicateGeneratedQuestion(candidate,existing){
    const candidateFact = canonicalFactKey(candidate);
    const candidateAnswer = correctAnswerFingerprint(candidate);

    return (Array.isArray(existing)?existing:[]).some(q=>{
      if(!q) return false;

      const existingFact = canonicalFactKey(q);
      if(candidateFact && existingFact && candidateFact===existingFact) return true;

      const sim = questionSimilarity(candidate.q,q.q);
      if(sim >= .72) return true;

      const existingAnswer = correctAnswerFingerprint(q);
      if(candidateAnswer && existingAnswer && candidateAnswer===existingAnswer && sim >= .48) return true;

      const cEvidence = normalizedTopicKey(candidate?.aiMeta?.evidence||'');
      const eEvidence = normalizedTopicKey(q?.aiMeta?.evidence||'');
      if(candidateAnswer && candidateAnswer===existingAnswer &&
         cEvidence.length>24 && eEvidence.length>24 &&
         (cEvidence.includes(eEvidence) || eEvidence.includes(cEvidence))) return true;

      return false;
    });
  }

  function newGenerationId(){
    return 'gen_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
  }

  function normalizeQuestionFingerprint(text){
    return String(text||'')
      .normalize('NFKC')
      .toLocaleLowerCase()
      .replace(/&[a-z]+;/g,' ')
      .replace(/[^\p{L}\p{N}\s]/gu,' ')
      .replace(/\b(the|a|an|is|are|was|were|of|to|in|on|for|and|or|which|what|who|when|where|how)\b/g,' ')
      .replace(/(?:^|\s)(?:ما|من|في|على|إلى|الى|عن|هو|هي|هم|هذا|هذه|الذي|التي|أي|اي|إيه|مين|فين|إمتى)(?=\s|$)/gu,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function questionTokenSet(text){
    return new Set(normalizeQuestionFingerprint(text).split(' ').filter(w=>w.length>2));
  }

  function questionSimilarity(a,b){
    const na = normalizeQuestionFingerprint(a);
    const nb = normalizeQuestionFingerprint(b);
    if(!na || !nb) return 0;
    if(na===nb) return 1;
    if(na.length>20 && nb.length>20 && (na.includes(nb) || nb.includes(na))) return .93;
    const A = questionTokenSet(na), B = questionTokenSet(nb);
    if(!A.size || !B.size) return 0;
    let intersection = 0;
    A.forEach(x=>{ if(B.has(x)) intersection++; });
    const union = new Set([...A,...B]).size;
    return union ? intersection/union : 0;
  }

  function isNearDuplicateQuestion(candidate, existing){
    return existing.some(q=>{
      const stem = typeof q==='string' ? q : q && q.q;
      return stem && questionSimilarity(candidate,stem) >= .68;
    });
  }

  function cleanSourceText(text){
    return String(text||'')
      .replace(/\u0000/g,' ')
      .replace(/[ \t]+/g,' ')
      .replace(/\n{3,}/g,'\n\n')
      .trim();
  }

  async function extractQuizSourceDocument(file){
    const name = String(file && file.name || '');
    const ext = name.split('.').pop().toLowerCase();

    if(ext==='txt'){
      const text = cleanSourceText(await file.text());
      if(text.length < 80) throw new Error('This text file does not contain enough readable content.');
      return {type:'txt', text:text.slice(0,220000), pages:0};
    }

    if(ext==='docx'){
      if(!window.mammoth) throw new Error('The Word document reader could not load. Check your internet connection and try again.');
      const buffer = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({arrayBuffer:buffer});
      const text = cleanSourceText(result.value);
      if(text.length < 80) throw new Error('No usable text could be extracted from this Word document.');
      return {type:'docx', text:text.slice(0,220000), pages:0};
    }

    if(ext==='pdf'){
      if(!window.pdfjsLib) throw new Error('The PDF reader could not load. Check your internet connection and try again.');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;
      const pages = [];
      const pageLimit = Math.min(pdf.numPages,250);
      for(let p=1;p<=pageLimit;p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const pageText = content.items.map(it=>it.str).join(' ');
        if(pageText.trim()) pages.push('[Page '+p+']\n'+pageText.trim());
        if(pages.join('\n\n').length > 220000) break;
      }
      const text = cleanSourceText(pages.join('\n\n')).slice(0,220000);
      if(text.length < 80) throw new Error('No selectable text could be extracted. This PDF may be scanned/image-only.');
      return {type:'pdf', text, pages:pdf.numPages};
    }

    throw new Error('Unsupported file type. Please use PDF, DOCX or TXT.');
  }


  function selectSourceExcerpt(sourceText, topic, batchNumber, maxChars=15000){
    const text = cleanSourceText(sourceText);
    if(text.length <= maxChars) return text;

    const paragraphs = text.split(/\n{2,}|(?<=\.)\s+(?=[A-Z\[])/).map(p=>p.trim()).filter(p=>p.length>50);
    const terms = normalizeQuestionFingerprint(topic).split(' ').filter(w=>w.length>3);
    const scored = paragraphs.map((p,i)=>{
      const lower = p.toLowerCase();
      let score = 0;
      terms.forEach(t=>{ if(lower.includes(t)) score += 3; });
      if(/^\[Page \d+\]/.test(p)) score += .2;
      return {p,i,score};
    });

    scored.sort((a,b)=>b.score-a.score || a.i-b.i);
    const chosen = [];
    let chars = 0;
    for(const item of scored){
      if(chars + item.p.length > maxChars && chosen.length) continue;
      chosen.push(item);
      chars += item.p.length + 2;
      if(chars >= maxChars) break;
    }

    // If relevance scoring is weak, rotate through the source for later batches.
    if(!chosen.length || chosen[0].score===0){
      const start = ((batchNumber||0) * maxChars) % Math.max(1,text.length);
      return (text.slice(start,start+maxChars) + '\n' + text.slice(0,Math.max(0,maxChars-(text.length-start)))).slice(0,maxChars);
    }

    chosen.sort((a,b)=>a.i-b.i);
    return chosen.map(x=>x.p).join('\n\n').slice(0,maxChars);
  }


  function sourceFocusTerms(topic){
    return normalizeQuestionFingerprint(topic)
      .split(' ')
      .filter(w=>w.length>2)
      .filter(w=>!['focus','question','questions','quiz','general','knowledge','about','from','source','page'].includes(w));
  }

  function findFocusedSourceSection(sourceText, topic){
    const text = cleanSourceText(sourceText);
    const terms = sourceFocusTerms(topic);
    if(!text || !terms.length) return {text, label:''};

    const headingRe = /^(#{1,6})\s+(.+)$/gm;
    const headings = [];
    let m;
    while((m = headingRe.exec(text))){
      const title = String(m[2]||'').replace(/\s+/g,' ').trim();
      const titleNorm = normalizeQuestionFingerprint(title);
      let score = 0;
      for(const term of terms){
        if(titleNorm === term) score += 10;
        else if(titleNorm.includes(term)) score += 6;
      }
      if(score>0){
        headings.push({
          start:m.index,
          contentStart:headingRe.lastIndex,
          level:m[1].length,
          title,
          score
        });
      }
    }

    if(!headings.length) return {text, label:''};

    headings.sort((a,b)=>b.score-a.score || a.start-b.start);
    const best = headings[0];

    // End at the next heading of the same or higher level.
    headingRe.lastIndex = best.contentStart;
    let end = text.length;
    while((m = headingRe.exec(text))){
      if(m[1].length <= best.level){
        end = m.index;
        break;
      }
    }

    const section = text.slice(best.start,end).trim();
    if(section.length < 500) return {text, label:''};
    return {text:section, label:best.title};
  }

  function selectRotatingSourceWindow(text, batchNumber, maxChars=19000){
    const clean = cleanSourceText(text);
    if(clean.length <= maxChars) return clean;

    // Use overlapping windows so a fact near a boundary is not lost.
    const overlap = Math.min(2200, Math.floor(maxChars * .14));
    const step = Math.max(3000, maxChars - overlap);
    const starts = [];
    for(let start=0; start<clean.length; start+=step){
      starts.push(start);
      if(start + maxChars >= clean.length) break;
    }

    const index = Math.max(0,Number(batchNumber)||0) % Math.max(1,starts.length);
    let start = starts[index] || 0;

    // Prefer a paragraph / heading boundary near the start.
    if(start>0){
      const boundary = clean.indexOf('\n\n',start);
      if(boundary>=start && boundary<start+700) start=boundary+2;
    }

    return clean.slice(start,start+maxChars).trim();
  }

  function selectSourceLinkExcerpt(sourceText, topic, batchNumber, maxChars=19000){
    const clean = cleanSourceText(sourceText);
    if(clean.length <= maxChars) return clean;

    const focused = findFocusedSourceSection(clean,topic);
    const working = focused.text || clean;

    // Critical difference from the old selector:
    // rotate on EVERY retry/batch, even when the focus term matched strongly.
    const rotated = selectRotatingSourceWindow(working,batchNumber,maxChars);

    // If the focused section is too small to provide multiple windows, later
    // retries broaden into the surrounding full page rather than repeatedly
    // asking about the same facts.
    if(batchNumber>0 && working.length <= maxChars * 1.25){
      return selectRotatingSourceWindow(clean,batchNumber,maxChars);
    }
    return rotated;
  }

  function parseAICorrectIndexes(item, options){
    const max = options.length;
    let raw = null;
    if(Array.isArray(item.correctIndexes)) raw = item.correctIndexes;
    else if(Array.isArray(item.correctIndices)) raw = item.correctIndices;
    else if(Array.isArray(item.correctAnswers)) raw = item.correctAnswers;
    else if(Array.isArray(item.correctIndex)) raw = item.correctIndex;
    if(!raw) return [];
    const indexes = [];
    raw.forEach(v=>{
      if(typeof v==='number' || /^\d+$/.test(String(v).trim())){
        const n = parseInt(v,10);
        if(Number.isInteger(n) && n>=0 && n<max) indexes.push(n);
      }else{
        const text = String(v).trim().toLowerCase();
        const idx = options.findIndex(o=>String(o).trim().toLowerCase()===text);
        if(idx>=0) indexes.push(idx);
      }
    });
    return [...new Set(indexes)].sort((a,b)=>a-b);
  }

  function aiQuestionStructuralCheck(q){
    if(!q || !q.q || !Array.isArray(q.options) || q.options.length<2) return false;
    const uniqueOptions = new Set(q.options.map(o=>String(o).trim().toLowerCase()));
    if(uniqueOptions.size !== q.options.length) return false;
    if(q.type==='multiple_correct'){
      return Array.isArray(q.correctIndexes) && q.correctIndexes.length>=2 &&
        q.correctIndexes.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length);
    }
    return Number.isInteger(q.correct) && q.correct>=0 && q.correct<q.options.length;
  }
