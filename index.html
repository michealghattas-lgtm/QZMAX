  async function enterPlayerExam(st){
    clearInterval(S.playerTimerHandle);
    const [allAnswersRaw,currentPlayer] = await Promise.all([
      fbGet('rooms/'+S.code+'/answers'),
      fbGet(playerPath(S.code,S.pid))
    ]);

    if(currentPlayer && currentPlayer.examSubmittedAt){
      showPlayerExamSubmitted(st,!!currentPlayer.examAutoSubmitted);
      return;
    }

    const allAnswers = allAnswersRaw || {};
    const questions = st.questions || [];
    if(!questions.length) return;
    S.examQuestionIndex = Math.max(0,Math.min(questions.length-1,Number(S.examQuestionIndex)||0));

    const playerAnswers = {};
    questions.forEach((q,qi)=>{
      const a = allAnswers[qi] && allAnswers[qi][S.pid];
      if(a) playerAnswers[qi] = a;
    });

    const countAnswered = ()=>Object.values(playerAnswers).filter(answerSubmitted).length;

    const renderExamQuestion = (qi)=>{
      S.examQuestionIndex = Math.max(0,Math.min(questions.length-1,qi));
      const q = questions[S.examQuestionIndex];
      const type = normalizedQuestionType(q);
      const existing = playerAnswers[S.examQuestionIndex] || null;
      const answeredCount = countAnswered();
      const selectedSet = new Set(
        type==='multiple_correct' && existing && Array.isArray(existing.answerIndexes)
          ? existing.answerIndexes.map(Number) : []
      );

      let answerHtml = '';
      if(type==='typed'){
        answerHtml =
          '<div class="typed-player-box exam-typed-box">'+
            '<input type="text" id="exam-typed-input" maxlength="120" autocomplete="off" placeholder="Type your answer..." value="'+escapeHtml(existing&&existing.answerText?existing.answerText:'')+'">'+
            '<button class="btn btn-primary" id="exam-save-typed">Save answer</button>'+
          '</div>';
      }else{
        answerHtml =
          '<div class="live-answer-grid exam-answer-grid">'+
            (q.options||[]).map((o,i)=>{
              const selected = type==='multiple_correct'
                ? selectedSet.has(i)
                : !!(existing && existing.answerIndex===i);
              return '<div class="live-answer opt-card'+(selected?' selected':'')+'" data-i="'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="live-answer-text">'+escapeHtml(o)+'</span></div>';
            }).join('')+
          (type==='multiple_correct'
            ? '<div class="multi-cue">Select every answer you believe is correct. Changes save automatically.</div>'
            : '');
      }

      const palette = questions.map((qq,i)=>
        '<button class="exam-palette-btn'+(i===S.examQuestionIndex?' current':'')+(answerSubmitted(playerAnswers[i])?' answered':'')+'" data-exam-q="'+i+'">'+(i+1)+'</button>'
      ).join('');

      $('screen-player-question').innerHTML =
        '<div class="exam-player-shell">'+
          '<div class="exam-player-top">'+
            '<div><div class="eyebrow">📝 Exam Mode</div><strong>Question '+(S.examQuestionIndex+1)+' of '+questions.length+'</strong></div>'+
            '<div class="exam-player-progress"><span>'+answeredCount+' answered</span><div class="live-progress"><span style="width:'+Math.round((answeredCount/questions.length)*100)+'%;"></span></div></div>'+
            '<div class="exam-clock-card compact"><span>Time remaining</span><strong id="player-exam-clock">--:--</strong></div>'+
          '</div>'+
          '<div class="exam-player-layout">'+
            '<div class="exam-question-card">'+
              '<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;"><span class="qtype-pill">'+questionTypeLabel(q)+'</span><span class="live-micro-pill">'+Number(q.points||DEFAULT_QUESTION_POINTS)+' pts</span></div>'+
              '<h2 class="live-question-text">'+escapeHtml(q.q)+'</h2>'+
              questionMediaHtml(q)+
              answerHtml+
              '<div class="exam-save-status" id="exam-save-status">'+(answerSubmitted(existing)?'✓ Answer saved':'Choose or enter your answer')+'</div>'+
              '<div class="exam-nav">'+
                '<button class="btn btn-ghost" id="exam-prev" '+(S.examQuestionIndex===0?'disabled':'')+'>← Previous</button>'+
                '<button class="btn btn-ghost" id="exam-next" '+(S.examQuestionIndex===questions.length-1?'disabled':'')+'>Next →</button>'+
              '</div>'+
            '</div>'+
            '<div class="exam-side-panel">'+
              '<div class="exam-side-head"><strong>Questions</strong><span>'+answeredCount+'/'+questions.length+'</span></div>'+
              '<div class="exam-palette">'+palette+'</div>'+
              '<button class="btn btn-primary btn-block" id="exam-submit-all">Submit exam</button>'+
              '<p>Answers can be changed until you submit or time expires.</p>'+
            '</div>'+
          '</div>'+
        '</div>';
      showScreen('screen-player-question');

      const saveStatus = msg=>{
        const el=$('exam-save-status');
        if(el) el.textContent=msg;
      };

      if(type==='typed'){
        $('exam-save-typed').onclick = async ()=>{
          const val=$('exam-typed-input').value.trim();
          if(!val){
            delete playerAnswers[S.examQuestionIndex];
            await fbDelete(answerPath(S.code,S.examQuestionIndex,S.pid));
            saveStatus('Answer cleared');
          }else{
            const data={pid:S.pid,answerText:val,savedAt:getSyncedTime(),exam:true};
            playerAnswers[S.examQuestionIndex]=data;
            await fbSet(answerPath(S.code,S.examQuestionIndex,S.pid),data);
            saveStatus('✓ Answer saved');
          }
          renderExamQuestion(S.examQuestionIndex);
        };
      }else if(type==='multiple_correct'){
        document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
          card.onclick = async ()=>{
            const i=parseInt(card.dataset.i,10);
            if(selectedSet.has(i)) selectedSet.delete(i); else selectedSet.add(i);
            if(selectedSet.size){
              const data={pid:S.pid,answerIndexes:[...selectedSet].sort((a,b)=>a-b),savedAt:getSyncedTime(),exam:true};
              playerAnswers[S.examQuestionIndex]=data;
              await fbSet(answerPath(S.code,S.examQuestionIndex,S.pid),data);
            }else{
              delete playerAnswers[S.examQuestionIndex];
              await fbDelete(answerPath(S.code,S.examQuestionIndex,S.pid));
            }
            renderExamQuestion(S.examQuestionIndex);
          };
        });
      }else{
        document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
          card.onclick = async ()=>{
            const i=parseInt(card.dataset.i,10);
            const data={pid:S.pid,answerIndex:i,savedAt:getSyncedTime(),exam:true};
            playerAnswers[S.examQuestionIndex]=data;
            await fbSet(answerPath(S.code,S.examQuestionIndex,S.pid),data);
            renderExamQuestion(S.examQuestionIndex);
          };
        });
      }

      $('exam-prev').onclick=()=>renderExamQuestion(S.examQuestionIndex-1);
      $('exam-next').onclick=()=>renderExamQuestion(S.examQuestionIndex+1);
      document.querySelectorAll('[data-exam-q]').forEach(btn=>{
        btn.onclick=()=>renderExamQuestion(parseInt(btn.dataset.examQ,10));
      });
      $('exam-submit-all').onclick=()=>{
        const answered=countAnswered();
        const missing=questions.length-answered;
        const text=missing
          ? 'Submit now? You still have '+missing+' unanswered question'+(missing===1?'':'s')+'.'
          : 'Submit your exam now? You will not be able to change answers after submitting.';
        if(confirm(text)) submitExamForPlayer(st,false);
      };

      const updatePlayerExamClock=()=>{
        const remaining=Number(st.examEndsAt||0)-getSyncedTime();
        const el=$('player-exam-clock');
        if(el) el.textContent=formatExamClock(remaining);
        if(remaining<=0) submitExamForPlayer(st,true);
      };
      updatePlayerExamClock();
      clearInterval(S.playerTimerHandle);
      S.playerTimerHandle=setInterval(updatePlayerExamClock,250);
    };

    renderExamQuestion(S.examQuestionIndex);
  }

  async function enterPlayerQuestion(st){
    const q = st.questions[st.currentIndex];
    const type = normalizedQuestionType(q);
    const [existingAnswer, currentPlayer] = await Promise.all([
      fbGet(answerPath(S.code, st.currentIndex, S.pid)),
      fbGet(playerPath(S.code, S.pid))
    ]);
    if(currentPlayer && currentPlayer.teamId){
      S.teamId = currentPlayer.teamId;
      savePlayerSession();
    }

    let answered = answerSubmitted(existingAnswer);
    const questionsAfter = st.questions.length - (st.currentIndex + 1);
    const total = st.questions.length;
    const progress = Math.max(3, Math.round(((st.currentIndex + 1) / total) * 100));
    const selectedExisting = new Set(
      type==='multiple_correct' && existingAnswer && Array.isArray(existingAnswer.answerIndexes)
        ? existingAnswer.answerIndexes.map(Number)
        : []
    );

    let answerArea = '';
    let help = 'Choose the best answer';

    if(type==='typed'){
      help = 'Type your answer, then lock it in';
      answerArea =
        '<div class="typed-player-box">'+
          '<input type="text" id="pq-typed-input" maxlength="120" autocomplete="off" placeholder="Type your answer..." '+(answered?'disabled':'')+' value="'+escapeHtml(existingAnswer&&existingAnswer.answerText?existingAnswer.answerText:'')+'">'+
          '<button class="btn btn-primary" id="pq-typed-submit" '+(answered?'disabled':'')+'>Lock answer</button>'+
        '</div>';
    }else{
      if(type==='multiple_correct') help = 'Select all correct answers, then submit';
      answerArea =
        '<div class="live-answer-grid">'+
          (q.options||[]).map((o,i)=>{
            const selected = type==='multiple_correct'
              ? selectedExisting.has(i)
              : !!(existingAnswer && existingAnswer.answerIndex===i);
            return '<div class="live-answer opt-card'+(answered?' disabled':'')+(selected?' selected':'')+'" data-i="'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="live-answer-text">'+escapeHtml(o)+'</span></div>';
          }).join('')+
        '</div>'+
        (type==='multiple_correct'
          ? '<div class="multi-cue">✓ More than one answer can be correct</div><div class="multi-submit-wrap"><button class="btn btn-primary" id="pq-multi-submit" '+(answered?'disabled':'')+'>Submit selected answers</button></div>'
          : '');
    }

    $('screen-player-question').innerHTML =
      '<div class="live-game-shell">'+
        '<div class="live-game-top">'+
          '<div class="live-progress-wrap"><span class="live-q-meta">Question '+(st.currentIndex+1)+' of '+total+'</span><div class="live-progress"><span style="width:'+progress+'%;"></span></div></div>'+
          '<div class="live-timer-shell">'+ringSvg('player-ring')+'</div>'+
          '<div class="live-room-pill"><span>Session</span><strong>'+S.code+'</strong></div>'+
        '</div>'+
        '<div class="live-question-panel">'+
          '<div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;"><div class="live-category qz-live-brand">✦ QZMAX</div><span class="qtype-pill">'+questionTypeLabel(q)+'</span><span class="qtype-pill">v'+APP_VERSION+'</span></div>'+
          '<h2 class="live-question-text">'+escapeHtml(q.q)+'</h2>'+
          questionMediaHtml(q)+
          '<p class="live-question-help">'+help+'</p>'+
          answerArea+
          '<div id="pq-status" class="live-answer-status">'+(answered?'<strong>Your answer is already locked in.</strong> Waiting for the reveal…':'Choose your answer to lock it in.')+'</div>'+
        '</div>'+
        '<div class="live-question-footer"><span class="live-micro-pill">'+(questionsAfter>0 ? questionsAfter+' questions after this' : 'Final question')+'</span><span class="live-micro-pill">Faster correct answers earn more points</span>'+(st.gameMode==='teams'?'<span class="team-badge">👥 '+escapeHtml(teamName(st,S.teamId))+'</span>':'')+'</div>'+
      '</div>';
    showScreen('screen-player-question');

    const lockStatus = ()=>{
      $('pq-status').innerHTML = '<strong>Answer locked in!</strong> Your response has been recorded.';
    };

    if(type==='typed'){
      const submitTyped = async ()=>{
        if(answered) return;
        const inp = $('pq-typed-input');
        const answerText = inp.value.trim();
        if(!answerText){
          $('pq-status').textContent = 'Type an answer before locking it in.';
          return;
        }
        answered = true;
        inp.disabled = true;
        $('pq-typed-submit').disabled = true;
        const timeMs = getSyncedTime()-st.questionStartedAt;
        lockStatus();
        await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerText, timeMs, submittedAt:getSyncedTime() });
      };
      if($('pq-typed-submit')) $('pq-typed-submit').onclick = submitTyped;
      if($('pq-typed-input')) $('pq-typed-input').addEventListener('keydown',e=>{ if(e.key==='Enter') submitTyped(); });
    }else if(type==='multiple_correct'){
      const selected = new Set(selectedExisting);
      document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
        card.onclick = ()=>{
          if(answered) return;
          const i = parseInt(card.dataset.i,10);
          if(selected.has(i)){ selected.delete(i); card.classList.remove('selected'); }
          else { selected.add(i); card.classList.add('selected'); }
          $('pq-status').textContent = selected.size ? selected.size+' selected — submit when ready.' : 'Select all answers you think are correct.';
        };
      });
      if($('pq-multi-submit')) $('pq-multi-submit').onclick = async ()=>{
        if(answered) return;
        if(!selected.size){
          $('pq-status').textContent = 'Select at least one answer first.';
          return;
        }
        answered = true;
        document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
        $('pq-multi-submit').disabled = true;
        const timeMs = getSyncedTime()-st.questionStartedAt;
        lockStatus();
        await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerIndexes:[...selected].sort((a,b)=>a-b), timeMs, submittedAt:getSyncedTime() });
      };
    }else{
      document.querySelectorAll('#screen-player-question .opt-card').forEach(card=>{
        card.onclick = async ()=>{
          if(answered) return;
          answered = true;
          const i = parseInt(card.dataset.i,10);
          const timeMs = getSyncedTime()-st.questionStartedAt;
          document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
          card.classList.add('selected');
          lockStatus();
          await fbSet(answerPath(S.code, st.currentIndex, S.pid), { pid:S.pid, answerIndex:i, timeMs, submittedAt:getSyncedTime() });
        };
      });
    }

    clearInterval(S.playerTimerHandle);
    S.playerTimerHandle = setInterval(()=>{
      const remaining = q.timeLimit - (getSyncedTime()-st.questionStartedAt)/1000;
      updateRing('player-ring', remaining, q.timeLimit);
      if(remaining<=0){
        clearInterval(S.playerTimerHandle);
        if(!answered){
          $('pq-status').innerHTML = '<strong>Time’s up.</strong> Waiting for the reveal…';
          document.querySelectorAll('#screen-player-question .opt-card').forEach(c=>c.classList.add('disabled'));
          if($('pq-multi-submit')) $('pq-multi-submit').disabled = true;
          if($('pq-typed-input')) $('pq-typed-input').disabled = true;
          if($('pq-typed-submit')) $('pq-typed-submit').disabled = true;
        }
      }
    }, 150);
  }

  async function enterPlayerReveal(st){
    clearInterval(S.playerTimerHandle);
    const me = await fbGet(playerPath(S.code, S.pid));
    if(me && me.teamId){ S.teamId = me.teamId; savePlayerSession(); }
    const q = st.questions[st.currentIndex];
    const correct = me ? me.lastCorrect : false;
    const points = me ? me.lastPoints : 0;
    const score = me ? me.score : 0;

    $('screen-player-reveal').innerHTML =
      '<div class="center-stage">'+
        '<div class="player-reveal-card '+(correct?'correct':'wrong')+'">'+
          '<div class="player-result-icon">'+(correct?'✓':'×')+'</div>'+
          '<div class="reveal-kicker">'+(correct?'Correct answer':'Not this time')+'</div>'+
          '<div class="player-points '+(correct?'good':'zero')+'">'+(correct?'+'+points:'+0')+'</div>'+
          '<p style="font-size:12px;">'+(st.gameMode==='teams'?'points added to '+escapeHtml(teamName(st,S.teamId)):'points this round')+'</p>'+
          '<div style="height:1px;background:rgba(130,160,220,.12);margin:18px 0;"></div>'+
          '<p style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7f8da5;">Correct answer</p>'+
          '<h3 style="font-size:21px;margin-top:6px;">'+escapeHtml(getCorrectAnswerDisplay(q))+'</h3>'+
          questionMediaHtml(q)+
          (q.explanation ? '<p style="margin-top:10px;">'+escapeHtml(q.explanation)+'</p>' : '')+
          '<div class="player-score-strip">'+
            '<div class="player-score-cell"><span>Total score</span><strong>'+score.toLocaleString()+'</strong></div>'+
            '<div class="player-score-cell"><span>Question</span><strong>'+(st.currentIndex+1)+' / '+st.questions.length+'</strong></div>'+
          '</div>'+
          '<p style="margin-top:15px;font-size:11px;">Waiting for the host to show the leaderboard…</p>'+
        '</div>'+
      '</div>';
    showScreen('screen-player-reveal');
  }

  async function enterPlayerLeaderboard(st){
    const players = await fetchAllPlayers(S.code);
    const me = players.find(p=>p.id===S.pid);

    if(st.gameMode==='teams'){
      if(me && me.teamId) S.teamId = me.teamId;
      const standings = getTeamStandings(players, st);
      const myTeamRank = standings.findIndex(t=>t.id===S.teamId)+1;
      const myTeam = standings.find(t=>t.id===S.teamId);

      $('screen-player-leaderboard').innerHTML =
        '<div class="leader-shell">'+
          '<div class="leader-head">'+
            '<div class="eyebrow">Team leaderboard</div>'+
            '<div class="leader-title">'+(myTeamRank===1?'Your team is leading!':escapeHtml(myTeam?myTeam.name:'Your team')+' is #'+(myTeamRank||'-'))+'</div>'+
            '<div class="leader-round-star">'+(me&&me.lastCorrect?('You added +'+me.lastPoints+' points'):'No points this round')+' · Team total '+(myTeam?(myTeam.score||0).toLocaleString():0)+'</div>'+
          '</div>'+
          '<div class="team-leader-list">'+renderTeamRows(standings,S.teamId)+'</div>'+
          '<div style="text-align:center;margin-top:15px;"><span class="live-micro-pill">Your score: '+(me?(me.score||0).toLocaleString():0)+'</span><p style="margin-top:12px;">Waiting for the next question…</p></div>'+
        '</div>';
    }else{
      const myRank = players.findIndex(p=>p.id===S.pid)+1;
      const prevRanks = previousRankMap(players);
      const previousRank = me ? prevRanks[me.id] : null;
      const moved = previousRank && myRank ? previousRank - myRank : 0;
      let movementText = 'Holding position';
      if(moved > 0) movementText = '↑ Up '+moved+' place'+(moved===1?'':'s');
      if(moved < 0) movementText = '↓ Down '+Math.abs(moved)+' place'+(Math.abs(moved)===1?'':'s');

      $('screen-player-leaderboard').innerHTML =
        '<div class="leader-shell">'+
          '<div class="leader-head">'+
            '<div class="eyebrow">Leaderboard</div>'+
            '<div class="leader-title">'+(myRank===1?'You’re leading!':'You’re #'+(myRank||'-'))+'</div>'+
            '<div class="leader-round-star">'+movementText+' · '+(me&&me.lastCorrect?('+'+me.lastPoints+' this round'):'+0 this round')+'</div>'+
          '</div>'+
          '<div class="momentum-list">'+
            players.slice(0,8).map((p,i)=>
              '<div class="momentum-row'+(i===0?' first':'')+(p.id===S.pid?' me':'')+'">'+
                '<span class="momentum-rank">'+(i+1)+'</span>'+
                '<span class="momentum-name">'+escapeHtml(p.name)+(p.id===S.pid?' · You':'')+'</span>'+
                '<span class="momentum-score">'+(p.score||0).toLocaleString()+'</span>'+
                rankMoveHtml(i+1, prevRanks[p.id])+
              '</div>'
            ).join('')+
          '</div>'+
          '<div style="text-align:center;margin-top:15px;">'+
            '<span class="live-micro-pill">Total score: '+(me?(me.score||0).toLocaleString():0)+'</span>'+
            '<p style="margin-top:12px;">Waiting for the next question…</p>'+
          '</div>'+
        '</div>';
    }
    showScreen('screen-player-leaderboard');
  }

  async function enterPlayerFinal(){
    const [players, st] = await Promise.all([
      fetchAllPlayers(S.code),
      fbGet(statePath(S.code))
    ]);
    const me = players.find(p=>p.id===S.pid);
    if(me && me.teamId) S.teamId = me.teamId;

    if(st && st.gameMode==='teams'){
      const standings = getTeamStandings(players,st);
      const myTeamRank = standings.findIndex(t=>t.id===S.teamId)+1;
      const myTeam = standings.find(t=>t.id===S.teamId);

      $('screen-player-final').innerHTML =
        '<div class="center-stage">'+
          '<div class="team-final-hero">'+
            '<div class="trophy">'+(myTeamRank===1?'🏆':'👥')+'</div>'+
            '<div class="eyebrow">Team Battle final</div>'+
            '<h1>'+(myTeamRank===1?'Your team won!':escapeHtml(myTeam?myTeam.name:'Your team')+' finished #'+(myTeamRank||'-'))+'</h1>'+
            '<div class="score">'+(myTeam?(myTeam.score||0).toLocaleString():0)+' team points</div>'+
            '<p style="margin-top:7px;">Your contribution: '+(me?(me.score||0).toLocaleString():0)+' points</p>'+
          '</div>'+
          '<div class="team-leader-list">'+renderTeamRows(standings,S.teamId)+'</div>'+
          '<p style="margin-top:14px;">Stay here — if the host starts another quiz, you’ll rejoin automatically.</p>'+
          '<div class="chip" style="margin-top:4px;">Session <span class="code-text">'+S.code+'</span></div>'+
          '<button class="btn btn-ghost" id="player-leave-final" style="margin-top:8px;font-size:12px;">Leave this session</button>'+
        '</div>';
    }else{
      const myRank = players.findIndex(p=>p.id===S.pid)+1;
      $('screen-player-final').innerHTML =
        '<div class="center-stage">'+
          '<div class="eyebrow">'+(st&&st.sessionMode==='exam'?'Exam results':'Final results')+'</div>'+
          '<h1 style="font-size:33px;">'+(st&&st.sessionMode==='exam' ? ('You scored '+(me?me.score:0)+' points') : (myRank===1?'You won! 🏆':'You finished #'+myRank))+'</h1>'+
          '<div class="chip">Your score: '+(me?me.score:0)+'</div>'+
          '<div style="display:flex; flex-direction:column; gap:8px; width:100%; max-width:420px;">'+
            players.slice(0,5).map((p,i)=>'<div class="lb-row'+(p.id===S.pid?' me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+escapeHtml(p.name)+'</span><span class="lb-score">'+p.score+'</span></div>').join('')+
          '</div>'+
          '<p style="margin-top:14px;">Stay here — if the host starts another quiz, you’ll rejoin automatically.</p>'+
          '<div class="chip" style="margin-top:4px;">Session <span class="code-text">'+S.code+'</span></div>'+
          '<button class="btn btn-ghost" id="player-leave-final" style="margin-top:8px;font-size:12px;">Leave this session</button>'+
        '</div>';
    }

    showScreen('screen-player-final');
    const leaveBtn = $('player-leave-final');
    if(leaveBtn) leaveBtn.onclick = leavePlayerSession;
  }

  async function bootstrap(){
    const urlJoinCode = getJoinCodeFromUrl();
    if(urlJoinCode){
      if(await tryResumePlayerSession(urlJoinCode)) return;
      buildPlayerJoin();
      showScreen('screen-player-join');
      const codeInput = $('pj-code');
      if(codeInput) codeInput.value = urlJoinCode;
      return;
    }
    if(await tryResumeHostSession()) return;
    if(await tryResumePlayerSession()) return;
    buildRoleScreen();
  }
  bootstrap();
});
</script>
